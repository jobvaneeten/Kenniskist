name: Supabase keep-alive

# Voorkomt dat het gratis Supabase-project pauzeert na 7 dagen inactiviteit
# (bv. tijdens een schoolvakantie). 3x per week i.p.v. 2x: één overgeslagen
# run (GitHub slaat cron-jobs weleens over onder drukte) mag nooit meteen
# een gat van >7 dagen opleveren. workflow_dispatch staat erbij om de sleutels
# handmatig te kunnen testen.
on:
  schedule:
    - cron: '0 6 * * 1,3,5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST-API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # De publieke project-URL + anon key als vangnet. Diezelfde waarden
          # staan al in wrangler.jsonc en in src/lib/supabase.js (ze zitten
          # sowieso in elke browserbundel), dus dat geeft niets.
          PUBLIEK_URL="https://vbvtkzieyvdctlighgoj.supabase.co"
          PUBLIEK_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZidnRremlleXZkY3RsaWdoZ29qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NTQwNjUsImV4cCI6MjEwMDUzMDA2NX0.S_hAftcczB64X6kdjRnJTqBd_i7pbvefSaSB3RvAES4"

          # Roept public.keepalive() aan (migratie keepalive_functie): die telt
          # één keer de rijen in `klassen` en geeft 'ok' terug. Bewust niet
          # /rest/v1/ pingen — dat handelt PostgREST zelf af zonder Postgres aan
          # te raken, waardoor de runs van 3, 5 en 7 augustus 2026 groen stonden
          # terwijl het project alsnog in de auto-pause liep.
          #
          # Daarom eisen we hier hard een 200: een 404 (functie weg), een 401
          # (rechten weg) of 000 (subdomein weg, oftewel project gepauzeerd)
          # betekenen allemaal dat de database níét is aangeraakt, en dat hoort
          # rood te zijn in plaats van stilletjes groen. De `||` is nodig omdat
          # GitHub `bash -e` gebruikt: zonder dat vangnet stopt een curl-fout de
          # step vóór de controle eronder.
          probeer() {
            u="${1%/}"
            case "$u" in https://*|http://*) ;; *) u="https://$u" ;; esac
            for poging in 1 2 3; do
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
                "$u/rest/v1/rpc/keepalive" \
                -H "apikey: $2" -H "Authorization: Bearer $2") || status="000"
              echo "  poging $poging → HTTP $status"
              if [ "$status" = "200" ]; then return 0; fi
              sleep 5
            done
            return 1
          }

          # Eerst de secrets, daarna pas het vangnet: een secret die naar een
          # verwijderd project wijst (subdomein bestaat niet meer → curl 6) mag
          # de keep-alive niet slopen, maar moet wel opvallen.
          if [ -n "$SUPABASE_URL" ]; then
            echo "Ping via secret SUPABASE_URL"
            if probeer "$SUPABASE_URL" "${SUPABASE_ANON_KEY:-$PUBLIEK_KEY}"; then exit 0; fi
            echo "::warning::De URL uit de secrets reageert niet. Wijst SUPABASE_URL nog naar het juiste project?"
          else
            echo "::warning::Secret SUPABASE_URL ontbreekt — publieke project-URL gebruikt."
          fi

          echo "Ping via publieke project-URL"
          if probeer "$PUBLIEK_URL" "$PUBLIEK_KEY"; then exit 0; fi
          echo "::error::Geen verbinding met Supabase gekregen." >&2
          exit 1
