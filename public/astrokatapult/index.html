<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Astro Katapult | Kenniskist</title>
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --space-0:#070713; --space-1:#0e1030; --space-2:#1a1d4a;
    --cyan:#37e6ff; --orange:#ff8a3d; --green:#7dff8a; --pink:#ff5d8f;
    --star:#fdfdff; --muted:#9aa0d8; --gold:#ffd34d;
    --panel:rgba(14,16,48,.82);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--space-0);}
  body{
    font-family:'Outfit','Nunito',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    color:#eef0ff; user-select:none; touch-action:none;
  }
  #game{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;width:100%;height:100%;
    background:radial-gradient(120% 90% at 70% 8%, #1a1f57 0%, #0c0e2e 45%, #060611 100%);}

  /* ---- shared overlay styling ---- */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;padding:24px;text-align:center;
    background:radial-gradient(120% 90% at 50% 0%, rgba(40,46,120,.55), rgba(6,6,17,.92));
    backdrop-filter:blur(2px);z-index:5;}
  .screen.on{display:flex;}
  .logo{font-family:'Russo One',system-ui,sans-serif;font-weight:400;letter-spacing:.12em;text-transform:uppercase;line-height:.95;
    font-size:clamp(34px,9vw,76px);
    background:linear-gradient(180deg,#fff 0%,var(--cyan) 70%,#2aa6ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(55,230,255,.35));}
  .tag{color:var(--muted);letter-spacing:.32em;text-transform:uppercase;
    font-size:clamp(10px,2.6vw,13px);margin-top:14px;}
  .btn{cursor:pointer;border:none;border-radius:999px;font-family:'Russo One',system-ui,sans-serif;font-weight:400;
    letter-spacing:.08em;text-transform:uppercase;font-size:15px;padding:15px 34px;
    color:#06122a;background:linear-gradient(135deg,#8df3ff,var(--cyan));
    box-shadow:0 6px 0 #1685a3,0 0 28px rgba(55,230,255,.45);
    transition:transform .08s ease, box-shadow .08s ease, filter .15s;}
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(4px);box-shadow:0 4px 0 #1685a3,0 8px 14px rgba(55,230,255,.25);}
  .btn.alt{color:#fff;background:rgba(40,46,110,.75);border:1px solid rgba(140,160,255,.45);
    box-shadow:0 6px 0 #14163c,0 0 20px rgba(120,130,255,.2);backdrop-filter:blur(6px);}
  .btn.alt:active{box-shadow:0 4px 0 #14163c;}
  .btn-row{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap;justify-content:center;}

  /* ---- level select ---- */
  #select h2{font-family:'Russo One',system-ui,sans-serif;font-weight:400;letter-spacing:.12em;text-transform:uppercase;
    font-size:clamp(20px,5vw,30px);margin:0 0 6px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));
    gap:12px;width:min(720px,92vw);max-height:60vh;overflow-y:auto;margin-top:22px;padding:6px;
    touch-action:pan-y;}
  .cell{position:relative;aspect-ratio:1;border-radius:16px;cursor:pointer;
    background:linear-gradient(160deg,rgba(40,46,120,.85),rgba(14,16,48,.9));
    border:1.5px solid rgba(120,130,220,.35);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    font-family:'Russo One',system-ui,sans-serif;font-size:22px;color:#fff;
    transition:transform .08s ease, border-color .15s ease, box-shadow .15s;}
  .cell:not(.locked):hover{border-color:var(--cyan);box-shadow:0 0 18px rgba(55,230,255,.35);}
  .cell:active{transform:scale(.94);}
  .cell.locked{color:#454a86;cursor:not-allowed;background:#0c0e29;border-color:rgba(80,86,150,.25);}
  .cell.locked::after{content:"🔒";position:absolute;font-size:20px;}
  .cell.locked span{visibility:hidden;}
  .cell .stars{position:absolute;bottom:6px;font-size:11px;letter-spacing:1px;color:var(--gold);}
  .cell.cleared{border-color:rgba(125,255,138,.55);box-shadow:inset 0 0 14px rgba(125,255,138,.12);}
  .planet-head{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:6px 2px 0;
    font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:#cdd3ff;}
  .planet-head::before{content:"🪐";font-size:16px;}
  .planet-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(120,130,220,.5),transparent);}

  /* ---- HUD ---- */
  #hud{position:absolute;top:0;left:0;right:0;display:none;z-index:4;
    padding:12px 14px;justify-content:space-between;align-items:flex-start;pointer-events:none;}
  #hud.on{display:flex;}
  .hud-pill{pointer-events:auto;background:var(--panel);backdrop-filter:blur(8px);border:1px solid rgba(120,130,220,.3);
    border-radius:14px;padding:9px 14px;display:flex;align-items:center;gap:10px;
    box-shadow:0 6px 18px rgba(0,0,0,.4);}
  .hud-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
  .hud-val{font-family:'Russo One',system-ui,sans-serif;font-size:18px;font-variant-numeric:tabular-nums;}
  .icon-btn{pointer-events:auto;width:44px;height:44px;border-radius:13px;cursor:pointer;
    background:var(--panel);border:1px solid rgba(120,130,220,.3);color:#dfe3ff;
    font-size:18px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.4);}
  .icon-btn:active{transform:translateY(2px);}
  .hud-right{display:flex;gap:10px;}

  /* ---- result modal ---- */
  #result .card{background:var(--panel);border:1.5px solid rgba(55,230,255,.45);backdrop-filter:blur(10px);
    border-radius:24px;padding:30px 34px;width:min(440px,92vw);
    box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 40px rgba(55,230,255,.18);}
  #result h2{margin:0;font-family:'Russo One',system-ui,sans-serif;font-weight:400;letter-spacing:.08em;text-transform:uppercase;
    font-size:clamp(24px,6vw,36px);}
  .stars-big{font-size:46px;letter-spacing:8px;margin:14px 0 4px;height:54px;color:var(--gold);text-shadow:0 0 18px rgba(255,211,77,.7);}
  .score-line{color:var(--muted);letter-spacing:.04em;font-size:14px;}
  .score-line b{color:#fff;font-variant-numeric:tabular-nums;}
  .credit{position:absolute;bottom:12px;width:100%;text-align:center;
    color:#4a5092;font-size:11px;letter-spacing:.2em;text-transform:uppercase;}
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div style="display:flex;gap:10px;align-items:flex-start;">
      <button class="icon-btn" id="btnMenu" title="Menu">☰</button>
      <button class="icon-btn" id="btnRetry" title="Opnieuw">↻</button>
    </div>
    <div class="hud-pill">
      <span class="hud-label">Level</span><span class="hud-val" id="hudLevel">1</span>
      <span style="width:1px;height:20px;background:rgba(120,130,220,.3)"></span>
      <span class="hud-label">Score</span><span class="hud-val" id="hudScore">0</span>
      <span style="width:1px;height:20px;background:rgba(120,130,220,.3)"></span>
      <span class="hud-label">Aliens</span><span class="hud-val" id="hudAliens" style="color:var(--green)">0</span>
    </div>
  </div>

  <!-- Start -->
  <div class="screen on" id="start">
    <div class="logo">Astro<br>Katapult</div>
    <div class="tag">Sleep om te richten · tik tijdens de vlucht voor de speciale actie</div>
    <div class="btn-row">
      <button class="btn" id="btnPlay">Spelen</button>
      <button class="btn alt" id="btnLevels">Levels</button>
    </div>
    <div class="credit">kenniskist.nl</div>
  </div>

  <!-- Level select -->
  <div class="screen" id="select">
    <h2>Kies een missie</h2>
    <div class="tag">Versla alle aliens met zo min mogelijk schoten</div>
    <div class="grid" id="grid"></div>
    <div class="btn-row"><button class="btn alt" id="btnBack">Terug</button></div>
  </div>

  <!-- Result -->
  <div class="screen" id="result">
    <div class="card">
      <h2 id="resTitle">Missie geslaagd</h2>
      <div class="stars-big" id="resStars">★★★</div>
      <div class="score-line">Score: <b id="resScore">0</b></div>
      <div class="btn-row">
        <button class="btn alt" id="btnResMenu">Levels</button>
        <button class="btn alt" id="btnResRetry">Opnieuw</button>
        <button class="btn" id="btnResNext">Volgend level</button>
      </div>
    </div>
  </div>
</div>

<script>
/* Matter.js laden (zelf gehost, MIT-licentie): geen externe CDN's, dus geen
   IP-adressen van leerlingen naar derden. Nette fout als het toch misgaat. */
(function(){
  var urls=[
    "matter.min.js"
  ];
  var i=0;
  function next(){
    if(typeof Matter!=="undefined"){ boot(); return; }
    if(i>=urls.length){ fail(); return; }
    var s=document.createElement("script");
    s.src=urls[i++];
    s.onload=function(){ (typeof Matter!=="undefined") ? boot() : next(); };
    s.onerror=next;
    document.head.appendChild(s);
  }
  function fail(){
    var el=document.getElementById("start");
    if(el) el.innerHTML='<div style="color:#fff;max-width:440px;line-height:1.6;font-size:16px">'+
      'Kon de physics-bibliotheek (Matter.js) niet laden.<br>'+
      'Controleer je internetverbinding en herlaad de pagina.</div>';
  }
  window.__startLoad=next;
})();
</script>
<script>
function boot(){
"use strict";
/* Beloning-modus (ingebed in werkwoordspelling): direct level 1, 1 level, dan terug */
const REWARD = new URLSearchParams(location.search).has('reward');
/* ============================================================
   ASTRO KATAPULT  —  single-file ruimte-physicaspel
   Physics: Matter.js  ·  Render: custom canvas
   ============================================================ */

/* ---------- veilige opslag (localStorage + in-memory fallback) ---------- */
const Store = (() => {
  let mem = {};
  return {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return (k in mem) ? mem[k] : null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k] = v; } }
  };
})();

/* ---------- wereld-constanten ---------- */
const WORLD_W = 1600, WORLD_H = 720;
const G_TOP   = 648;                 // bovenkant van de grond
const ANCHOR  = { x: 230, y: 480 };  // katapult-vork, met ruimte links om ver terug te trekken
const MAX_STRETCH = 155;
const POWER   = 0.19;
const MAX_SPEED = 28;
const FIXED_DT = 1000/60;
// Slow motion: per frame rekent Matter.js maar een halve tijdstap. Banen en
// bereik blijven precies hetzelfde, alleen zie je de raket nu echt vliegen.
const TIJD = 0.45;
const LERP = 0.55;                  // render-positie volgt physics: alleen gladstrijken

/* ---------- materialen ---------- */
const MAT = {
  ice:   { density:0.0012, friction:0.25, hp:9,   destructible:true,  fill:"#9fe8ff", edge:"#d7f6ff", glass:true },
  stone: { density:0.0030, friction:0.7,  hp:46,  destructible:true,  fill:"#8b8da6", edge:"#b7b9d0" },
  metal: { density:0.0060, friction:0.6,  hp:9999,destructible:false, fill:"#5d6c8f", edge:"#9fb0e0" }
};

/* ---------- Matter aliassen ---------- */
const { Engine, World, Bodies, Body, Composite, Events, Vector, Sleeping } = Matter;

/* ============================================================
   LEVELS — aparte, bewerkbare datastructuur
   Elk level: { ammo, blocks:[...], aliens:[...], quiz:null }
   - block: {x,y,w,h,mat,angle?}  (x,y = middelpunt, wereld-eenheden)
   - alien: {x,y,r?}
   - quiz : nu null; later { vraag, opties:[], juist:index } toe te voegen
   Helpers hieronder genereren veelgebruikte bouwwerken.
   ============================================================ */
const U = 44; // standaard bloksteen

function box(x,y,w,h,mat,angle){ return {x,y,w,h,mat,angle:angle||0}; }
function stack(cx,n,mat,w,h){ w=w||U; h=h||U; const a=[]; for(let i=0;i<n;i++) a.push(box(cx, G_TOP-h/2-i*h, w,h,mat)); return a; }
function beam(cx,mat,h){ h=h||130; return box(cx, G_TOP-h/2, 22,h,mat); }
function plankAt(cx,topY,mat,w){ w=w||180; return box(cx, topY, w,24, mat); }
function groundAlien(x,r){ return {x, y:G_TOP-(r||24), r:r||24}; }
function topAlien(cx,n,h,r){ h=h||U; r=r||24; return {x:cx, y:(G_TOP-n*h)-r}; }

/* bouwstenen-blueprints, geven {blocks, aliens} terug */
function bpWall(cx,mat,n,alienX){ return { blocks:stack(cx,n,mat,52,40), aliens:[groundAlien(alienX)] }; }
function bpHut(cx,mat,topper){
  const h=140, topY=(G_TOP-h)-12;
  const blocks=[ beam(cx-72,mat,h), beam(cx+72,mat,h), plankAt(cx,topY,mat,200) ];
  const aliens=[ groundAlien(cx) ];
  if(topper){ blocks.push(box(cx-30,topY-32,40,40,"ice"),box(cx+30,topY-32,40,40,"ice")); aliens.push({x:cx,y:topY-12-24}); }
  return {blocks,aliens};
}
function bpTower(cx,mat,n,withTop,withBase){
  const blocks=stack(cx,n,mat,56,44);
  const aliens=[];
  if(withBase) aliens.push(groundAlien(cx-90));
  if(withTop)  aliens.push(topAlien(cx,n,44));
  return {blocks,aliens};
}
function bpBunker(cx,roofMat){
  const h=118, topY=(G_TOP-h)-12;
  return {
    blocks:[ beam(cx-58,"metal",h), beam(cx+58,"metal",h), plankAt(cx,topY,roofMat||"metal",168),
             box(cx, topY-32, 40,40,"ice") ],
    aliens:[ groundAlien(cx) ]
  };
}
function bpPyramid(cx,mat){
  const blocks=[];
  const lvls=[4,3,2,1];
  lvls.forEach((count,row)=>{
    const span=(count-1)*U;
    for(let i=0;i<count;i++){ const x=cx-span/2+i*U; blocks.push(box(x, G_TOP-U/2-row*U, U,U, mat)); }
  });
  return { blocks, aliens:[ groundAlien(cx-120), topAlien(cx,4) ] };
}
function bpFortress(cx,rechtsAlien){
  const h=170, topY=(G_TOP-h)-12;
  const blocks=[
    beam(cx-150,"metal",h), beam(cx+150,"metal",h),
    plankAt(cx,topY,"stone",400),
    ...stack(cx,3,"ice",46,44),
    box(cx-150, topY-32, 46,46,"stone"), box(cx+150, topY-32, 46,46,"stone")
  ];
  // binnen: naast de ijsstapel (niet erin), boven: op de plank, en rechts naast de buitenpaal
  const aliens=[ groundAlien(cx-82), {x:cx, y:topY-12-24} ];
  if(rechtsAlien!==false) aliens.push(groundAlien(cx+190));
  return {blocks,aliens};
}

/* zet meerdere blueprints naast elkaar samen */
function merge(){ const blocks=[],aliens=[]; for(const p of arguments){ blocks.push(...p.blocks); aliens.push(...p.aliens); } return {blocks,aliens}; }
function L(ammo,parts,quiz){
  const rockets = Array.isArray(ammo) ? ammo.slice() : Array(ammo).fill("standard");
  return { ammo:rockets.length, rockets, blocks:parts.blocks, aliens:parts.aliens, quiz: quiz||null };
}

const LEVELS = [
  /* 1  introductie */ L(2, { blocks:[], aliens:[ groundAlien(1050) ] }),
  /* 2  twee doelen  */ L(2, { blocks:[], aliens:[ groundAlien(900), groundAlien(1280) ] }),
  /* 3  ijsmuur + extra doel */ L(3, merge(bpWall(840,"ice",4,1060), {blocks:[],aliens:[groundAlien(1300)]})),
  /* 4  DRIEDELER: twee verspreide doelen */ L(["splitter","standard","standard"],
        merge({blocks:stack(900,1,"stone",52,40),aliens:[groundAlien(960)]},
              {blocks:stack(1280,1,"stone",52,40),aliens:[groundAlien(1340)]})),
  /* 5  hut met doel binnen + bovenop */ L(3, bpHut(1040,"stone",true)),
  /* 6  BOMMENWERPER: doel in metalen bunker */ L(["bomber","standard","standard"],
        merge(bpBunker(1020,"metal"), {blocks:[],aliens:[groundAlien(1320)]})),
  /* 7  BOOSTER: doel achter dikke metalen muur */ L(["booster","standard"],
        merge({blocks:stack(900,5,"metal",52,44),aliens:[]},
              {blocks:[box(900,G_TOP-5*44-24,46,46,"ice")],aliens:[groundAlien(1080),{x:900,y:G_TOP-5*44-46-24}]})),
  /* 8  METEOR: doel onder metalen dak */ L(["meteor","standard"],
        merge(bpHut(1050,"metal",false), {blocks:[],aliens:[groundAlien(1310)]})),
  /* 9  drie doelen, gemengd */ L(["bomber","standard","standard"],
        merge(bpHut(880,"stone",false), bpBunker(1140,"stone"), {blocks:[],aliens:[groundAlien(1380)]})),
  /* 10 hoge ijstoren, 3 doelen */ L(3, merge(bpTower(1100,"ice",6,true,true), {blocks:[],aliens:[groundAlien(1370)]})),
  /* 11 fort, krap */ L(["bomber","standard","standard"], bpFortress(1080)),
  /* 12 dubbele metalen bunker */ L(["bomber","bomber","bomber"], merge(bpBunker(960,"metal"), bpBunker(1280,"metal"))),
  /* 13 metalen piramide */ L(["meteor","standard","standard"],
        merge(bpPyramid(1030,"metal"), {blocks:[],aliens:[groundAlien(1360)]})),
  /* 14 drie huizen verspreid */ L(["splitter","standard","standard"],
        merge(bpHut(840,"stone",false), bpHut(1080,"metal",true), bpHut(1340,"stone",false))),
  /* 15 twee hoge torens, 4 doelen */ L(["booster","standard","standard","standard"],
        merge(bpTower(960,"metal",5,true,false), bpTower(1260,"ice",5,true,true))),
  /* 16 fort + bunker */ L(["bomber","booster","standard"], merge(bpFortress(950), bpBunker(1310,"metal"))),
  /* 17 ijskathedraal op metalen poten */ L(["splitter","standard","standard"],
        merge({blocks:[ beam(900,"metal",210),beam(1020,"metal",210),beam(1140,"metal",210),
              plankAt(960,G_TOP-210-12,"stone",118),plankAt(1080,G_TOP-210-12,"stone",118),
              plankAt(1020,G_TOP-210-36,"ice",260)],
              aliens:[groundAlien(960),groundAlien(1080),{x:1020,y:G_TOP-210-72}]})),
  /* 18 metalen doolhof */ L(["booster","bomber","standard"],
        merge({blocks:[ beam(900,"metal",170),beam(1100,"metal",170),beam(1300,"metal",170),
              plankAt(1000,G_TOP-170-12,"metal",196),plankAt(1200,G_TOP-170-12,"metal",196)],
              aliens:[groundAlien(1000),groundAlien(1200),{x:1100,y:G_TOP-170-24-24}]})),
  /* 19 twee piramides, 4 doelen */ L(["meteor","bomber","standard","standard"],
        merge(bpPyramid(940,"metal"), bpPyramid(1260,"stone"))),
  /* 20 megafort */ L(["bomber","splitter","booster","standard"],
        merge(bpFortress(1000), bpHut(1320,"metal",true), {blocks:stack(780,3,"stone",52,44),aliens:[topAlien(780,3,44)]})),
  /* 21 precisie: kleine doelen hoog op metalen pilaren */ L(["booster","standard","standard"],
        merge({blocks:[ beam(900,"metal",250),beam(1160,"metal",250),beam(1420,"metal",250),
              plankAt(900,G_TOP-250-12,"stone",110),plankAt(1160,G_TOP-250-12,"stone",110),plankAt(1420,G_TOP-250-12,"stone",110)],
              aliens:[{x:900,y:G_TOP-250-48},{x:1160,y:G_TOP-250-48},{x:1420,y:G_TOP-250-48}]})),
  /* 22 BAAS */ L(["meteor","bomber","splitter","booster","standard","standard","standard"],
        merge(bpFortress(920,false), bpBunker(1180,"metal"), bpBunker(1390,"metal"),
              bpTower(640,"ice",4,true,false))),

  /* ====== PLANEET 3 — IJSPLANEET (levels 21-30) ====== */
  /* 23 dubbele toren */ L(4, merge(bpTower(960,"ice",6,true,true), bpTower(1280,"stone",5,true,false))),
  /* 24 drie huizen */ L(["splitter","standard","standard","standard"],
        merge(bpHut(840,"stone",false), bpHut(1090,"stone",true), bpHut(1340,"metal",false))),
  /* 25 metalen muur + piramide */ L(["bomber","booster","standard"],
        merge({blocks:stack(860,6,"metal",52,44),aliens:[groundAlien(1060)]}, bpPyramid(1320,"stone"))),
  /* 26 drie bunkers */ L(["bomber","bomber","standard"],
        merge(bpBunker(880,"metal"), bpBunker(1120,"metal"), bpBunker(1360,"stone"))),
  /* 27 precisie-pilaren */ L(["booster","booster","standard"],
        merge({blocks:[ beam(880,"metal",260),beam(1140,"metal",260),beam(1400,"metal",260),
              plankAt(880,G_TOP-260-12,"stone",110),plankAt(1140,G_TOP-260-12,"stone",110),plankAt(1400,G_TOP-260-12,"stone",110)],
              aliens:[{x:880,y:G_TOP-260-48},{x:1140,y:G_TOP-260-48},{x:1400,y:G_TOP-260-48}]})),
  /* 28 fort + toren */ L(["meteor","bomber","standard","standard"],
        merge(bpFortress(960), bpTower(1340,"ice",5,true,true))),
  /* 29 twee metalen piramides */ L(["meteor","bomber","booster","standard"],
        merge(bpPyramid(940,"metal"), bpPyramid(1280,"metal"))),
  /* 30 MINI-BAAS */ L(["meteor","bomber","splitter","booster","standard","standard"],
        merge(bpFortress(940,false), bpBunker(1200,"metal"), bpBunker(1410,"metal"))),

  /* ====== PLANEET 4 — JUNGLEPLANEET (levels 31-40) ====== */
  /* 31 drie metalen torens */ L(["booster","standard","standard","standard"],
        merge(bpTower(900,"metal",6,true,false), bpTower(1180,"metal",6,true,true), bpTower(1460,"ice",6,true,false))),
  /* 32 vier bunkers */ L(["bomber","bomber","booster","standard"],

try { const raw=Store.get("astro_progress"); if(raw) progress=Object.assign(progress, JSON.parse(raw)); } catch(e){}

function initEngine(){
  engine = Engine.create();
  engine.enableSleeping = true;
  engine.gravity.y = 1;
  engine.gravity.scale = 0.0012;
  world = engine.world;
}
const G_STEP = () => engine.gravity.y * engine.gravity.scale * FIXED_DT * FIXED_DT;

/* ============================================================
   LEVEL OPBOUW
   ============================================================ */
function clearLevel(){
  if(world){ World.clear(world,false); }
  blocks=[]; aliens=[]; statics=[]; shards=[]; particles=[]; floaters=[];
  state.projectile=null; state.dragging=false; aiming=false; state.aimPoint=null;
}
function makeStatics(){
  const opt={ isStatic:true, friction:0.9 };
  const ground = Bodies.rectangle(WORLD_W/2, G_TOP+ (WORLD_H-G_TOP)/2, WORLD_W*3, WORLD_H-G_TOP, opt);
  const leftW  = Bodies.rectangle(-60, WORLD_H/2, 120, WORLD_H*2, opt);
  ground.gameData={kind:"ground"};
  statics=[ground,leftW];
  World.add(world, statics);
}
function makeBlockBody(b){
  const m=MAT[b.mat];
  const body=Bodies.rectangle(b.x,b.y,b.w,b.h,{
    angle:b.angle, density:m.density, friction:m.friction, frictionStatic:1,
    restitution:0.02, chamfer:{radius:Math.min(6,Math.min(b.w,b.h)/4)}, sleepThreshold:26
  });
  body.gameData={kind:"block", mat:b.mat, hp:m.hp, maxhp:m.hp, w:b.w, h:b.h, flash:0};
  return body;
}
function makeAlienBody(a){
  const r=a.r||24;
  const body=Bodies.circle(a.x,a.y,r,{ density:0.0016, friction:0.45, restitution:0.12, sleepThreshold:26 });
  body.gameData={kind:"alien", hp:16, maxhp:16, r, bob:Math.random()*Math.PI*2, dead:false, flash:0};
  return body;
}
function makeProjectile(type){
  const cfg=ROCKETS[type]||ROCKETS.standard;
  const body=Bodies.circle(ANCHOR.x, ANCHOR.y, cfg.r, {
    density:cfg.density, friction:0.5, frictionAir:0.006, restitution:0.28, sleepThreshold:22
  });
  body.gameData={kind:"rocket", r:cfg.r, type, ability:cfg.ability, abilityUsed:false, trail:[]};
  Body.setStatic(body,true);
  return body;
}
function makeShard(x,y,type){
  const cfg=ROCKETS[type]||ROCKETS.standard;
  const body=Bodies.circle(x,y,12,{ density:0.006, friction:0.5, frictionAir:0.006, restitution:0.32, sleepThreshold:22 });
  body.gameData={kind:"rocket", r:12, type, ability:null, abilityUsed:true, trail:[], shard:true, color:cfg.dot};
  return body;
}

function loadLevel(i){
  state.levelIndex=i;
  state.score=0; state.phase="aim"; state.geschoten=false;
  initEngine(); clearLevel(); makeStatics();
  const lvl=LEVELS[i];
  state.shotsLeft=lvl.ammo;
  state.rockets=lvl.rockets.slice();
  for(const b of lvl.blocks){ const body=makeBlockBody(b); blocks.push(body); World.add(world,body); }
  for(const a of lvl.aliens){ const body=makeAlienBody(a); aliens.push(body); World.add(world,body); }
  bindCollisions();
  // even doorrekenen zodat alles netjes op elkaar ligt voordat je schiet
  bezinken=true; for(let n=0;n<120;n++) Engine.update(engine, FIXED_DT); bezinken=false;
  for(const b of [...blocks,...aliens]){ b.gameData.flash=0; b.gameData.rp=null; }
  loadProjectile();
  updateHUD();
  show("play");
}
function currentRocketType(){
  const idx=state.rockets.length - state.shotsLeft;   // 0-gebaseerd in de volgorde
  return state.rockets[idx] || "standard";
}
function loadProjectile(){
  if(state.shotsLeft<=0){ state.projectile=null; return; }
  const p=makeProjectile(currentRocketType());
  Body.setAngle(p,-0.6);
  state.projectile=p; state.aimPoint={x:ANCHOR.x,y:ANCHOR.y};
  World.add(world,p);
  state.phase="aim";
}

/* ============================================================
   BOTSINGEN & SCHADE
   ============================================================ */
function bindCollisions(){
  Events.on(engine,"collisionStart",(ev)=>{
    for(const pair of ev.pairs){
      const a=pair.bodyA, b=pair.bodyB;
      const rel=Vector.magnitude(Vector.sub(a.velocity,b.velocity));
      // bommenwerper detoneert automatisch bij een stevige inslag
      const pr=state.projectile;
      if(pr && pr.gameData.ability==="bomb" && !pr.gameData.abilityUsed && (a===pr||b===pr) && rel>3.2){
        detonate(pr); continue;
      }
      if(rel<1.4) continue;
      hit(a,b,rel); hit(b,a,rel);
    }
  });
}
let bezinken=false;   // tijdens het laden: botsingen doen nog geen schade
function hit(target, other, rel){
  const g=target.gameData; if(!g || bezinken) return;
  if(g.kind==="alien" && !g.dead){
    const dmg=(rel-1.8)*5.5;
    if(dmg>0){ g.hp-=dmg; g.flash=1; if(g.hp<=0) killAlien(target); }
  } else if(g.kind==="block"){
    const m=MAT[g.mat]; if(!m.destructible) return;
    const dmg=(rel-3.2)*3.4;
    if(dmg>0){ g.hp-=dmg; g.flash=1; if(g.hp<=0) destroyBlock(target); }
  }
}
function killAlien(body){
  const g=body.gameData; if(g.dead) return; g.dead=true;
  const p=body.position;
  burst(p.x,p.y,18,"#7dff8a"); burst(p.x,p.y,8,"#caffd2");
  schokgolf(p.x,p.y,90,"#7dff8a");
  floaters.push({x:p.x,y:p.y-30,text:"+5000",life:1,color:"#7dff8a"});
  addScore(5000); shake=Math.max(shake,8);
  beep(520,0.18,"square",1400,0.05); beep(880,0.22,"sine",1760,0.05);
  updateHUD();
  World.remove(world,body);
  aliens=aliens.filter(x=>x!==body);
}
function destroyBlock(body){
  const g=body.gameData; const p=body.position; const m=MAT[g.mat];
  burst(p.x,p.y, m.glass?16:12, m.glass?"#d7f6ff":m.fill);
  floaters.push({x:p.x,y:p.y-20,text:"+250",life:.8,color:"#cdd2ff"});
  addScore(250); shake=Math.max(shake, m.glass?3:5);
  if(m.glass){ ruis(0.18,0.06,8000,2000); beep(2400,0.12,"triangle",3200,0.03); } else ruis(0.3,0.1,1200,80);
  World.remove(world,body);
  blocks=blocks.filter(x=>x!==body);
}
function addScore(n){ state.score+=n; updateHUD(); }

/* ---------- speciale acties (tik tijdens vlucht) ---------- */
function activateAbility(){
  const p=state.projectile; if(!p) return;
  const g=p.gameData; if(!g.ability || g.abilityUsed) return;
  const v=p.velocity, ang=Math.atan2(v.y,v.x), sp=Math.hypot(v.x,v.y);
  if(g.ability==="split"){
    g.abilityUsed=true;
    for(const off of [-0.40, 0.40]){
      const a=ang+off; const sh=makeShard(p.position.x, p.position.y, g.type);
      World.add(world, sh); shards.push(sh);
      Sleeping.set(sh,false);
      Body.setVelocity(sh,{x:Math.cos(a)*sp, y:Math.sin(a)*sp});
    }
    burst(p.position.x,p.position.y,12,"#b15dff");
    beep(520,0.08,"square");
  } else if(g.ability==="bomb"){
    detonate(p);
  } else if(g.ability==="boost"){
    g.abilityUsed=true;
    const ns=Math.min(MAX_SPEED*1.7, sp*2.2+8);
    Body.setVelocity(p,{x:Math.cos(ang)*ns, y:Math.sin(ang)*ns});
    for(let i=0;i<14;i++){ const a=ang+Math.PI+(Math.random()-0.5)*0.8, s=3+Math.random()*5;
      particles.push({x:p.position.x,y:p.position.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6,max:.6,size:3,color:"#37e6ff"}); }
    beep(720,0.1,"sawtooth");
  } else if(g.ability==="slam"){
    g.abilityUsed=true;
    Body.setVelocity(p,{x:v.x*0.35, y:Math.max(v.y,0)+28});
    burst(p.position.x,p.position.y,12,"#ffd34d");
    shake=Math.max(shake,6); beep(120,0.12,"square");
  }
}
function detonate(p){
  const g=p.gameData; if(g.abilityUsed) return; g.abilityUsed=true;
  explodeAt(p.position.x, p.position.y, 145, 30);
  World.remove(world,p); state.projectile=null;
  state.phase="settle"; state.settleAt=simT;
}
function explodeAt(x,y,radius,power){
  burst(x,y,34,"#ff8a3d"); burst(x,y,18,"#fff3b0"); burst(x,y,10,"#ff3d3d");
  schokgolf(x,y,radius*1.2,"#ffb36b");
  shake=Math.max(shake,13); ruis(0.7,0.2,1500,40); beep(70,0.5,"sine",30,0.12);
  const bodies=[...aliens, ...blocks, ...shards];
  for(const b of bodies){
    const dx=b.position.x-x, dy=b.position.y-y; const d=Math.hypot(dx,dy)||1;
    if(d>radius) continue;
    const f=1-d/radius;
    Sleeping.set(b,false);
    Body.setVelocity(b,{ x:b.velocity.x + dx/d*f*24, y:b.velocity.y + dy/d*f*24 - f*7 });
    const g=b.gameData;
    if(g.kind==="alien" && !g.dead){ g.hp-=power*f*1.5; g.flash=1; if(g.hp<=0) killAlien(b); }
    else if(g.kind==="block"){ const m=MAT[g.mat]; if(m.destructible){ g.hp-=power*f*2.2; g.flash=1; if(g.hp<=0) destroyBlock(b); } }
  }
}

/* ============================================================
   AFVUREN & SCHOT-AFHANDELING
   ============================================================ */
function fire(){
  const p=state.projectile; if(!p||!state.aimPoint) return;
  let vx=(ANCHOR.x-state.aimPoint.x)*POWER, vy=(ANCHOR.y-state.aimPoint.y)*POWER;
  const sp=Math.hypot(vx,vy);
  if(sp<3){ state.aimPoint={x:ANCHOR.x,y:ANCHOR.y}; Body.setAngle(p,-0.6); return; } // te weinig vermogen
  if(sp>MAX_SPEED){ vx=vx/sp*MAX_SPEED; vy=vy/sp*MAX_SPEED; }
  Body.setPosition(p,{x:state.aimPoint.x,y:state.aimPoint.y});   // vertrekt vanaf waar je hem naartoe trok
  Body.setStatic(p,false);
  Sleeping.set(p,false);                 // forceer ontwaken zodat de snelheid telt
  Body.setVelocity(p,{x:vx,y:vy});
  Body.setAngularVelocity(p,0.2);
  state.phase="fly"; state.launchAt=simT; state.geschoten=true;
  // lanceer-FX: vlamstoot tegengesteld aan vliegrichting
  const ang=Math.atan2(vy,vx);
  for(let i=0;i<18;i++){ const a=ang+Math.PI+(Math.random()-0.5)*1.1, s=2+Math.random()*6;
    particles.push({x:ANCHOR.x,y:ANCHOR.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.7,max:.7,
      size:3+Math.random()*3,color:["#fff3b0","#ff8a3d","#ff5d2e"][i%3]}); }
  shake=Math.max(shake,5);
  ruis(0.5,0.12,3000,200); beep(220,0.35,"sawtooth",90,0.04);
}
function maxSpeedOfDynamics(){
  let mx=0;
  const all=[...blocks,...aliens,...shards]; if(state.projectile && !state.projectile.isStatic) all.push(state.projectile);
  for(const b of all){ if(b.isSleeping) continue; const s=Vector.magnitude(b.velocity); if(s>mx)mx=s; }
  return mx;
}
function resolveShot(){
  if(state.phase==="done") return;
  if(state.projectile){ World.remove(world,state.projectile); state.projectile=null; }
  if(shards.length){ for(const sh of shards) World.remove(world,sh); shards=[]; }
  state.shotsLeft--;
  if(aliens.length===0){ state.phase="done"; winLevel(); return; }
  if(state.shotsLeft>0){ loadProjectile(); updateHUD(); }
  else { state.phase="done"; setTimeout(()=>{ if(aliens.length>0) loseLevel(); }, 500); }
  updateHUD();
}

function starsFor(shotsLeftAfter){ return Math.max(1, Math.min(3, 1+shotsLeftAfter)); }
function winLevel(){
  const lvlNum=state.levelIndex+1;
  const stars=starsFor(state.shotsLeft);
  state.score+= state.shotsLeft*2000;
  const prev=progress.stars[lvlNum]||0;
  if(stars>prev) progress.stars[lvlNum]=stars;
  if(lvlNum+1>progress.unlocked && lvlNum<LEVELS.length) progress.unlocked=lvlNum+1;
  saveProgress();
  burstScreenWin();
  beep(660,0.12,"triangle"); setTimeout(()=>beep(880,0.16,"triangle"),120);
  showResult(true, stars, state.score);
}
function loseLevel(){
  beep(150,0.2,"square");
  showResult(false, 0, state.score);
}

/* ============================================================
   INPUT (muis + touch via pointer events)
   ============================================================ */
function toWorld(clientX,clientY){
  const r=canvas.getBoundingClientRect();
  return { x:(clientX-r.left-view.ox)/view.scale, y:(clientY-r.top-view.oy)/view.scale };
}
let aiming=false, sleepStart=null;
function pointerDown(e){
  if(state.screen!=="play") return;
  if(state.phase==="fly"){ e.preventDefault(); resumeAudio(); activateAbility(); return; }
  if(state.phase!=="aim"||!state.projectile) return;
  e.preventDefault(); resumeAudio();
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  // De trek telt vanaf waar je drukt, niet vanaf de katapult. Zo kun je overal
  // beginnen en zit de rand van het scherm nooit in de weg.
  sleepStart=toWorld(e.clientX,e.clientY);
  aiming=true; setAim(e);
}
function pointerMove(e){ if(aiming){ e.preventDefault(); setAim(e); } }
function pointerUp(e){
  if(!aiming) return;
  aiming=false;
  try{ if(e&&e.pointerId!=null) canvas.releasePointerCapture(e.pointerId); }catch(_){}
  fire();
}
function setAim(e){
  let dx=0,dy=0;
  const w=toWorld(e.clientX,e.clientY), st=sleepStart||ANCHOR;
  dx=w.x-st.x; dy=w.y-st.y;
  const d=Math.hypot(dx,dy);
  if(d>MAX_STRETCH){ dx=dx/d*MAX_STRETCH; dy=dy/d*MAX_STRETCH; }
  // niet door de grond heen trekken
  const rr=state.projectile?state.projectile.gameData.r:24;
  const maxDy=G_TOP-rr-4-ANCHOR.y; if(dy>maxDy) dy=maxDy;
  state.aimPoint={x:ANCHOR.x+dx, y:ANCHOR.y+dy};
  // raket wijst in afvuurrichting (tegengesteld aan het terugtrekken)
  if(state.projectile && (dx||dy)) Body.setAngle(state.projectile, Math.atan2(-dy,-dx));
}

/* ============================================================
   PARTICLES & SCREEN FX
   ============================================================ */
function burst(x,y,n,color){
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=2+Math.random()*7;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,max:1,
      size:2+Math.random()*4,color, sq:i%3===0, rot:Math.random()*6, vr:(Math.random()-0.5)*0.4}); }
}
function burstScreenWin(){ for(let i=0;i<40;i++){ const a=Math.random()*Math.PI*2,s=3+Math.random()*8;
  particles.push({x:WORLD_W/2,y:WORLD_H/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1.4,max:1.4,
    size:3+Math.random()*4,color:["#7dff8a","#37e6ff","#ffd34d","#ff8a3d"][i%4]}); } }
function stepFx(){
  const k = state.screen==="play" ? TIJD : 1;
  for(const p of particles){ p.vy+=0.25*k*k; p.x+=p.vx*k; p.y+=p.vy*k; p.vx*=1-0.01*k; p.life-=0.02*k; if(p.vr) p.rot+=p.vr*k; }
  for(const q of ringen) q.t+=0.045*k;
  ringen=ringen.filter(q=>q.t<1);
  particles=particles.filter(p=>p.life>0);
  for(const f of floaters){ f.y-=0.7; f.life-=0.014; }
  floaters=floaters.filter(f=>f.life>0);
  if(shake>0) shake*=0.86; if(shake<0.3) shake=0;
}

/* ============================================================
   AUDIO (optioneel, mini WebAudio)
   ============================================================ */
let actx=null;
function resumeAudio(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(freq,dur,type,naar,vol){
  try{ if(!actx) return; const o=actx.createOscillator(),g=actx.createGain(), t=actx.currentTime;
    o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
    if(naar) o.frequency.exponentialRampToValueAtTime(naar,t+dur);
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.06,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
let ruisBuf=null;
function ruis(dur,vol,van,tot){
  try{ if(!actx) return;
    if(!ruisBuf){ ruisBuf=actx.createBuffer(1,actx.sampleRate*0.6,actx.sampleRate); const d=ruisBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    const s=actx.createBufferSource(), f=actx.createBiquadFilter(), g=actx.createGain(), t=actx.currentTime;
    s.buffer=ruisBuf; f.type="lowpass"; f.frequency.setValueAtTime(van||2000,t); f.frequency.exponentialRampToValueAtTime(tot||100,t+dur);
    g.gain.setValueAtTime(vol||0.1,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(actx.destination); s.start(t); s.stop(t+dur);
  }catch(e){}
}

/* ============================================================
   GAME LOOP
   ============================================================ */
let lastSpeed=99;
// schot-status (op echte physics-positie, niet render-positie)
function controleerSchot(){
  const pr=state.projectile;
  if(state.phase==="fly"){
    const out = pr && (pr.position.y>WORLD_H+200 || pr.position.x>WORLD_W+400 || pr.position.x<-300);
    const slow = pr && Vector.magnitude(pr.velocity)<0.7 && (simT-state.launchAt>800);
    const timeout = (simT-state.launchAt>8000);
    if(out||slow||timeout){ state.phase="settle"; state.settleAt=simT; }
  } else if(state.phase==="settle"){
    if(maxSpeedOfDynamics()<0.9 || simT-state.settleAt>2000){ resolveShot(); }
  }
}
let simT=0;   // speltijd in ms (loopt mee met de slow motion)
function loop(){
  requestAnimationFrame(loop);
  if(state.screen==="play"){
    Engine.update(engine, FIXED_DT*TIJD);
    simT += FIXED_DT*TIJD;

    // Lerp render-posities richting echte physics-posities
    const allBodies=[...blocks,...aliens,...shards];
    if(state.projectile) allBodies.push(state.projectile);
    for(const b of allBodies){
      const g=b.gameData, p=b.position;
      // Initialiseer rp de eerste keer
      if(!g.rp) g.rp={x:p.x, y:p.y, a:b.angle};
      if(state.phase==="fly"||state.phase==="settle"){
        g.rp.x += (p.x - g.rp.x) * LERP;
        g.rp.y += (p.y - g.rp.y) * LERP;
        g.rp.a += (b.angle - g.rp.a) * LERP;
      } else {
        // In aim/done: direct volgen (geen slow-mo nodig)
        g.rp.x=p.x; g.rp.y=p.y; g.rp.a=b.angle;
      }
    }

    // trail gebruikt render-positie zodat het spoor ook traag beweegt
    const pr=state.projectile;
    if(pr && state.phase==="fly"){
      const rp=pr.gameData.rp||pr.position;
      pr.gameData.trail.push({x:rp.x,y:rp.y});
      if(pr.gameData.trail.length>18) pr.gameData.trail.shift();
      if(Math.random()<0.55) particles.push({x:rp.x,y:rp.y,
        vx:(Math.random()-0.5)*1.5,vy:(Math.random()-0.5)*1.5+1,life:0.6,max:0.6,size:3,color:"#ff8a3d"});
    }
    for(const sh of shards){
      const rp=sh.gameData.rp||sh.position;
      sh.gameData.trail.push({x:rp.x,y:rp.y});
      if(sh.gameData.trail.length>10) sh.gameData.trail.shift();
    }

    controleerSchot();
    for(const b of [...blocks,...aliens]) if(b.gameData.flash>0) b.gameData.flash-=0.08;
    stepFx();
  } else {
    stepFx();
  }
  render();
}

/* ============================================================
   RENDER
   De vaste delen (nevel, sterren, planeten, heuvels, grond) worden één keer
   per planeet en schermgrootte op een eigen canvas getekend; per frame komen
   daar alleen de bewegende dingen overheen.
   ============================================================ */
const SFEER = [
  { neb:["#5b4bff","#2fd6ff","#ff4fd8"], heuvel:"#1b1640", rots:"#3a3170", krater:"#463c86", gloed:"#7dff8a" },
  { neb:["#ff5d2e","#ff9a3d","#b13a6b"], heuvel:"#2a0f0c", rots:"#6a2a1a", krater:"#7a3420", gloed:"#ff8a3d" },
  { neb:["#2fd6ff","#7ab8ff","#b9f3ff"], heuvel:"#0f2a3a", rots:"#2f6a85", krater:"#3a7a95", gloed:"#9ee7ff" },
  { neb:["#4bff8a","#2fd6c0","#c8ff4a"], heuvel:"#0f2a12", rots:"#2f5a20", krater:"#3a6a28", gloed:"#b4ff78" },
  { neb:["#ff4f8f","#ff8a3d","#9b3dff"], heuvel:"#2a0818", rots:"#6a1838", krater:"#7a2040", gloed:"#ff5d8f" },
];
function sfeer(){ return SFEER[Math.min(SFEER.length-1, Math.floor(state.levelIndex/10))]; }
function rng(seed){ let a=seed>>>0||1; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rgba(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }

let bgCache=null;
const BG_PX=500, BG_PY=320;   // de achtergrond loopt zo ver door buiten het speelveld
function resize(){
  view.dpr=Math.min(window.devicePixelRatio||1,2);
  const w=canvas.clientWidth, h=canvas.clientHeight;
  canvas.width=Math.round(w*view.dpr); canvas.height=Math.round(h*view.dpr);
  view.scale=Math.min(w/WORLD_W, h/WORLD_H);
  view.ox=(w-WORLD_W*view.scale)/2; view.oy=(h-WORLD_H*view.scale)/2;
  bgCache=null;
}
function achtergrond(){
  const pi=Math.min(PLANETS.length-1, Math.floor(state.levelIndex/10));
  const key=pi+":"+view.scale.toFixed(4)+":"+view.dpr;
  if(bgCache && bgCache.key===key) return bgCache.canvas;
  const TH=PLANETS[pi], SF=SFEER[pi], k=Math.min(view.scale*view.dpr, 1.3);   // achtergrond hoeft niet scherper: scheelt veel geheugen
  const c=document.createElement("canvas");
  c.width=Math.ceil((WORLD_W+2*BG_PX)*k); c.height=Math.ceil((WORLD_H+2*BG_PY)*k);
  const g=c.getContext("2d"); g.setTransform(k,0,0,k,BG_PX*k,BG_PY*k);
  const r=rng(pi*911+7);

  // nevelwolken
  for(let i=0;i<14;i++){
    const x=-BG_PX+r()*(WORLD_W+2*BG_PX), y=-BG_PY+r()*(G_TOP*0.85+BG_PY), rad=180+r()*320, kl=SF.neb[i%3];
    const gr=g.createRadialGradient(x,y,0,x,y,rad);
    gr.addColorStop(0,rgba(kl,0.16+r()*0.08)); gr.addColorStop(0.55,rgba(kl,0.05)); gr.addColorStop(1,rgba(kl,0));
    g.fillStyle=gr; g.fillRect(x-rad,y-rad,rad*2,rad*2);
  }
  // sterren in drie lagen
  const sx=()=>-BG_PX+r()*(WORLD_W+2*BG_PX), sy=()=>-BG_PY+r()*(G_TOP+BG_PY);
  for(let i=0;i<420;i++){ g.globalAlpha=0.25+r()*0.5; g.fillStyle="#fff"; const z=0.4+r()*0.9; g.fillRect(sx(), sy(), z, z); }
  for(let i=0;i<90;i++){ g.globalAlpha=0.5+r()*0.5; g.fillStyle=r()<0.3?"#cfe8ff":"#fff"; g.beginPath(); g.arc(sx(), sy(), 1+r()*1.1, 0, 7); g.fill(); }
  g.globalAlpha=1;
  for(let i=0;i<10;i++){ const x=r()*WORLD_W, y=r()*G_TOP*0.8, l=5+r()*7;
    const gr=g.createRadialGradient(x,y,0,x,y,l*1.6); gr.addColorStop(0,"rgba(255,255,255,.9)"); gr.addColorStop(1,"rgba(255,255,255,0)");
    g.fillStyle=gr; g.fillRect(x-l*2,y-l*2,l*4,l*4);
    g.strokeStyle="rgba(255,255,255,.7)"; g.lineWidth=1; g.beginPath(); g.moveTo(x-l,y); g.lineTo(x+l,y); g.moveTo(x,y-l); g.lineTo(x,y+l); g.stroke(); }

  // planeten met atmosfeer, schaduwkant en ring
  for(const p of TH.planets){
    const px=p.x<=1?p.x*WORLD_W:p.x, py=p.y, pr=p.r;
    const at=g.createRadialGradient(px,py,pr*0.9,px,py,pr*1.7);
    at.addColorStop(0,rgba(p.c1,0.35)); at.addColorStop(1,rgba(p.c1,0));
    g.fillStyle=at; g.beginPath(); g.arc(px,py,pr*1.7,0,7); g.fill();
    if(p.ring) ring(g,px,py,pr,true);
    const bol=g.createRadialGradient(px-pr*0.45,py-pr*0.45,pr*0.1,px,py,pr);
    bol.addColorStop(0,"#ffffff"); bol.addColorStop(0.18,p.c1); bol.addColorStop(1,p.c2);
    g.fillStyle=bol; g.beginPath(); g.arc(px,py,pr,0,7); g.fill();
    g.save(); g.beginPath(); g.arc(px,py,pr,0,7); g.clip();
    g.globalAlpha=0.07; g.strokeStyle="#fff"; g.lineWidth=pr*0.12;
    for(let b=-1;b<=1;b++){ g.beginPath(); g.ellipse(px,py+b*pr*0.4,pr*1.1,pr*0.16,0.15,0,7); g.stroke(); }
    g.globalAlpha=1;
    const sch=g.createLinearGradient(px-pr,py-pr,px+pr,py+pr);
    sch.addColorStop(0.45,"rgba(0,0,0,0)"); sch.addColorStop(1,"rgba(0,0,10,.62)");
    g.fillStyle=sch; g.fillRect(px-pr,py-pr,pr*2,pr*2);
    g.restore();
    if(p.ring) ring(g,px,py,pr,false);
  }

  // heuvels in de verte
  for(let laag=0;laag<2;laag++){
    const basis=G_TOP-(laag?28:70), hoogte=laag?60:110;
    g.fillStyle=laag?SF.heuvel:rgba(SF.heuvel,0.6);
    g.beginPath(); g.moveTo(-BG_PX,G_TOP+2);
    let y=basis;
    for(let x=-BG_PX;x<=WORLD_W+BG_PX;x+=40){ y=basis-Math.abs(Math.sin(x*0.004+laag*2+pi))*hoogte*(0.5+r()*0.5); g.lineTo(x,y); }
    g.lineTo(WORLD_W+BG_PX,G_TOP+2); g.closePath(); g.fill();
    if(!laag){ g.strokeStyle=rgba(SF.gloed,0.12); g.lineWidth=2; g.stroke(); }
  }
  // horizon-gloed
  const hz=g.createLinearGradient(0,G_TOP-120,0,G_TOP);
  hz.addColorStop(0,rgba(SF.gloed,0)); hz.addColorStop(1,rgba(SF.gloed,0.14));
  g.fillStyle=hz; g.fillRect(-BG_PX,G_TOP-120,WORLD_W+2*BG_PX,120);

  // grond met lagen, kraters en stenen
  const gg=g.createLinearGradient(0,G_TOP,0,WORLD_H+BG_PY);
  gg.addColorStop(0,TH.gTop); gg.addColorStop(0.4,TH.gBot); gg.addColorStop(1,"#05040c");
  g.fillStyle=gg; g.fillRect(-BG_PX,G_TOP,WORLD_W+2*BG_PX,WORLD_H-G_TOP+BG_PY);
  g.strokeStyle="rgba(0,0,0,.18)"; g.lineWidth=2;
  for(let l=1;l<4;l++){ g.beginPath(); for(let x=-BG_PX;x<=WORLD_W+BG_PX;x+=30){ const yy=G_TOP+l*20+Math.sin(x*0.02+l)*3; x===-BG_PX?g.moveTo(x,yy):g.lineTo(x,yy); } g.stroke(); }
  for(let i=0;i<14;i++){ const x=r()*WORLD_W, y=G_TOP+18+r()*(WORLD_H-G_TOP-28), w=18+r()*34;
    g.fillStyle="rgba(0,0,0,.28)"; g.beginPath(); g.ellipse(x,y,w,w*0.3,0,0,7); g.fill();
    g.strokeStyle=rgba(SF.krater,0.9); g.lineWidth=2; g.beginPath(); g.ellipse(x,y-1,w,w*0.3,0,Math.PI,2*Math.PI); g.stroke(); }
  for(let i=0;i<40;i++){ const x=r()*WORLD_W, w=3+r()*8;
    g.fillStyle=SF.rots; g.beginPath(); g.ellipse(x,G_TOP+2,w,w*0.6,0,Math.PI,2*Math.PI); g.fill(); }
  // gloeiende rand van de grond
  g.save(); g.shadowColor=SF.gloed; g.shadowBlur=14;
  g.strokeStyle=rgba(SF.gloed,0.75); g.lineWidth=2.5;
  g.beginPath(); g.moveTo(-BG_PX,G_TOP); g.lineTo(WORLD_W+BG_PX,G_TOP); g.stroke(); g.restore();

  bgCache={key,canvas:c};
  return c;
}
function ring(g,px,py,pr,achter){
  g.save(); g.translate(px,py); g.rotate(-0.38);
  g.beginPath(); achter ? g.rect(-pr*2,-pr*2,pr*4,pr*2) : g.rect(-pr*2,0,pr*4,pr*2); g.clip();
  for(let i=0;i<3;i++){ g.strokeStyle=`rgba(255,225,190,${0.42-i*0.11})`; g.lineWidth=5-i;
    g.beginPath(); g.ellipse(0,0,pr*(1.55+i*0.14),pr*(0.42+i*0.04),0,0,7); g.stroke(); }
  g.restore();
}

let vallend=null;   // vallende ster
function render(){
  const dpr=view.dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cw=canvas.width/dpr, ch=canvas.height/dpr;
  const TH=curPlanet();
  const grd=ctx.createRadialGradient(cw*0.7,ch*0.05,40, cw*0.7,ch*0.05, Math.max(cw,ch)*1.1);
  grd.addColorStop(0,TH.bg[0]); grd.addColorStop(.5,TH.bg[1]); grd.addColorStop(1,TH.bg[2]);
  ctx.fillStyle=grd; ctx.fillRect(0,0,cw,ch);

  const sh = shake>0 ? (Math.random()-0.5)*shake : 0;
  ctx.translate(view.ox+sh, view.oy+sh);
  ctx.scale(view.scale,view.scale);
  ctx.drawImage(achtergrond(),-BG_PX,-BG_PY,WORLD_W+2*BG_PX,WORLD_H+2*BG_PY);
  drawTwinkle();

  if(state.screen==="play"||state.screen==="result"){
    drawLauncher(); drawBlocks(); drawAliens(); drawShards(); drawProjectile(); drawLauncherFront();
    if(aiming) drawTrajectory();
    drawRings(); drawParticles(); drawFloaters(); drawShots(); drawAbilityHint(); drawUitleg();
  } else {
    drawParticles();
  }
}
function drawTwinkle(){
  const t=performance.now()/1000, SF=sfeer();
  ctx.save(); ctx.globalCompositeOperation="lighter";
  for(let i=0;i<18;i++){ const x=(i*977)%WORLD_W, y=(i*331)%(G_TOP*0.8), a=Math.max(0,Math.sin(t*1.6+i*1.7));
    ctx.fillStyle=`rgba(255,255,255,${a*0.8})`; ctx.beginPath(); ctx.arc(x,y,1.2+a*1.4,0,7); ctx.fill(); }
  // af en toe een vallende ster
  if(!vallend && Math.random()<0.004) vallend={x:200+Math.random()*WORLD_W*0.8, y:30+Math.random()*180, t:0};
  if(vallend){ vallend.t+=0.025; const f=vallend.t, x=vallend.x-f*420, y=vallend.y+f*170;
    const gr=ctx.createLinearGradient(x,y,x+110,y-45); gr.addColorStop(0,"rgba(255,255,255,.9)"); gr.addColorStop(1,rgba(SF.neb[1],0));
    ctx.strokeStyle=gr; ctx.lineWidth=2.5; ctx.globalAlpha=Math.sin(Math.min(1,f)*Math.PI);
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+110,y-45); ctx.stroke(); ctx.globalAlpha=1;
    if(f>=1) vallend=null; }
  ctx.restore();
}

/* ---------- katapult: voet, paal en vork met twee energiebanden ---------- */
const VORK_ACHTER={x:-26,y:-20}, VORK_VOOR={x:26,y:-24};
function katapultKracht(){ const ap=state.aimPoint||ANCHOR; return Math.min(1, Math.hypot(ap.x-ANCHOR.x, ap.y-ANCHOR.y)/MAX_STRETCH); }
function bandKleur(p){ return p<0.5 ? `rgb(${Math.round(55+p*2*200)},${Math.round(230-p*2*60)},255)` : `rgb(255,${Math.round(170-(p-0.5)*2*80)},${Math.round(255-(p-0.5)*2*200)})`; }
function band(tip){
  const p=state.projectile; if(!p || state.phase!=="aim") return;
  const pos=state.aimPoint||ANCHOR, kr=katapultKracht();
  ctx.save(); ctx.lineCap="round";
  ctx.shadowColor=bandKleur(kr); ctx.shadowBlur=12;
  ctx.strokeStyle=bandKleur(kr); ctx.lineWidth=7-kr*3.5;
  ctx.beginPath(); ctx.moveTo(ANCHOR.x+tip.x, ANCHOR.y+tip.y); ctx.lineTo(pos.x, pos.y); ctx.stroke();
  ctx.shadowBlur=0; ctx.strokeStyle="rgba(255,255,255,.7)"; ctx.lineWidth=1.5; ctx.stroke();
  ctx.restore();
}
function vorkTand(tip){
  const t=performance.now()/500;
  ctx.strokeStyle="#4a5590"; ctx.lineWidth=11; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(ANCHOR.x, ANCHOR.y+44); ctx.quadraticCurveTo(ANCHOR.x+tip.x*1.1, ANCHOR.y+30, ANCHOR.x+tip.x, ANCHOR.y+tip.y); ctx.stroke();
  ctx.strokeStyle="#7f8fd6"; ctx.lineWidth=3; ctx.stroke();
  ctx.save(); ctx.shadowColor="#37e6ff"; ctx.shadowBlur=16;
  ctx.fillStyle=`rgba(140,245,255,${0.75+0.25*Math.sin(t)})`;
  ctx.beginPath(); ctx.arc(ANCHOR.x+tip.x, ANCHOR.y+tip.y, 7, 0, 7); ctx.fill(); ctx.restore();
}
function drawLauncher(){
  const x=ANCHOR.x, SF=sfeer();
  ctx.save();
  // schaduw en voet
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(x,G_TOP+4,70,10,0,0,7); ctx.fill();
  const voet=ctx.createLinearGradient(0,G_TOP-26,0,G_TOP);
  voet.addColorStop(0,"#3b4682"); voet.addColorStop(1,"#1d2350");

/* ---------- aliens: kijken naar de raket, knipperen, schrikken ---------- */
function drawAliens(){
  const t=performance.now();
  const p=state.projectile, doel=p?(p.gameData.rp||p.position):ANCHOR;
  for(const a of aliens){
    const g=a.gameData, r=g.r;
    const rp=g.rp||a.position; const ra=g.rp?g.rp.a:a.angle;
    const dx=doel.x-rp.x, dy=doel.y-rp.y, d=Math.hypot(dx,dy)||1;
    const bang=state.phase==="fly" && d<260;
    ctx.save(); ctx.translate(rp.x,rp.y+Math.sin(t/300+g.bob)*1.5); ctx.rotate(ra*0.3);
    // gloed
    ctx.save(); ctx.shadowColor="#7dff8a"; ctx.shadowBlur=18;
    const lijf=ctx.createRadialGradient(-r*0.35,-r*0.45,r*0.1,0,0,r);
    lijf.addColorStop(0,"#d6ffd9"); lijf.addColorStop(0.35,"#7dff8a"); lijf.addColorStop(1,"#2a9f45");
    ctx.fillStyle=lijf; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill(); ctx.restore();
    ctx.strokeStyle="#1f7a36"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.stroke();
    // antennes met lichtbolletjes
    ctx.strokeStyle="#1f7a36"; ctx.lineWidth=2.5; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(-6,-r+3); ctx.quadraticCurveTo(-12,-r-4,-10,-r-9); ctx.moveTo(6,-r+3); ctx.quadraticCurveTo(12,-r-4,10,-r-9); ctx.stroke();
    ctx.save(); ctx.shadowColor="#ffd34d"; ctx.shadowBlur=10; ctx.fillStyle=`rgba(255,220,90,${0.7+0.3*Math.sin(t/200+g.bob)})`;
    ctx.beginPath(); ctx.arc(-10,-r-10,3,0,7); ctx.arc(10,-r-10,3,0,7); ctx.fill(); ctx.restore();
    // ogen (kijken naar de raket, knipperen af en toe)
    const knipper=((t/1000+g.bob*3)%4)<0.12;
    const ow=r*0.25, oh=bang?r*0.36:r*0.32, kx=dx/d*r*0.08, ky=dy/d*r*0.08;
    for(const s of [-1,1]){

        ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(ex+kx-ow*0.22,ey+ky-oh*0.3,ow*0.22,0,7); ctx.fill(); }
    }
    // wangen en mond
    ctx.fillStyle="rgba(255,120,150,.35)"; ctx.beginPath(); ctx.ellipse(-r*0.62,r*0.25,r*0.14,r*0.08,0,0,7); ctx.ellipse(r*0.62,r*0.25,r*0.14,r*0.08,0,0,7); ctx.fill();
    ctx.strokeStyle="#145a26"; ctx.lineWidth=2;
    if(bang){ ctx.fillStyle="#145a26"; ctx.beginPath(); ctx.ellipse(0,r*0.45,r*0.13,r*0.17,0,0,7); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(0,r*0.32,r*0.26,0.15*Math.PI,0.85*Math.PI); ctx.stroke(); }
    if(g.flash>0){ ctx.fillStyle=`rgba(255,90,90,${g.flash*0.7})`; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill(); }
    ctx.restore();
  }
}

function drawTrajectory(){
  if(!state.aimPoint) return;
  let vx=(ANCHOR.x-state.aimPoint.x)*POWER, vy=(ANCHOR.y-state.aimPoint.y)*POWER;
  const sp=Math.hypot(vx,vy); if(sp<3) return;
  if(sp>MAX_SPEED){ vx=vx/sp*MAX_SPEED; vy=vy/sp*MAX_SPEED; }
  let x=state.aimPoint.x, y=state.aimPoint.y; const g=G_STEP(), fa=0.006;
  const SHOW=22, kl=bandKleur(katapultKracht());
  ctx.save(); ctx.shadowColor=kl; ctx.shadowBlur=8; ctx.fillStyle=kl;
  for(let n=0;n<SHOW;n++){
    vy+=g; vx*=(1-fa); vy*=(1-fa); x+=vx; y+=vy;
    if(y>G_TOP-4) break;
    if(n%2===0){ ctx.globalAlpha=Math.max(.12, 0.95-n/SHOW); const sz=Math.max(1.6, 4-n*0.12);
      ctx.beginPath(); ctx.arc(x,y,sz,0,7); ctx.fill(); }
  }
  ctx.restore();
}

  for(const p of particles){ const a=Math.max(0,p.life/p.max); ctx.globalAlpha=a;
    ctx.fillStyle=p.color;
    if(p.sq){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot||0); ctx.fillRect(-p.size,-p.size,p.size*2,p.size*2); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(0.5+a*0.5),0,7); ctx.fill(); } }
  ctx.restore();
}
function drawFloaters(){
  ctx.textAlign="center"; ctx.font="24px 'Russo One', system-ui, sans-serif";
  for(const f of floaters){ ctx.globalAlpha=Math.max(0,f.life);
    ctx.lineWidth=4; ctx.strokeStyle="rgba(0,0,0,.45)"; ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.color; ctx.fillText(f.text,f.x,f.y); }
  ctx.globalAlpha=1;
}
function drawShots(){
  // resterende raketten in een rijtje naast de katapult
  const used=state.rockets.length - state.shotsLeft;
  const reserve=state.rockets.slice(used+1);
  for(let i=0;i<reserve.length;i++){
    const cfg=ROCKETS[reserve[i]]||ROCKETS.standard;
    const x=ANCHOR.x-90 - i*30, y=G_TOP-14;
    ctx.save(); ctx.translate(x,y); ctx.rotate(-Math.PI/2); ctx.scale(0.55,0.55);
    drawBodyByType({type:reserve[i], r:cfg.r}, true);
    ctx.restore();
  }
}
function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ============================================================
   SCHERMEN / UI
   ============================================================ */
const screens={ start:document.getElementById("start"), select:document.getElementById("select"),
  result:document.getElementById("result") };
const hud=document.getElementById("hud");
function show(s){
  state.screen=s;
  for(const k in screens) screens[k].classList.toggle("on", k===s && s!=="play");
  hud.classList.toggle("on", s==="play");
}
function updateHUD(){
  document.getElementById("hudLevel").textContent=state.levelIndex+1;
  document.getElementById("hudScore").textContent=state.score.toLocaleString("nl-NL");
  document.getElementById("hudAliens").textContent=aliens.length;
}
function buildGrid(){
  const grid=document.getElementById("grid"); grid.innerHTML="";
  LEVELS.forEach((_,i)=>{
    if(i%10===0){ const h=document.createElement("div"); h.className="planet-head";
      h.textContent=planetOf(i).name; grid.appendChild(h); }
    const num=i+1; const unlocked=num<=progress.unlocked;
    const stars=progress.stars[num]||0;
    const cell=document.createElement("div");
    cell.className="cell"+(unlocked?"":" locked")+(stars>0?" cleared":"");
    cell.innerHTML=`<span>${num}</span>`+(stars>0?`<div class="stars">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>`:"");
    if(unlocked) cell.addEventListener("click",()=>{ resumeAudio(); loadLevel(i); });
    grid.appendChild(cell);
  });
}
function showResult(win,stars,score){
  state.screen="result"; show("result");
  document.getElementById("resTitle").textContent= win?"Missie geslaagd":"Missie mislukt";
  document.getElementById("resStars").textContent= win? ("★".repeat(stars)+"☆".repeat(3-stars)) : "";
  document.getElementById("resScore").textContent=score.toLocaleString("nl-NL");
  const next=document.getElementById("btnResNext");
  next.style.display = (win && state.levelIndex+1<LEVELS.length) ? "" : "none";
  // Beloning-modus: 1 level gespeeld → meld aan de ouder zodat we terug gaan
  if(REWARD){ try{ parent.postMessage({type:"astrokatapult-leveldone", win:!!win},"*"); }catch(e){} }
}

/* knoppen */
document.getElementById("btnPlay").onclick=()=>{ resumeAudio(); loadLevel(Math.min(progress.unlocked-1,LEVELS.length-1)); };
document.getElementById("btnLevels").onclick=()=>{ buildGrid(); show("select"); };
document.getElementById("btnBack").onclick=()=>show("start");
document.getElementById("btnMenu").onclick=()=>{ buildGrid(); show("select"); };
document.getElementById("btnRetry").onclick=()=>loadLevel(state.levelIndex);
document.getElementById("btnResMenu").onclick=()=>{ buildGrid(); show("select"); };
document.getElementById("btnResRetry").onclick=()=>loadLevel(state.levelIndex);
document.getElementById("btnResNext").onclick=()=>loadLevel(Math.min(state.levelIndex+1,LEVELS.length-1));

/* pointer events */
/* pointer events (canvas vangt alles via pointer-capture) */
canvas.addEventListener("pointerdown",pointerDown);
canvas.addEventListener("pointermove",pointerMove);
canvas.addEventListener("pointerup",pointerUp);
canvas.addEventListener("pointercancel",pointerUp);
canvas.addEventListener("lostpointercapture",pointerUp);
canvas.addEventListener("contextmenu",e=>e.preventDefault());

/* init */
window.addEventListener("resize",resize);
initEngine(); resize(); loop();

/* test-hook (alleen lezen/levels openen), gebruikt door tools/ */
window.__ak = { get state(){ return state; }, get view(){ return view; }, ANCHOR, LEVELS, loadLevel, get progress(){ return progress; },
  get aliens(){ return aliens; }, get blocks(){ return blocks; },
  reken(n){ for(let i=0;i<n;i++) Engine.update(engine, FIXED_DT); },
  // speelt één schot helemaal uit (zonder beeld); geeft het aantal aliens dat over is
  schiet(dx,dy){
    if(state.phase!=="aim"||!state.projectile) return aliens.length;
    state.aimPoint={x:ANCHOR.x+dx, y:Math.min(ANCHOR.y+dy, G_TOP-state.projectile.gameData.r-4)};
    fire();
    for(let n=0; n<3000 && (state.phase==="fly"||state.phase==="settle"); n++){ Engine.update(engine, FIXED_DT); simT+=FIXED_DT; controleerSchot(); }
    return aliens.length;
  } };

/* Beloning-modus: sla het startscherm/level-keuze over en start direct level 1 */
if(REWARD){
  document.getElementById("btnMenu").style.display="none";       // geen level-keuze tijdens beloning
  document.getElementById("btnResMenu").style.display="none";
  loadLevel(0);
}
}
</script>
<script>window.__startLoad();</script>
