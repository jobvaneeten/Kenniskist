<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dierentuinbaas</title>
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --ink:#eef3ff; --dim:#8f9bc4; --cyaan:#3ef0ff; --magenta:#ff4fd8; --goud:#ffc83d; --violet:#9b6bff; --groen:#4dffa0; --rood:#ff5c7a;
    --glas:rgba(12,14,34,.84); --lijn:rgba(255,255,255,.13);
    --disp:'Russo One',system-ui,sans-serif; --body:'Outfit','Nunito',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#060a14;}
  body{font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;}
  button{font-family:var(--body);font-weight:800;cursor:pointer;border:0;color:inherit;}
  .verborgen{display:none !important;}

  /* bovenbalk */
  #hud{position:fixed;top:10px;left:10px;right:10px;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none;}
  .pil{height:38px;display:flex;align-items:center;gap:7px;padding:0 13px;border-radius:999px;background:var(--glas);border:1px solid var(--lijn);
       backdrop-filter:blur(8px);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .pil.klik{pointer-events:auto;cursor:pointer;}
  .munt{display:inline-block;width:16px;height:16px;border-radius:50%;flex:none;
        background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc83d 55%,#b8860b);box-shadow:0 0 10px rgba(255,200,61,.6);}
  #geld{font-family:var(--disp);font-size:18px;color:var(--goud);}
  #sterren{display:flex;gap:2px;}
  #sterren i{width:15px;height:15px;background:rgba(255,255,255,.18);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
  #sterren i.aan{background:var(--goud);filter:drop-shadow(0 0 4px rgba(255,200,61,.8));}
  #bezoek{font-size:13px;color:var(--dim);}
  #bezoek b{color:var(--ink);}
  #niveau{flex-direction:column;align-items:stretch;justify-content:center;gap:3px;height:38px;min-width:120px;}
  #niveau span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyaan);font-family:var(--disp);}
  #niveau .balk{height:5px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;}
  #niveau .balk i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyaan),var(--magenta));border-radius:99px;}
  .ruimte{flex:1;}
  .rondknop{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;
            background:var(--glas);border:1px solid rgba(255,255,255,.18);pointer-events:auto;}
  .rondknop svg{width:19px;height:19px;}
  #terug{display:none;pointer-events:auto;}
  #terug.aan{display:flex;}

  /* hint en meldingen */
  #hint{position:fixed;left:50%;transform:translateX(-50%);top:58px;z-index:6;max-width:min(560px,92vw);padding:9px 16px;border-radius:14px;
        background:linear-gradient(135deg,rgba(62,240,255,.16),rgba(155,107,255,.16)),var(--glas);border:1px solid rgba(62,240,255,.35);
        font-size:14px;line-height:1.35;text-align:center;pointer-events:none;}
  #hint b{color:var(--cyaan);}
  #melding{position:fixed;left:50%;top:104px;transform:translateX(-50%);z-index:15;max-width:min(440px,90vw);padding:10px 16px;border-radius:14px;
           background:var(--glas);border:1px solid var(--lijn);font-size:14px;text-align:center;line-height:1.4;opacity:0;transition:opacity .25s;pointer-events:none;}
  #melding.aan{opacity:1;}
  #melding.fout{border-color:rgba(255,92,122,.6);}
  #melding b{color:var(--goud);}

  /* gereedschap onderin */
  #balk{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--glas);backdrop-filter:blur(10px);border-top:1px solid var(--lijn);
        padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;}
  #tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;}
  #tabs::-webkit-scrollbar{display:none;}
  .tab{flex:none;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:12px;font-size:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);}
  .tab.aan{background:linear-gradient(135deg,var(--cyaan),#7dfff0);color:#071018;border-color:transparent;}
  .tab svg{width:16px;height:16px;}
  #items{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;touch-action:pan-x;}
  #items:empty{display:none;}
  .item{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 6px;border-radius:14px;position:relative;
        background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);}
  .item canvas{width:48px;height:42px;}
  .item .naam{font-size:12px;line-height:1.1;text-align:center;}
  .item .prijs{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--goud);}
  .item .prijs .munt{width:11px;height:11px;}
  .item.aan{border-color:var(--cyaan);box-shadow:0 0 0 1px var(--cyaan) inset,0 0 18px rgba(62,240,255,.3);background:rgba(62,240,255,.1);}
  .item.duur .prijs{color:var(--rood);}
  .item.slot{opacity:.45;}
  .item.slot::after{content:attr(data-slot);position:absolute;inset:auto 4px 4px;font-size:10px;color:var(--dim);text-align:center;}
  .item.slot .prijs{visibility:hidden;}
  .uitleg{font-size:13px;color:var(--dim);padding:4px 4px 2px;line-height:1.4;}
  .uitleg b{color:var(--ink);}
  .knop{padding:10px 20px;border-radius:999px;font-size:14px;color:#071018;background:linear-gradient(135deg,var(--cyaan),#7dfff0);}
  .knop:disabled{background:rgba(255,255,255,.08);color:#6f7899;cursor:default;}
  .knop.goud{background:linear-gradient(135deg,var(--goud),#ffe08a);color:#20140a;}
  .knop.rood{background:rgba(255,92,122,.18);color:#ffb3c1;border:1px solid rgba(255,92,122,.5);}
  .knop2{padding:9px 16px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);}

  /* info over een verblijf */
  #info{position:fixed;right:12px;z-index:9;width:min(330px,calc(100vw - 24px));padding:14px;border-radius:18px;background:var(--glas);
        border:1px solid var(--lijn);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:10px;}
  #info h3{margin:0;font-family:var(--disp);font-size:16px;letter-spacing:.04em;display:flex;align-items:center;gap:8px;}
  #info .sluit{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);font-size:16px;}
  .harten{display:flex;gap:3px;}
  .harten i{width:16px;height:15px;background:rgba(255,255,255,.15);clip-path:path('M8 14 L1.6 7.6 A3.8 3.8 0 0 1 8 2.6 A3.8 3.8 0 0 1 14.4 7.6 Z');}
  .harten i.aan{background:var(--magenta);filter:drop-shadow(0 0 4px rgba(255,79,216,.7));}
  .redenen{display:flex;flex-direction:column;gap:4px;font-size:13px;}
  .redenen span{display:flex;gap:7px;align-items:center;}
  .redenen span::before{content:'';width:9px;height:9px;border-radius:50%;flex:none;background:var(--groen);box-shadow:0 0 6px var(--groen);}
  .redenen span.nee::before{background:var(--rood);box-shadow:0 0 6px var(--rood);}
  .ruimtebalk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);}
  .ruimtebalk div{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;}
  .ruimtebalk i{display:block;height:100%;background:var(--cyaan);border-radius:99px;}
  .infoknoppen{display:flex;gap:8px;flex-wrap:wrap;}
  .infoknoppen .knop{display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:13px;}
  .infoknoppen .munt{width:12px;height:12px;}

  /* doelen van het level */
  #doelen{position:fixed;left:10px;top:58px;z-index:7;width:min(300px,calc(100vw - 20px));padding:12px 14px;border-radius:16px;
          background:var(--glas);border:1px solid rgba(62,240,255,.3);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:7px;}
  #doelen.dicht{display:none;}
  #doelen .kop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  #doelen .kop b{font-family:var(--disp);font-size:14px;letter-spacing:.04em;}
  #doelen .kop span{font-size:11px;color:var(--goud);font-weight:800;white-space:nowrap;}
  .doel{display:flex;flex-direction:column;gap:3px;font-size:12.5px;}
  .doel .r{display:flex;justify-content:space-between;gap:8px;}
  .doel .r span:last-child{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .doel .b{height:5px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;}
  .doel .b i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyaan),var(--violet));}
  .doel.klaar .r span:first-child{color:var(--groen);}
  .doel.klaar .r span:first-child::before{content:'✓ ';}
  .doel.klaar .b i{background:var(--groen);}
  #zoom{position:fixed;left:10px;z-index:7;display:flex;flex-direction:column;gap:6px;}
  #zoom .rondknop{width:40px;height:40px;}
  .scherm .doellijst{display:flex;flex-direction:column;gap:6px;text-align:left;font-size:14px;color:var(--ink);background:rgba(255,255,255,.05);
                     border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 16px;max-width:360px;}
  .scherm .beloning{font-family:var(--disp);font-size:22px;color:var(--goud);text-shadow:0 0 14px rgba(255,200,61,.5);}
  #wereldknop{gap:6px;font-size:13px;color:var(--cyaan);}
  #doelen .wereldnaam{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:800;}
  #wereldscherm{justify-content:flex-start;overflow-y:auto;padding-top:40px;}
  #wereldlijst{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;width:100%;max-width:820px;}
  .wereldkaart{display:flex;flex-direction:column;align-items:stretch;gap:5px;padding:10px;border-radius:18px;text-align:left;
               background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);transition:transform .15s,border-color .15s;}
  .wereldkaart:hover{transform:translateY(-3px);border-color:var(--cyaan);}
  .wereldkaart canvas{width:100%;aspect-ratio:150/84;border-radius:12px;}
  .wereldkaart .naam{font-family:var(--disp);font-size:15px;letter-spacing:.03em;}
  .wereldkaart .zin{font-size:12px;color:var(--dim);line-height:1.35;font-weight:600;}
  .wereldkaart .status{font-size:12px;font-weight:800;color:var(--cyaan);}
  .wereldkaart.huidig{border-color:var(--cyaan);box-shadow:0 0 0 1px var(--cyaan) inset,0 0 20px rgba(62,240,255,.25);}
  .wereldkaart.dicht{opacity:.5;}
  .wereldkaart.dicht .status{color:var(--dim);}
  .wereldkaart.creatief{border-color:rgba(255,79,216,.5);}
  .wereldkaart.creatief .status{color:var(--magenta);}
  .scherm{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;
          background:radial-gradient(ellipse 70% 50% at 50% 40%,rgba(62,240,255,.16),transparent 70%),rgba(6,8,20,.85);backdrop-filter:blur(6px);}
  .scherm.aan{display:flex;animation:in .3s ease-out;}
  .scherm .klein{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);}
  .scherm h1{margin:0;font-family:var(--disp);font-size:clamp(34px,9vw,58px);letter-spacing:.04em;text-transform:uppercase;
             background:linear-gradient(100deg,var(--cyaan),#fff 45%,var(--magenta));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .scherm p{margin:0;color:var(--dim);max-width:36ch;line-height:1.5;}
  .scherm p b{color:var(--ink);}
  @keyframes in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <button class="rondknop" id="terug" aria-label="Terug naar het menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button class="pil klik" id="wereldknop" aria-label="Wereld kiezen"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>Werelden</button>
  <div class="pil"><span class="munt"></span><span id="geld">0</span></div>
  <div class="pil"><div id="sterren"><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="pil" id="bezoek"><b id="perMin">0</b>&nbsp;bezoekers per minuut</div>
  <button class="pil klik" id="niveau" aria-label="Doelen van dit level"><span id="niveautekst">Level 1</span><div class="balk"><i id="niveaubalk"></i></div></button>
  <div class="ruimte"></div>
  <button class="rondknop" id="geluid" aria-label="Geluid aan of uit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="golfje" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
  </button>
</div>

<div id="hint"></div>
<div id="melding"></div>

<div id="info" class="verborgen"></div>

<div id="doelen"></div>

<div id="zoom">
  <button class="rondknop" id="zoomIn" aria-label="Inzoomen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="rondknop" id="zoomUit" aria-label="Uitzoomen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <button class="rondknop" id="zoomAlles" aria-label="Hele dierentuin bekijken"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div id="balk">
  <div id="tabs"></div>
  <div id="items"></div>
</div>

<div class="scherm" id="wereldscherm">
  <div class="klein">Dierentuinbaas</div>
  <h1>Kies je wereld</h1>
  <p>Elke wereld is een eigen dierentuin. Haal level 4 om de volgende wereld te openen.</p>
  <div id="wereldlijst"></div>
  <button class="knop2" id="wereldsluit">Terug naar je dierentuin</button>
</div>

<div class="scherm" id="niveauscherm">
  <div class="klein" id="niveauklein">Level gehaald!</div>
  <h1 id="niveautitel">Level 2</h1>
  <div class="beloning" id="niveaubeloning"></div>
  <p id="niveaunieuw"></p>
  <div class="doellijst" id="niveaudoelen"></div>
  <button class="knop" id="niveauverder">Verder bouwen</button>
</div>

<script src="kern.js"></script>
<script src="spel.js"></script>
</body>
</html>
