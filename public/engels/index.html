<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engelse woordjes - RONDÉ Song 7, 8 en 9</title>
<style>
  :root{
    --paper:#0d0d1a;
    --ink:#ffffff;
    --ink-soft:rgba(255,255,255,.62);
    --card:rgba(255,255,255,.05);
    --card-hover:rgba(255,255,255,.09);
    --line:rgba(255,255,255,.14);
    --good:#06D6A0;
    --good-bg:rgba(6,214,160,.15);
    --good-ink:#7af3cd;
    --bad:#FF6B6B;
    --bad-bg:rgba(255,107,107,.15);
    --bad-ink:#ffb3b3;
    --s7:#8b6bff;
    --s8:#ff8a3d;
    --s9:#2bc0df;
    --shadow:0 14px 36px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:'Nunito',"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse 50% 42% at 14% 12%, rgba(139,107,255,.18) 0%, transparent 58%),
      radial-gradient(ellipse 48% 40% at 88% 8%, rgba(255,138,61,.16) 0%, transparent 58%),
      radial-gradient(ellipse 52% 46% at 82% 92%, rgba(43,192,223,.14) 0%, transparent 58%),
      var(--paper);
    min-height:100vh;
    line-height:1.5;
  }
  .wrap{max-width:760px;margin:0 auto;padding:64px 18px 64px}
  .hidden{display:none!important}

  /* ---------- Home + Levels ---------- */
  .head h1{font-size:30px;margin:4px 0 6px;letter-spacing:-.3px}
  .head p{margin:0 0 22px;color:var(--ink-soft);font-size:16px}

  .songs{display:grid;gap:16px}
  .song{
    border:0;text-align:left;cursor:pointer;color:#fff;
    border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:18px;font-family:inherit;
    transition:transform .12s ease, filter .12s ease;
  }
  .song:hover{transform:translateY(-2px);filter:brightness(1.08)}
  .song:active{transform:translateY(0)}
  .song:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .song.s7{background:linear-gradient(135deg,#8b6bff,#6a47ff)}
  .song.s8{background:linear-gradient(135deg,#ffa05a,#ff7a2e)}
  .song.s9{background:linear-gradient(135deg,#39bcd8,#1496b6)}
  .song .num{
    flex:0 0 auto;width:56px;height:56px;border-radius:16px;
    background:rgba(255,255,255,.22);display:grid;place-items:center;
    font-size:24px;font-weight:800;
  }
  .song .meta{flex:1 1 auto;min-width:0}
  .song .title{font-size:20px;font-weight:800}
  .song .sub{font-size:13.5px;opacity:.92;font-weight:500}
  .song .count{font-size:13px;opacity:.92;margin-top:3px}
  .song .go{flex:0 0 auto;font-size:26px;font-weight:800;opacity:.9}

  .levelhead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .levelhead h2{margin:0;font-size:22px}

  /* ---------- Quiz ---------- */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .back{
    border:1px solid var(--line);background:var(--card);border-radius:12px;
    padding:9px 14px;font-size:14px;font-weight:800;color:var(--ink);
    cursor:pointer;font-family:inherit;
  }
  .back:hover{background:var(--card-hover)}
  .pill{
    font-size:13px;font-weight:800;color:#fff;border-radius:999px;
    padding:7px 14px;
  }
  .pill.s7{background:var(--s7)} .pill.s8{background:var(--s8)} .pill.s9{background:var(--s9)}
  .counter{margin-left:auto;font-size:14px;font-weight:800;color:var(--ink-soft)}

  .bar{height:10px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;margin-bottom:22px}
  .bar > i{display:block;height:100%;width:0;border-radius:999px;transition:width .3s ease}
  .bar.s7 > i{background:var(--s7)} .bar.s8 > i{background:var(--s8)} .bar.s9 > i{background:var(--s9)}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:24px;
    box-shadow:var(--shadow);padding:26px 22px;
    backdrop-filter:blur(6px);
  }
  .ask{text-align:center;color:var(--ink-soft);font-size:14px;font-weight:800;
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .wordrow{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 24px}
  .word{font-size:40px;font-weight:800;letter-spacing:-.5px;text-align:center}
  .word.long{font-size:23px;letter-spacing:0;line-height:1.35}
  .speak{
    flex:0 0 auto;width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(139,107,255,.22);color:#b9a6ff;display:grid;place-items:center;
    transition:transform .1s ease, background .15s ease;font-family:inherit;
  }
  .speak.s8{background:rgba(255,138,61,.22);color:#ffc08a} .speak.s9{background:rgba(43,192,223,.22);color:#8fe0f3}
  .speak:hover{transform:scale(1.06)}
  .speak:active{transform:scale(.96)}
  .speak:disabled{opacity:.4;cursor:default;transform:none}
  .speak svg{width:26px;height:26px}

  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .options.single{grid-template-columns:1fr}
  @media(max-width:520px){.options{grid-template-columns:1fr}.word{font-size:34px}.word.long{font-size:20px}}
  .opt{
    border:2px solid var(--line);background:var(--card);border-radius:16px;
    padding:16px 16px;font-size:17px;font-weight:700;color:var(--ink);
    cursor:pointer;text-align:left;font-family:inherit;min-height:58px;
    transition:border-color .12s ease, background .12s ease, transform .08s ease;
    display:flex;align-items:center;gap:10px;
  }
  .opt:hover:not(:disabled){border-color:#8b6bff;background:var(--card-hover)}
  .opt:active:not(:disabled){transform:translateY(1px)}
  .opt:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .opt:disabled{cursor:default}
  .opt .tick{margin-left:auto;font-weight:800;font-size:18px;opacity:0}
  .opt.correct{border-color:var(--good);background:var(--good-bg);color:var(--good-ink)}
  .opt.correct .tick{opacity:1;color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-ink)}
  .opt.wrong .tick{opacity:1;color:var(--bad)}
  .opt.dim{opacity:.45}

  .next{
    margin-top:20px;width:100%;border:0;border-radius:16px;cursor:pointer;
    padding:16px;font-size:17px;font-weight:800;color:#fff;font-family:inherit;
    transition:filter .12s ease, transform .08s ease;
  }
  .next:hover{filter:brightness(1.08)} .next:active{transform:translateY(1px)}
  .next.s7{background:var(--s7)} .next.s8{background:var(--s8)} .next.s9{background:var(--s9)}
  .next:disabled{background:rgba(255,255,255,.12);color:rgba(255,255,255,.4);cursor:default;filter:none}

  /* ---------- Results ---------- */
  .result-top{text-align:center;padding:8px 0 6px}
  .score-ring{
    width:140px;height:140px;border-radius:50%;margin:6px auto 14px;
    display:grid;place-items:center;color:#fff;box-shadow:var(--shadow);
  }
  .score-ring .pct{font-size:38px;font-weight:800;line-height:1}
  .score-ring .lbl{font-size:13px;font-weight:700;opacity:.9}
  .ring.s7{background:linear-gradient(135deg,#8b6bff,#6a47ff)}
  .ring.s8{background:linear-gradient(135deg,#ffa05a,#ff7a2e)}
  .ring.s9{background:linear-gradient(135deg,#39bcd8,#1496b6)}
  .result-top h2{margin:4px 0 2px;font-size:24px}
  .result-top .praise{color:var(--ink-soft);margin:0 0 10px;font-size:15px}

  .review{margin-top:18px}
  .review h3{font-size:15px;margin:0 0 10px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.5px}
  .miss{
    display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;margin-bottom:8px;
  }
  .miss .en{font-weight:800;font-size:15.5px}
  .miss .arrow{color:var(--ink-soft);flex:0 0 auto}
  .miss .nl{color:var(--ink-soft);font-weight:600;font-size:14.5px}
  .miss .spk{margin-left:auto;flex:0 0 auto;border:0;background:rgba(139,107,255,.2);color:#b9a6ff;
    width:38px;height:38px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
  .miss .spk svg{width:18px;height:18px}
  .allgood{background:var(--good-bg);color:var(--good-ink);border-radius:14px;
    padding:16px;text-align:center;font-weight:800}

  .actions{display:grid;gap:10px;margin-top:22px}
  .btn{
    border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;
    cursor:pointer;font-family:inherit;transition:filter .12s ease,transform .08s ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{color:#fff}
  .btn-primary.s7{background:var(--s7)} .btn-primary.s8{background:var(--s8)} .btn-primary.s9{background:var(--s9)}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{background:var(--card-hover)}

  .foot{text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">

  <!-- HOME -->
  <section id="home">
    <div class="head">
      <h1>Engelse woordjes</h1>
      <p>RONDÉ &middot; groep 7 &middot; kies een song en daarna een level. Je hoeft niets te typen.</p>
    </div>
    <div class="songs" id="songList"></div>
    <p class="foot">Tip: zet je geluid aan, dan hoor je elk woord in het Engels.</p>
  </section>

  <!-- LEVELS -->
  <section id="levels" class="hidden">
    <div class="topbar">
      <button class="back" id="lvBack">&larr; Alle songs</button>
      <span class="pill" id="lvPill">Song</span>
    </div>
    <div class="levelhead"><h2>Kies een level</h2></div>
    <div class="songs" id="levelList"></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="topbar">
      <button class="back" id="quitBtn">&larr; Terug</button>
      <span class="pill" id="quizPill">Song</span>
      <span class="counter" id="counter">1 / 1</span>
    </div>
    <div class="bar" id="bar"><i></i></div>
    <div class="card">
      <div class="ask" id="askLabel">Wat betekent dit woord?</div>
      <div class="wordrow">
        <div class="word" id="word">word</div>
        <button class="speak" id="speakBtn" aria-label="Spreek het woord uit">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4a1 1 0 0 0 1.7-.7V5.7A1 1 0 0 0 11 5L7 9H4a1 1 0 0 0-1 1z"/><path d="M16 8.5a4 4 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18.5 6a7 7 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="options" id="options"></div>
      <button class="next" id="nextBtn" disabled>Volgende</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden">
    <div class="topbar">
      <button class="back" id="homeBtn2">&larr; Alle songs</button>
      <span class="pill" id="resPill">Song</span>
    </div>
    <div class="card">
      <div class="result-top">
        <div class="score-ring" id="ring"><div><div class="pct" id="pct">0%</div><div class="lbl" id="scoreLbl">0 / 0 goed</div></div></div>
        <h2 id="resTitle">Klaar!</h2>
        <p class="praise" id="praise"></p>
      </div>
      <div class="review" id="review"></div>
      <div class="actions" id="actions"></div>
    </div>
    <p class="foot">Gemaakt voor kenniskist.nl</p>
  </section>

</div>

<script>
/* ---------------- Woorden en zinnen (RONDÉ Song 7, 8, 9) ---------------- */
const SONGS = {
  7:{ key:7, color:"s7", title:"Song 7", sub:"Words and phrases",
    words:[
      {en:"phone",nl:"telefoon"},
      {en:"earrings",nl:"oorbellen"},
      {en:"wallet",nl:"portemonnee"},
      {en:"keys",nl:"sleutels"},
      {en:"laptop",nl:"laptop"},
      {en:"pocket",nl:"(broek)zak"},
      {en:"sports bag",nl:"sporttas"},
      {en:"table",nl:"tafel"},
      {en:"shed",nl:"schuur"},
      {en:"coatrack",nl:"kapstok"},
      {en:"kitchen",nl:"keuken"},
      {en:"hallway",nl:"gang, hal"},
      {en:"street",nl:"straat"},
      {en:"house",nl:"huis"},
      {en:"yesterday",nl:"gisteren"},
      {en:"in front of",nl:"voor"},
      {en:"next to",nl:"naast"},
      {en:"immediately",nl:"meteen"},
      {en:"first",nl:"als eerste"},
      {en:"then",nl:"toen"},
      {en:"after that",nl:"daarna"},
      {en:"finally",nl:"ten slotte"}
    ],
    phrases:[
      {en:"Someone stole my watch.",nl:"Iemand heeft mijn horloge gestolen."},
      {en:"Someone took my sunglasses.",nl:"Iemand heeft mijn zonnebril weggenomen."},
      {en:"I had parked my bike in front of our house.",nl:"Ik had mijn fiets voor ons huis gezet."},
      {en:"But when I came back, it had gone!",nl:"Maar toen ik terugkwam, was hij weg!"},
      {en:"I looked for it everywhere!",nl:"Ik heb overal naar hem gezocht!"},
      {en:"I looked for it at the sports club.",nl:"Ik heb gezocht bij de sportclub."},
      {en:"I asked people if they had seen my bike.",nl:"Ik vroeg mensen of ze mijn fiets gezien hadden."}
    ]},
  8:{ key:8, color:"s8", title:"Song 8", sub:"Lighter",
    words:[
      {en:"angry",nl:"boos"},
      {en:"bored",nl:"verveeld"},
      {en:"calm",nl:"kalm"},
      {en:"proud",nl:"trots"},
      {en:"excited",nl:"opgewonden"},
      {en:"tired",nl:"moe"},
      {en:"lonely",nl:"eenzaam"},
      {en:"scared",nl:"bang"},
      {en:"nervous",nl:"nerveus"},
      {en:"worried",nl:"bezorgd"},
      {en:"curious",nl:"nieuwsgierig"},
      {en:"delicious",nl:"heerlijk"},
      {en:"heavy",nl:"zwaar"},
      {en:"disgusting",nl:"afschuwelijk"},
      {en:"safe",nl:"veilig"},
      {en:"awake",nl:"wakker"},
      {en:"close",nl:"dichtbij"},
      {en:"ugly",nl:"lelijk"},
      {en:"twisted",nl:"verbogen"},
      {en:"empty",nl:"leeg"},
      {en:"crack",nl:"barst"},
      {en:"bright",nl:"kleurrijk, fel"},
      {en:"dirt",nl:"vuil"},
      {en:"final",nl:"laatste"}
    ],
    phrases:[
      {en:"It makes me feel happy when I'm close to you.",nl:"Het maakt me blij als ik dicht bij jou ben."},
      {en:"I'm a little tired because I had a scary dream.",nl:"Ik ben een beetje moe, omdat ik een enge droom had."},
      {en:"I get sad when I have to get up early.",nl:"Ik word verdrietig als ik vroeg moet opstaan."},
      {en:"Exercising makes me feel good.",nl:"Bewegen geeft me een goed gevoel."},
      {en:"I'm glad that it's sunny today.",nl:"Ik ben blij dat het vandaag zonnig is."}
    ]},
  9:{ key:9, color:"s9", title:"Song 9", sub:"Larger Than Life",
    words:[
      {en:"struggle",nl:"moeite hebben"},
      {en:"fail",nl:"mislukken, niet slagen"},
      {en:"defend",nl:"verdedigen"},
      {en:"goalie / goalkeeper",nl:"keeper, doelman/-vrouw",say:"goalkeeper"},
      {en:"pass",nl:"passen (van de bal)"},
      {en:"shoot",nl:"schieten"},
      {en:"head",nl:"koppen"},
      {en:"post",nl:"doelpaal"},
      {en:"cheer",nl:"juichen"},
      {en:"attack",nl:"aanvallen"},
      {en:"forward",nl:"aanvaller"},
      {en:"defender",nl:"verdediger"},
      {en:"boo",nl:"boe roepen"},
      {en:"score",nl:"scoren"},
      {en:"once",nl:"een keer"},
      {en:"safety",nl:"veiligheid"},
      {en:"whistle",nl:"fluitje"},
      {en:"captain",nl:"aanvoerder"},
      {en:"fair",nl:"eerlijk"},
      {en:"choice",nl:"keuze"}
    ],
    phrases:[
      {en:"Number 6 gets the ball and scores.",nl:"Nummer 6 krijgt de bal en scoort."},
      {en:"Jones passes the ball forward.",nl:"Jones passt de bal naar voren."},
      {en:"Veliz shoots, and yes the ball goes into the net.",nl:"Veliz schiet, en ja de bal gaat in het net."},
      {en:"What a great save by the goalkeeper.",nl:"Wat een geweldige redding van de keeper."},
      {en:"The attacker is very fast.",nl:"De aanvaller is heel snel."},
      {en:"She dribbles the ball past the defence with no trouble at all.",nl:"Ze dribbelt de bal zonder problemen langs de verdediging."},
      {en:"Veldhuizen takes the corner kick.",nl:"Veldhuizen neemt de corner."},
      {en:"The players are trying hard to score.",nl:"De spelers doen hun best om te scoren."},
      {en:"The fans cheer loudly.",nl:"De fans juichen luid."}
    ]}
};

const LEVELS = {
  1:{label:"Level 1", desc:"Engels → Nederlands (woorden)"},
  2:{label:"Level 2", desc:"Nederlands → Engels (woorden)"},
  3:{label:"Level 3", desc:"Woorden + zinnen (Engels → Nederlands)"}
};

/* Alle Nederlandse woorden en zinnen samen, voor genoeg afleiders */
const ALL_WORD_NL   = [...new Set(Object.values(SONGS).flatMap(s=>s.words.map(w=>w.nl)))];
const ALL_PHRASE_NL = [...new Set(Object.values(SONGS).flatMap(s=>s.phrases.map(p=>p.nl)))];

/* ---------------- Hulpfuncties ---------------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* Spraak (Engels) */
let voice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  voice = vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/en[-_]/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function say(text){
  if(!('speechSynthesis' in window)||!text)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=.9; if(voice)u.voice=voice;
  speechSynthesis.speak(u);
}

/* ---------------- State ---------------- */
let song=null, level=1, en2nl=true;
let wordAnswers=[], phraseAnswers=[];
let queue=[], idx=0, correctCount=0, missed=[], answered=false;

/* ---------------- Home ---------------- */
function renderHome(){
  const list=document.getElementById('songList');
  list.innerHTML='';
  Object.values(SONGS).forEach(s=>{
    const b=document.createElement('button');
    b.className='song '+s.color;
    b.innerHTML=`<span class="num">${s.key}</span>
      <span class="meta">
        <span class="title">${s.title}</span>
        <span class="sub">${s.sub}</span>
        <span class="count">${s.words.length} woorden &middot; ${s.phrases.length} zinnen</span>
      </span>
      <span class="go">&rarr;</span>`;
    b.onclick=()=>renderLevels(s.key);
    list.appendChild(b);
  });
}

/* ---------------- Levelkeuze ---------------- */
function renderLevels(key){
  song=SONGS[key];
  show('levels');
  const pill=document.getElementById('lvPill');
  pill.className='pill '+song.color;
  pill.textContent=song.title+' · '+song.sub;
  const list=document.getElementById('levelList');
  list.innerHTML='';
  Object.keys(LEVELS).forEach(n=>{
    const lv=LEVELS[n];
    const b=document.createElement('button');
    b.className='song '+song.color;
    b.innerHTML=`<span class="num">${n}</span>
      <span class="meta">
        <span class="title">${lv.label}</span>
        <span class="sub">${lv.desc}</span>
      </span>
      <span class="go">&rarr;</span>`;
    b.onclick=()=>startQuiz(key, parseInt(n));
    list.appendChild(b);
  });
}

/* ---------------- Items bouwen ---------------- */
function buildItems(s, lvl){
  const items=[];
  if(lvl===1){
    s.words.forEach(w=>items.push({prompt:w.en,answer:w.nl,speak:w.say||w.en,type:"word"}));
  } else if(lvl===2){
    s.words.forEach(w=>items.push({prompt:w.nl,answer:w.en,speak:w.say||w.en,type:"word"}));
  } else {
    s.words.forEach(w=>items.push({prompt:w.en,answer:w.nl,speak:w.say||w.en,type:"word"}));
    s.phrases.forEach(p=>items.push({prompt:p.en,answer:p.nl,speak:p.en,type:"phrase"}));
  }
  return items;
}

/* ---------------- Quiz ---------------- */
function startQuiz(key, lvl, customItems){
  song=SONGS[key]; level=lvl;
  en2nl = (lvl!==2);
  if(lvl===3){
    wordAnswers   = ALL_WORD_NL;
    phraseAnswers = ALL_PHRASE_NL;
  } else {
    wordAnswers   = en2nl ? song.words.map(w=>w.nl) : song.words.map(w=>w.en);
    phraseAnswers = song.phrases.map(p=>p.nl);
  }

  queue = shuffle(customItems && customItems.length ? customItems : buildItems(song, lvl));
  idx=0; correctCount=0; missed=[]; answered=false;

  show('quiz');
  const pill=document.getElementById('quizPill');
  pill.className='pill '+song.color;
  pill.textContent=`${song.title} · Level ${lvl}`;
  document.getElementById('bar').className='bar '+song.color;
  document.getElementById('speakBtn').className='speak '+song.color;
  document.getElementById('nextBtn').className='next '+song.color;
  renderQuestion();
}

function renderQuestion(){
  answered=false;
  const q=queue[idx];
  document.getElementById('counter').textContent=`${idx+1} / ${queue.length}`;
  document.getElementById('bar').querySelector('i').style.width=`${idx/queue.length*100}%`;

  // Vraagtekst
  const wordEl=document.getElementById('word');
  wordEl.textContent=q.prompt;
  wordEl.classList.toggle('long', q.prompt.length>16);

  // Label
  document.getElementById('askLabel').textContent =
    en2nl ? "Wat betekent dit?" : "Hoe zeg je dit in het Engels?";

  // Antwoordopties uit dezelfde groep (woord/zin) en richting
  const minOpts = level===3 ? 20 : 15;
  const pool = [...new Set(q.type==="phrase" ? phraseAnswers : wordAnswers)];
  const optCount = Math.min(minOpts, pool.length);
  const distractors = shuffle(pool.filter(a=>a!==q.answer)).slice(0, optCount-1);
  const opts = shuffle([q.answer, ...distractors]);

  const box=document.getElementById('options');
  box.innerHTML='';
  const longOpts = opts.some(o=>o.length>22) || q.type==="phrase";
  box.classList.toggle('single', longOpts);
  opts.forEach(o=>{
    const btn=document.createElement('button');
    btn.className='opt';
    btn.innerHTML=`<span>${o}</span><span class="tick"></span>`;
    btn.onclick=()=>choose(btn, o, q);
    box.appendChild(btn);
  });

  const next=document.getElementById('nextBtn');
  next.disabled=true;
  next.textContent = idx===queue.length-1 ? 'Bekijk resultaat' : 'Volgende';

  // Geluid: bij Engels → Nederlands hoor je het Engelse woord meteen.
  // Bij Nederlands → Engels niet (dat zou het antwoord verraden).
  const spk=document.getElementById('speakBtn');
  if(en2nl){ spk.disabled=false; setTimeout(()=>say(q.speak), 250); }
  else { spk.disabled=true; }
}

function choose(btn, chosen, q){
  if(answered)return;
  answered=true;
  const correct = chosen===q.answer;
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    const label=b.querySelector('span').textContent;
    if(label===q.answer){ b.classList.add('correct'); b.querySelector('.tick').textContent='✓'; }
    else b.classList.add('dim');
  });
  if(correct){ correctCount++; }
  else{
    btn.classList.remove('dim'); btn.classList.add('wrong');
    btn.querySelector('.tick').textContent='✗';
    missed.push(q);
  }
  // Na het antwoord altijd het Engelse woord/zin kunnen horen
  const spk=document.getElementById('speakBtn');
  spk.disabled=false;
  if(!en2nl) say(q.speak);
  document.getElementById('nextBtn').disabled=false;
}

function nextQuestion(){
  if(idx<queue.length-1){ idx++; renderQuestion(); }
  else showResults();
}

/* ---------------- Resultaat ---------------- */
function showResults(){
  show('results');
  const total=queue.length, pct=Math.round(correctCount/total*100);
  document.getElementById('ring').className='score-ring ring '+song.color;
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('scoreLbl').textContent=`${correctCount} / ${total} goed`;
  const resPill=document.getElementById('resPill');
  resPill.className='pill '+song.color;
  resPill.textContent=`${song.title} · Level ${level}`;

  let title, praise;
  if(pct===100){title='Alles goed!';praise='Top gedaan, je kent dit level helemaal.';}
  else if(pct>=80){title='Goed bezig!';praise='Bijna alles goed. Oefen de laatste nog even.';}
  else if(pct>=50){title='Lekker geoefend';praise='Je bent op de helft. Doe de moeilijke nog een rondje.';}
  else{title='Blijf oefenen';praise='Begin nog een keer, het went snel.';}
  document.getElementById('resTitle').textContent=title;
  document.getElementById('praise').textContent=praise;

  // Foute items tonen (Engels altijd links zodat je de uitspraak hoort)
  const review=document.getElementById('review');
  const uniqMissed=[...new Map(missed.map(m=>[m.speak+m.answer,m])).values()];
  if(uniqMissed.length){
    review.innerHTML=`<h3>Dit was lastig (${uniqMissed.length})</h3>`;
    uniqMissed.forEach(m=>{
      const enText = en2nl ? m.prompt : m.answer;   // Engelse kant
      const nlText = en2nl ? m.answer : m.prompt;   // Nederlandse kant
      const row=document.createElement('div');
      row.className='miss';
      row.innerHTML=`<span class="en">${enText}</span><span class="arrow">&rarr;</span><span class="nl">${nlText}</span>
        <button class="spk" aria-label="Spreek uit"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4a1 1 0 0 0 1.7-.7V5.7A1 1 0 0 0 11 5L7 9H4a1 1 0 0 0-1 1z"/><path d="M16 8.5a4 4 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>`;
      row.querySelector('.spk').onclick=()=>say(m.speak);
      review.appendChild(row);
    });
  } else {
    review.innerHTML=`<div class="allgood">Geen fouten. Petje af! 🎉</div>`;
  }

  // Knoppen
  const actions=document.getElementById('actions');
  actions.innerHTML='';
  if(uniqMissed.length){
    const a=document.createElement('button');
    a.className='btn btn-primary '+song.color;
    a.textContent=`Oefen alleen de ${uniqMissed.length} foute`;
    a.onclick=()=>startQuiz(song.key, level, uniqMissed);
    actions.appendChild(a);
  }
  const b=document.createElement('button');
  b.className='btn btn-ghost';
  b.textContent='Dit level opnieuw';
  b.onclick=()=>startQuiz(song.key, level);
  actions.appendChild(b);

  const c=document.createElement('button');
  c.className='btn btn-ghost';
  c.textContent='Ander level kiezen';
  c.onclick=()=>renderLevels(song.key);
  actions.appendChild(c);

  const d=document.createElement('button');
  d.className='btn btn-ghost';
  d.textContent='Terug naar alle songs';
  d.onclick=()=>show('home');
  actions.appendChild(d);
}

/* ---------------- Navigatie ---------------- */
function show(id){
  ['home','levels','quiz','results'].forEach(s=>document.getElementById(s).classList.toggle('hidden',s!==id));
  if('speechSynthesis' in window) speechSynthesis.cancel();
  window.scrollTo(0,0);
}

document.getElementById('speakBtn').onclick=()=>{ if(queue[idx]) say(queue[idx].speak); };
document.getElementById('nextBtn').onclick=nextQuestion;
document.getElementById('quitBtn').onclick=()=>renderLevels(song.key);
document.getElementById('lvBack').onclick=()=>show('home');
document.getElementById('homeBtn2').onclick=()=>show('home');

renderHome();
</script>
</body>
