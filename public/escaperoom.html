<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLITCH // Noodprotocol De Linde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14; --panel:#0f1620; --line:#1d2a38;
    --virus:#ff2e6e; --virus-soft:#ff6b9c; --safe:#27e0a0; --safe-soft:#7af3cd;
    --ink:#cfe3ef; --ink-dim:#6f8aa0; --amber:#ffd166; --blue:#7cc0ff;
    --mono:'Space Mono',ui-monospace,'Courier New',monospace;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:radial-gradient(1200px 700px at 50% -10%, #12202e 0%, var(--bg) 60%),var(--bg);
    color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 3px);
    mix-blend-mode:overlay;opacity:.5}
  .wrap{max-width:780px;margin:0 auto;padding:22px 18px 70px}

  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .brand{font-family:var(--mono);font-weight:700;letter-spacing:2px;font-size:15px;color:var(--virus)}
  .brand.safe{color:var(--safe)}
  .status{font-family:var(--mono);font-size:12px;color:var(--ink-dim);letter-spacing:1px}
  .spacer{flex:1}
  .timer{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--amber);
    border:1px solid var(--line);border-radius:8px;padding:4px 10px;letter-spacing:1px}
  .timer.low{color:var(--virus);border-color:var(--virus)}

  .meter{display:flex;gap:8px;margin:0 0 22px}
  .seg{flex:1;height:12px;border-radius:6px;border:1px solid var(--line);
    background:linear-gradient(90deg, rgba(255,46,110,.12), rgba(255,46,110,.04));position:relative;overflow:hidden}
  .seg.done{background:linear-gradient(90deg,var(--safe),var(--safe-soft));border-color:var(--safe);box-shadow:0 0 14px rgba(39,224,160,.45)}
  .seg .lab{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:9px;color:var(--ink-dim)}
  .seg.done .lab{color:#062018;font-weight:700}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  h1{font-family:var(--mono);font-weight:700;font-size:clamp(26px,6vw,40px);line-height:1.05;margin:0 0 6px;letter-spacing:1px}
  h1 .g{color:var(--virus);text-shadow:0 0 18px rgba(255,46,110,.5)}
  .lead{font-size:16px;line-height:1.6;color:var(--ink);margin:14px 0}
  .lead b{color:var(--safe-soft)}
  .meta{font-family:var(--mono);font-size:12px;color:var(--ink-dim);letter-spacing:1px;margin-bottom:4px}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--virus);text-transform:uppercase;margin-bottom:10px}
  .eyebrow.safe{color:var(--safe)}

  .mission{background:#0b121b;border:1px dashed var(--line);border-radius:12px;padding:16px 18px;margin:16px 0;line-height:1.55}
  .mission .tag{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--amber);display:block;margin-bottom:6px}

  .glitchmsg{background:rgba(255,46,110,.08);border:1px solid rgba(255,46,110,.45);border-radius:12px;
    padding:14px 16px;margin:14px 0 4px;line-height:1.5;color:var(--virus-soft)}
  .glitchmsg .gtag{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--virus);display:block;margin-bottom:6px;text-transform:uppercase}
  .glitchmsg .gwarn{display:block;margin-top:8px;font-size:12px;color:var(--ink-dim);font-style:italic}

  /* ---- ingebouwde opgaven ---- */
  .puzzle{margin:8px 0 4px}
  .p-instr{font-size:14.5px;color:var(--ink);line-height:1.55;margin:10px 0}
  .p-instr b{color:var(--safe-soft)}
  .ticons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
  .ticon{border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;background:#0c141e;color:#dCEBF4}
  .ticon svg{width:34px;height:34px;display:block;margin:0 auto}
  .ticon .l{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--safe-soft);margin-top:3px}
  .triddles{list-style:none;padding:0;margin:10px 0}
  .triddles li{background:#0b121b;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;display:flex;gap:10px;line-height:1.5}
  .triddles li .n{font-family:var(--mono);font-weight:700;color:var(--virus);flex:none}
  .tcontrols{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
  .tctrl{display:inline-flex;align-items:center;gap:8px;background:rgba(39,224,160,.08);border:1px solid var(--safe);
    border-radius:10px;padding:8px 14px;font-weight:700;color:var(--safe-soft)}
  .tctrl svg{width:24px;height:24px}
  .tword{display:flex;gap:18px;justify-content:center;background:#0b121b;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
  .tword svg{width:46px;height:46px;color:#fff}
  .tword .c{text-align:center}
  .tword .c .u{width:42px;border-bottom:2px solid var(--ink-dim);margin:8px auto 0;height:0}
  .tzoek{background:#f4f7f9;border-radius:12px;padding:6px;margin:10px 0;border:1px solid var(--line)}
  .tzoek .leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#15202b;padding:6px 8px 0}
  .tzoek .leg span{display:inline-flex;align-items:center;gap:5px}
  .tzoek .leg svg{width:20px;height:20px}
  .tquestions{list-style:none;padding:0;margin:10px 0}
  .tquestions li{background:#0b121b;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.5}
  .tquestions li .n{font-family:var(--mono);font-weight:700;color:var(--virus);margin-right:8px}
  .tvault{background:#0b121b;border:1px solid var(--line);border-radius:12px;padding:2px 14px;margin:10px 0}
  .tvault .row{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.5}
  .tvault .row:last-child{border-bottom:none}
  .tvault .b{font-family:var(--mono);font-weight:700;color:var(--virus);flex:none;min-width:62px}
  .tnote{background:rgba(39,224,160,.07);border:1px solid var(--safe);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13.5px;color:var(--safe-soft);line-height:1.5}
  .tsearch{background:rgba(124,192,255,.10);border:1px solid #3a7bd6;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13.5px;color:var(--blue);line-height:1.5}
  .tpw{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
  .tpw th,.tpw td{border:1px solid var(--line);padding:8px 10px;text-align:left}
  .tpw th{color:var(--ink-dim);font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase}
  .tpw .m{font-family:var(--mono);font-weight:700;color:var(--safe-soft);font-size:15px;letter-spacing:1px}

  /* ---- code-invoer ---- */
  .code-row{display:flex;gap:10px;justify-content:center;margin:20px 0 6px}
  .digit{width:64px;height:78px;border-radius:12px;border:2px solid var(--line);background:#070b11;color:var(--safe-soft);
    font-family:var(--mono);font-weight:700;font-size:36px;text-align:center;line-height:74px;transition:.15s}
  .digit.active{border-color:var(--safe);box-shadow:0 0 0 3px rgba(39,224,160,.18)}
  .feedback{text-align:center;min-height:24px;font-family:var(--mono);font-size:14px;letter-spacing:1px;margin:8px 0 2px}
  .feedback.bad{color:var(--virus)} .feedback.good{color:var(--safe)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:16px auto 4px}
  .key{padding:16px 0;border-radius:12px;border:1px solid var(--line);background:#0c141e;color:var(--ink);
    font-family:var(--mono);font-weight:700;font-size:22px;cursor:pointer;transition:.12s;user-select:none}
  .key:hover{border-color:var(--safe);color:var(--safe-soft)} .key:active{transform:translateY(1px)}
  .key.wide{font-size:14px;letter-spacing:1px} .key.del{color:var(--virus-soft)}

  .btn{display:inline-flex;align-items:center;gap:10px;cursor:pointer;border:none;font-family:var(--mono);font-weight:700;
    font-size:16px;letter-spacing:1px;padding:16px 26px;border-radius:12px;color:#04130d;
    background:linear-gradient(180deg,var(--safe),#19b683);box-shadow:0 10px 28px rgba(39,224,160,.3);transition:.15s}
  .btn:hover{transform:translateY(-2px)}
  .btn.block{display:flex;width:100%;justify-content:center;margin-top:18px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-dim);box-shadow:none;font-size:12px;padding:8px 14px}
  .hintbtn{display:block;margin:14px auto 0;background:none;border:none;color:var(--amber);font-family:var(--mono);font-size:12px;letter-spacing:1px;cursor:pointer;text-decoration:underline}
  .hintbox{display:none;margin:10px auto 0;max-width:520px;background:#1a1505;border:1px solid #463a12;color:var(--amber);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5}

  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
  .shake{animation:shake .5s}
  @keyframes glitchflash{0%,100%{filter:none}50%{filter:hue-rotate(80deg) saturate(2)}}
  .flash{animation:glitchflash .4s}

  .win h1{color:var(--safe)}
  .badge{font-family:var(--mono);font-size:64px;text-align:center;margin:10px 0;color:var(--safe);text-shadow:0 0 30px rgba(39,224,160,.6)}
  .codeword{font-family:var(--mono);font-weight:700;letter-spacing:6px;font-size:30px;text-align:center;color:var(--amber);margin:18px 0;border:1px dashed var(--line);border-radius:12px;padding:18px}

  .reset{position:fixed;right:12px;bottom:12px;z-index:60}
  @media (max-width:520px){.digit{width:52px;height:64px;font-size:28px;line-height:60px}.panel{padding:20px 16px}}
  @media (prefers-reduced-motion:reduce){.shake,.flash{animation:none}body::after{display:none}}
</style>
</head>

/* ====== firewalls met ingebouwde opgaven ====== */
const FIREWALLS=[
 { n:1, code:"3718", titel:"Iconen-firewall",
   tekst:"GLITCH heeft 16 pictogrammen door elkaar gegooid, met veel <b>look-alikes</b>. Los de vier raadsels op — de code = de iconnummers in volgorde.",
   nep:"😈 GLITCH zegt: \"Makkie! Lees de cijfers gewoon van groot naar klein. Vertrouw me...\"",
   hint:"Lees elk raadsel precíes — het zegt welk look-alike je NIET moet kiezen. Code = de nummers in volgorde van de raadsels.",
   puzzle:`<div class="puzzle">${ICONS16}
     <ul class="triddles">
       <li><span class="n">1</span>Druk op mij en je werk is veilig <b>bewaard</b> — maar ik ben géén map en géén wolk.</li>
       <li><span class="n">2</span>Ik vergroot het kleine om iets te <b>zoeken</b> — maar ik ben géén verrekijker en heb géén plusje.</li>
       <li><span class="n">3</span>Zonder draad verbind ik je met <b>internet</b> — maar ik ben géén losse signaalbalkjes.</li>
       <li><span class="n">4</span>Wat je <b>weggooit</b>, verdwijnt in mij — ik ben een bak, géén kruisje.</li>
     </ul>
     <div class="tnote">De code = de nummers van de juiste iconen, in volgorde van de raadsels (1→2→3→4).</div>
   </div>` },

 { n:2, code:"3582", titel:"Code-firewall",
   tekst:"De cijfersleutel ligt verstopt in het lokaal op kaarten die er <b>hetzelfde uitzien</b> — maar er klopt er maar één.",
   nep:"😈 GLITCH zegt: \"Hier is de sleutel: ● = 9. Echt waar hoor. Type maar 9...\"",
   hint:"De échte sleutel klopt met twee controles tegelijk: ■=2 én ★=5. Eentje die maar aan één klopt, is nep.",
   puzzle:`<div class="puzzle">
     <div class="tsearch">🔎 Zoek in het lokaal de <b>SLEUTEL-kaarten</b>. Ze zien er allemaal hetzelfde uit — maar er klopt er maar één.</div>
     <div class="p-instr">De échte sleutel klopt met <b>twee controles tegelijk</b>. Klopt een kaart maar met één? Dan is hij nep.</div>
     <div class="tcontrols">
       <div class="tctrl">${SQ} = 2</div>
       <div class="tctrl">${STAR} = 5</div>
     </div>
     <div class="p-instr">Vertaal het glitch-woord met de échte sleutel (links → rechts):</div>
     <div class="tword">
       <div class="c">${CIRC}<div class="u"></div></div>
       <div class="c">${STAR}<div class="u"></div></div>
       <div class="c">${BOLT}<div class="u"></div></div>
       <div class="c">${SQ}<div class="u"></div></div>
     </div>
   </div>` },

 { n:3, code:"4637", titel:"Zoekplaat-firewall",
   tekst:"Zoek mee op de plaat. Tel zorgvuldig — er zijn <b>look-alikes</b>, <b>twee klokken</b> en een <b>rekensom</b>.",
   nep:"😈 GLITCH zegt: \"Die spinnenwebben? Negeer ze, tel gewoon álle bugs!\"",
   hint:"Eén klok is beschadigd (een fout op de wijzerplaat). Bij de bugs: tel ze en trek de spinnenwebben eraf.",
   puzzle:`<div class="puzzle">${ZOEK}
     <ul class="tquestions">
       <li><span class="n">1</span>Hoeveel échte <b>computermuizen</b> liggen er? (een koptelefoon telt niet mee)</li>
       <li><span class="n">2</span>Hoeveel <b>USB-sticks</b>? (een geheugenkaartje telt niet mee)</li>
       <li><span class="n">3</span>Er hangen <b>twee klokken</b>. Eén is kapot (er staat een onmogelijk getal op). Lees de júiste klok: hoe laat (heel uur)?</li>
       <li><span class="n">4</span>Reken: aantal <b>bugs</b> − aantal <b>spinnenwebben</b>.</li>
     </ul>
     <div class="tnote">Code = antwoord 1 → 2 → 3 → 4.</div>
   </div>` },

 { n:4, code:"4692", titel:"Kluis-firewall",
   tekst:"Kraak de kluiscode. Reken cijfer 1–3 uit (meerdere stappen!). Voor cijfer 4 <b>zoek</b> je de juiste kaart in het lokaal.",
   nep:"😈 GLITCH zegt: \"De kluiscode is gewoon 0 0 0 0. Probeer maar!\"",
   hint:"Controle: de vier cijfers zijn samen 21. Reken cijfer 1–3 uit en kijk welke kaart-aanwijzing cijfer 4 kloppend maakt.",
   puzzle:`<div class="puzzle">
     <div class="tvault">
       <div class="row"><span class="b">cijfer 1</span><span>Het aantal poten van <b>3 katten</b> (elke kat 4 poten), gedeeld door het aantal benen van een mens, daarna <b>min 2</b>.</span></div>
       <div class="row"><span class="b">cijfer 2</span><span>Het aantal kanten (zijvlakken) van een gewone <b>dobbelsteen</b>.</span></div>
       <div class="row"><span class="b">cijfer 3</span><span>Hoeveel <b>levens</b> heeft een kat volgens het spreekwoord?</span></div>
       <div class="row"><span class="b">cijfer 4</span><span>🔎 Zoek de <b>KLUIS-kaarten</b> in het lokaal. Welke aanwijzing is de echte? Gebruik de controle hieronder.</span></div>
     </div>
     <div class="tnote">Controle: de vier cijfers samen zijn precies <b>21</b>. Tel cijfer 1+2+3 op en kijk welke kaart-aanwijzing cijfer 4 zó maakt dat het totaal 21 wordt.</div>
     <div class="p-instr" style="font-size:13px;color:var(--ink-dim)">Hulp: mens 2 benen, fiets 2 wielen, auto 4 wielen, spin 8 poten.</div>
   </div>` },

 { n:5, code:"4013", titel:"Wachtwoord-firewall",
   tekst:"Laatste firewall! GLITCH heeft <b>te korte nepwachtwoorden</b> tussen de echte gezet. Tel alleen de cijfers in de wachtwoorden die <b>lang genoeg</b> zijn.",
   nep:"😈 GLITCH zegt: \"Tel mijn korte wachtwoorden óók mee, dat hoort zo!\"",
   hint:"Een veilig wachtwoord is minstens 8 tekens. Tel éérst de lengte; alleen 8+ telt mee. Dan de cijfers, van boven naar beneden.",
   puzzle:`<div class="puzzle">
     <div class="p-instr"><b>Stap 1:</b> tel de lengte. <b>Stap 2:</b> alleen bij wachtwoorden van <b>8 tekens of meer</b> tel je het aantal cijfers (0–9). De korte sla je over.</div>
     <table class="tpw">
       <tr><th>Wachtwoord</th><th>8+ ?</th><th>Cijfers</th></tr>
       <tr><td class="m">Hond2024!</td><td>&nbsp;</td><td>&nbsp;</td></tr>
       <tr><td class="m">Mees4</td><td>&nbsp;</td><td>&nbsp;</td></tr>
       <tr><td class="m">appeltaart</td><td>&nbsp;</td><td>&nbsp;</td></tr>
       <tr><td class="m">Tijger7Blauw</td><td>&nbsp;</td><td>&nbsp;</td></tr>
       <tr><td class="m">zon!2</td><td>&nbsp;</td><td>&nbsp;</td></tr>
       <tr><td class="m">K9m!x3Pq8</td><td>&nbsp;</td><td>&nbsp;</td></tr>
     </table>
     <div class="tnote">Code = de cijferaantallen van de lange wachtwoorden, van boven naar beneden. Let op: de letter O lijkt op een 0, maar is geen cijfer!</div>
   </div>` }
];
const TOTAAL_SEC=30*60;
const KEY="glitch_de_linde_v2";

let state=load();
function load(){ try{const s=JSON.parse(localStorage.getItem(KEY)); if(s) return s;}catch(e){}
  return {stap:0,klaar:false,gestart:false,seconden:TOTAAL_SEC,pogingen:0}; }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} }

let timerInt=null;
function startTimer(){ if(timerInt) return;
  timerInt=setInterval(()=>{ if(state.klaar) return; if(state.seconden>0){state.seconden--;save();} renderTimer(); },1000); }
function renderTimer(){ const t=document.getElementById('timer'); const m=Math.floor(state.seconden/60),s=state.seconden%60;
  t.textContent=String(m).padStart(2,'0')+":"+String(s).padStart(2,'0'); t.classList.toggle('low',state.seconden<=120); }

function renderMeter(){ const m=document.getElementById('meter'); m.innerHTML="";
  for(let i=0;i<5;i++){ const d=document.createElement('div'); d.className="seg"+(i<state.stap?" done":"");
    d.innerHTML='<span class="lab">FW'+(i+1)+(i<state.stap?' ✓':'')+'</span>'; m.appendChild(d); } }
function renderHeader(){ const safe=state.klaar;
  document.getElementById('brand').textContent=safe?"SYSTEEM//VEILIG":"GLITCH//ACTIEF";
  document.getElementById('brand').className="brand"+(safe?" safe":"");
  document.getElementById('sysstatus').textContent=safe?"SYSTEEM: BEVEILIGD":"SYSTEEM: BESMET"; }

const app=document.getElementById('app');

function renderStart(){
  app.innerHTML=`<div class="panel">
    <div class="eyebrow">noodprotocol • kindcentrum de linde</div>
    <h1>Het virus <span class="g">GLITCH</span> heeft de computer overgenomen</h1>
    <p class="lead">Het hele systeem is besmet. De vijf <b>firewalls</b> die de school beschermen liggen plat.
    Jullie zijn het <b>IT-noodteam</b>. Herstel alle vijf voordat de tijd om is en verjaag GLITCH!</p>
    <div class="mission"><span class="tag">// hoe werkt het</span>
      Elke firewall heeft een <b>opgave op dit scherm</b>. Los hem op en vul de <b>4-cijferige code</b> in.
      Pas als de code klopt, opent de <b>volgende</b> firewall. Soms moet je iets <b>zoeken in het lokaal</b>.</div>
    <div class="glitchmsg"><span class="gtag">⚠ waarschuwing</span>
      GLITCH vecht terug! Hij stuurt <b>nepberichten</b> met foute codes en heeft kaarten in het lokaal verstopt —
      sommige echt, sommige namaak. <b>Vertrouw alleen wat je zelf controleert.</b></div>
    <button class="btn block" id="startBtn">▶ START NOODPROTOCOL</button>
  </div>`;
  document.getElementById('startBtn').onclick=()=>{ state.gestart=true; save(); startTimer(); renderStap(); };
}

let buffer="";
function renderStap(){
  renderHeader(); renderMeter(); startTimer();
  if(state.stap>=5) return renderWin();
  const fw=FIREWALLS[state.stap]; buffer="";
  app.innerHTML=`<div class="panel" id="card">
    <div class="eyebrow">firewall ${fw.n} van 5 • ${fw.titel}</div>
    <h1 style="font-size:clamp(22px,5vw,32px)">Herstel firewall <span class="g">${fw.n}</span></h1>
    <div class="mission"><span class="tag">// missie</span> ${fw.tekst}</div>
    ${fw.puzzle}
    <div class="glitchmsg"><span class="gtag">⚠ onderschept bericht — bron: GLITCH</span>${fw.nep}
      <span class="gwarn">GLITCH liegt om je te misleiden. Vertrouw alleen je eigen werk en de échte kaarten.</span></div>
    <div class="meta center" style="text-align:center;margin-top:6px">VOER DE 4-CIJFERIGE CODE IN</div>
    <div class="code-row" id="digits"></div>
    <div class="feedback" id="fb"></div>
    <div class="keypad" id="keypad"></div>
    <button class="hintbtn" id="hintBtn">hulp nodig? (alleen als je vastzit)</button>
    <div class="hintbox" id="hintBox">💡 ${fw.hint}</div>
  </div>`;
  buildKeypad(); renderDigits();
  document.getElementById('hintBtn').onclick=()=>{ const b=document.getElementById('hintBox');
    b.style.display=b.style.display==='block'?'none':'block'; };
}

function buildKeypad(){ const kp=document.getElementById('keypad');
  const keys=['1','2','3','4','5','6','7','8','9','wis','0','ok']; kp.innerHTML="";
  keys.forEach(k=>{ const b=document.createElement('button');
    b.className="key"+(k==='wis'?' del wide':'')+(k==='ok'?' wide':'');
    b.textContent=k==='wis'?'← wis':(k==='ok'?'check ✓':k); b.onclick=()=>press(k); kp.appendChild(b); }); }
function renderDigits(){ const d=document.getElementById('digits'); d.innerHTML="";
  for(let i=0;i<4;i++){ const box=document.createElement('div'); box.className="digit"+(i===buffer.length?" active":"");
    box.textContent=buffer[i]||""; d.appendChild(box); } }
function press(k){ const fb=document.getElementById('fb');
  if(k==='wis'){ buffer=buffer.slice(0,-1); fb.textContent=""; fb.className="feedback"; renderDigits(); return; }
  if(k==='ok') return check();
  if(buffer.length<4){ buffer+=k; renderDigits(); } }
function check(){ const fb=document.getElementById('fb'); const card=document.getElementById('card'); const fw=FIREWALLS[state.stap];
  if(buffer.length<4){ fb.textContent="Vul eerst 4 cijfers in."; fb.className="feedback bad"; return; }
  if(buffer===fw.code){
    fb.textContent="✓ TOEGANG VERLEEND — firewall hersteld!"; fb.className="feedback good"; card.classList.add('flash');
    state.stap++; state.pogingen=0; save(); renderMeter();
    setTimeout(()=>{ window.scrollTo({top:0,behavior:'smooth'}); renderStap(); }, 900);
  }else{
    state.pogingen++; save();
    const taunts=["✗ TOEGANG GEWEIGERD — GLITCH: \"Haha, mis!\"","✗ FOUT — GLITCH: \"Trapte je in mijn leugen?\"",
      "✗ GEWEIGERD — GLITCH: \"Kijk nog eens goed...\"","✗ FOUT — GLITCH: \"Probeer het maar opnieuw, mensje.\""];
    fb.textContent=taunts[Math.min(state.pogingen-1,taunts.length-1)]; fb.className="feedback bad";
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); buffer=""; renderDigits();
  } }

function renderWin(){ state.klaar=true; save(); renderHeader(); renderMeter();
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  const m=Math.floor(state.seconden/60),s=state.seconden%60;
  app.innerHTML=`<div class="panel win">
    <div class="eyebrow safe">missie geslaagd</div><div class="badge">✓</div>
    <h1 class="center" style="text-align:center">GLITCH is <span style="color:var(--safe)">verwijderd</span>!</h1>
    <p class="lead center" style="text-align:center">Alle vijf de firewalls staan weer online. Het systeem van De Linde is veilig. Top gewerkt, IT-team! 🛡️</p>
    <div class="codeword">SYSTEEM&nbsp;BEVEILIGD</div>
    <p class="center meta" style="text-align:center">Tijd over: ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</p>
  </div>`; }

document.addEventListener('keydown',(e)=>{ if(!state.gestart||state.klaar||state.stap>=5) return;
  if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==='Backspace') press('wis'); else if(e.key==='Enter') press('ok'); });

document.getElementById('resetBtn').onclick=()=>{
  if(confirm("Escaperoom opnieuw beginnen? Alle voortgang op dit apparaat wordt gewist.")){
    localStorage.removeItem(KEY); state=load(); if(timerInt){clearInterval(timerInt);timerInt=null;}
    renderHeader(); renderMeter(); renderTimer(); renderStart(); } };

renderHeader(); renderMeter(); renderTimer();
if(state.klaar) renderWin(); else if(state.gestart){ startTimer(); renderStap(); } else renderStart();
</script>
