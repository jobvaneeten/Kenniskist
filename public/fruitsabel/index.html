<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fruitsabel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#fff4e6; --dim:#b9a48f; --lime:#8ee06a; --goud:#ffb020; --rood:#ff6b6b;
    --disp:'Russo One',system-ui,sans-serif; --body:'Outfit','Nunito',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#140d1c;}
  body{font-family:var(--body);color:var(--ink);user-select:none;touch-action:none;cursor:crosshair;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}

  #hud{position:fixed;top:0;left:0;right:0;padding:10px 12px;display:flex;gap:10px;
       align-items:center;justify-content:center;pointer-events:none;z-index:5;}
  .vak{background:rgba(24,14,32,0.66);border:1px solid rgba(255,255,255,0.14);
       border-radius:12px;padding:6px 12px;backdrop-filter:blur(8px);text-align:center;min-width:80px;}
  .vak b{display:block;font-family:var(--disp);font-size:18px;font-variant-numeric:tabular-nums;}
  .vak span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
  #klokvak b{color:var(--lime);} #klokvak.krap b{color:var(--rood);}
  #scorevak b{color:var(--goud);}

  .scherm{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;
          justify-content:center;gap:14px;padding:20px;overflow-y:auto;
          background:radial-gradient(ellipse 70% 55% at 50% 28%,rgba(255,176,32,.2),transparent 70%),
                     radial-gradient(ellipse 60% 50% at 50% 100%,rgba(142,224,106,.16),transparent 70%),
                     rgba(20,13,28,.92);}
  .scherm.aan{display:flex;}
  h1{font-family:var(--disp);font-size:clamp(30px,9vw,52px);margin:0;letter-spacing:.02em;
     background:linear-gradient(100deg,#ffd166,#fff 45%,#8ee06a);-webkit-background-clip:text;
     background-clip:text;-webkit-text-fill-color:transparent;text-align:center;}
  .onder{color:var(--dim);margin:0;font-size:15px;text-align:center;max-width:33ch;line-height:1.5;}
  .groot{font-family:var(--disp);font-size:40px;color:var(--goud);margin:0;}
  .rij{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  button{font-family:var(--body);font-weight:800;cursor:pointer;border-radius:999px;border:0;}
  .knop{padding:14px 30px;font-size:17px;color:#20140a;
        background:linear-gradient(135deg,var(--goud),#ffd166);
        box-shadow:0 10px 26px rgba(255,176,32,.3);transition:transform .12s;}
  .knop:hover{transform:translateY(-2px);}
  .knop2{padding:12px 24px;font-size:15px;color:var(--ink);background:rgba(255,255,255,.09);
         border:1px solid rgba(255,255,255,.2);}
  .knop2:hover{background:rgba(255,255,255,.17);}

  #terug{position:fixed;top:10px;left:10px;z-index:20;padding:8px 16px;font-size:14px;
         color:var(--ink);background:rgba(24,14,32,.75);border:1px solid rgba(255,255,255,.2);
         border-radius:999px;display:none;}
  #terug.aan{display:block;}

  .beurs{font-family:var(--disp);font-size:20px;color:var(--goud);}
  .lijst{display:flex;flex-direction:column;gap:9px;width:100%;max-width:440px;}
  .kaart{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:14px;
         background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);}
  .kaart .ico{font-size:24px;width:34px;text-align:center;}
  .kaart .tekst{flex:1;min-width:0;}
  .kaart .naam{font-weight:800;font-size:15px;}
  .kaart .uitleg{font-size:12px;color:var(--dim);line-height:1.35;}
  .balk{display:flex;gap:3px;margin-top:5px;}
  .bol{width:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.16);}
  .bol.vol{background:linear-gradient(90deg,var(--goud),var(--lime));}
  .koop{padding:9px 14px;font-size:13px;color:#20140a;background:linear-gradient(135deg,var(--goud),#ffd166);
        min-width:74px;box-shadow:0 6px 16px rgba(255,176,32,.25);}
  .koop:disabled{background:rgba(255,255,255,.09);color:#8d7c6c;box-shadow:none;cursor:default;}
  .koop.max{background:rgba(142,224,106,.2);color:var(--lime);}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .tab{padding:9px 18px;font-size:14px;border-radius:999px;color:var(--dim);
       background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);}
  .tab.aan{color:#20140a;background:linear-gradient(135deg,var(--goud),#ffd166);border-color:transparent;}
  .staal{width:38px;height:38px;border-radius:11px;flex-shrink:0;border:2px solid rgba(255,255,255,.25);}
  .kies{padding:9px 14px;font-size:13px;min-width:74px;color:var(--ink);
        background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);}
  .kies.aan{color:#20140a;background:linear-gradient(135deg,var(--lime),#bdf58e);border-color:transparent;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="vak" id="klokvak"><b id="klok">60</b><span>tijd</span></div>
  <div class="vak" id="scorevak"><b id="score">0</b><span>punten</span></div>
  <div class="vak"><b id="schild">—</b><span>schild</span></div>
</div>

<button id="terug">← Menu</button>

<div class="scherm aan" id="menu">
  <h1>Fruitsabel</h1>
  <p class="onder">Snijd in 60 seconden zo veel mogelijk fruit doormidden. Raak je een bom, dan kost dat tijd!</p>
  <p class="onder" id="record"></p>
  <div class="rij">
    <button class="knop" id="speel">Spelen ▶</button>
    <button class="knop2" id="naarwinkel">🛒 Winkel</button>
  </div>
  <p class="onder" style="font-size:13px">Veeg met je muis of vinger dwars door het fruit.</p>
</div>

<div class="scherm" id="winkel">
  <h1 style="font-size:clamp(24px,7vw,38px)">Winkel</h1>
  <p class="beurs">🪙 <span id="beurs">0</span></p>
  <div class="tabs">
    <button class="tab aan" data-tab="upgrades">Upgrades</button>
    <button class="tab" data-tab="omgeving">Omgeving</button>
    <button class="tab" data-tab="sabel">Sabels</button>
  </div>
  <div class="lijst" id="lijst"></div>
  <button class="knop" id="uitwinkel">Terug</button>
</div>

<div class="scherm" id="einde">
  <h1 style="font-size:clamp(24px,7vw,38px)" id="eindetitel">Tijd om!</h1>
  <p class="groot"><span id="eindscore">0</span> punten</p>
  <p class="onder"><span id="eindfruit">0</span> stuks fruit · beste combo <span id="eindcombo">0</span></p>
  <p class="onder">Je verdiende <b style="color:var(--goud)">🪙 <span id="eindmunt">0</span></b> voor de winkel.</p>
  <p class="onder" id="eindrecord"></p>
  <div class="rij">
    <button class="knop" id="nogeens">Nog een keer ▶</button>
    <button class="knop2" id="naarwinkel2">🛒 Winkel</button>
  </div>
  <button class="knop2" id="klaar" style="display:none">Verder →</button>
</div>

<script>
(function(){
'use strict';

// ── Eigen muntenpotje: wat je hier verdient geef je ook hier uit ────────────
var SLEUTEL = 'kk_fruitsabel';
function laad(){
  try {
    var s = JSON.parse(localStorage.getItem(SLEUTEL) || '{}');
    return { munten: s.munten|0, record: s.record|0, lv: s.lv || {}, bezit: s.bezit, keuze: s.keuze };
  } catch(e){ return { munten:0, record:0, lv:{} }; }
}
function bewaar(){ try { localStorage.setItem(SLEUTEL, JSON.stringify(D)); } catch(e){} }
var D = laad();

// Prijzen lopen hard op: elk volgend niveau kost drie keer zoveel. Alles
// kopen kost daardoor tientallen uren spelen — de laatste niveaus zijn echt
// iets om naartoe te sparen.
function prijsReeks(basis){ return function(n){ return Math.round(basis * Math.pow(3, n)); }; }
var getal = function(n){ return n.toLocaleString('nl-NL'); };

var UPGRADES = [
  { key:'sabel',  ico:'🗡️', naam:'Scherpe sabel', uitleg:'Elk stuk fruit is meer punten waard.',            max:5, prijs:prijsReeks(140) },
  { key:'schild', ico:'🛡️', naam:'Bommenschild', uitleg:'Vangt per potje één bom voor je op.',              max:3, prijs:prijsReeks(200) },
  { key:'banaan', ico:'🍌', naam:'IJsbanaan',     uitleg:'Vaker een banaan die alles even vertraagt.',       max:3, prijs:prijsReeks(180) },
  { key:'bonus',  ico:'🪙', naam:'Muntbonus',     uitleg:'+5% munten aan het eind van elk potje.',           max:5, prijs:prijsReeks(150) },
  { key:'meer',   ico:'🧺', naam:'Volle mand',    uitleg:'Er wordt meer fruit tegelijk omhoog gegooid.',      max:5, prijs:prijsReeks(170) },
  { key:'goud',   ico:'✨', naam:'Goudfruit',     uitleg:'Soms een gouden vrucht: die is vijf keer zoveel waard.', max:3, prijs:prijsReeks(220) },
  { key:'blad',   ico:'🔪', naam:'Breed lemmet',  uitleg:'Je veeg pakt fruit dat er net naast zit ook mee.',  max:3, prijs:prijsReeks(150) },
  { key:'demper', ico:'🧯', naam:'Bomdemper',     uitleg:'Een bom kost minder tijd.',                          max:3, prijs:prijsReeks(190) },
  { key:'combo',  ico:'🔥', naam:'Combomeester',  uitleg:'Meerdere stuks in één veeg leveren meer op.',       max:3, prijs:prijsReeks(160) },
];

// ── Dingen om je spel mee op te maken ──────────────────────────────────────
// Omgevingen en sabels koop je één keer en kies je daarna vrij. Ze doen niets
// voor je punten, maar ze zijn wel het duurste in de winkel.
var OMGEVINGEN = [
  { id:'nacht',   naam:'Nachtpaars',    prijs:0,     kleuren:['#2a1a33','#1a1024','#100a17'], deeltje:null },
  { id:'zonson',  naam:'Zonsondergang', prijs:900,   kleuren:['#ff9a5b','#6e3760','#241028'], deeltje:'stof' },
  { id:'dojo',    naam:'Bamboedojo',    prijs:2500,  kleuren:['#2b4a32','#16281a','#0b160d'], deeltje:'blad' },
  { id:'ruimte',  naam:'Ruimte',        prijs:6000,  kleuren:['#1b2352','#0b0f2a','#05060f'], deeltje:'ster' },
  { id:'water',   naam:'Onder water',   prijs:12000, kleuren:['#12607e','#0a3550','#04202f'], deeltje:'bubbel' },
  { id:'vulkaan', naam:'Vulkaan',       prijs:22000, kleuren:['#6b2114','#33100c','#180706'], deeltje:'vonk' },
  { id:'winter',  naam:'Winter',        prijs:35000, kleuren:['#31577d','#16283f','#0b1523'], deeltje:'sneeuw' },
  { id:'disco',   naam:'Discovloer',    prijs:60000, kleuren:['#4a1466','#1d0b2c','#0e0518'], deeltje:'confetti' },
];
var SABELS = [
  { id:'wit',    naam:'Witte sabel', prijs:0,     kleur:'#ffffff', gloed:'#9fe8ff' },
  { id:'neon',   naam:'Neonblauw',   prijs:700,   kleur:'#8ceaff', gloed:'#4FC3F7' },
  { id:'goud',   naam:'Goud',        prijs:2200,  kleur:'#ffd166', gloed:'#ffb020' },
  { id:'vuur',   naam:'Vuur',        prijs:5500,  kleur:'#ffb066', gloed:'#ff5c2a' },
  { id:'gif',    naam:'Gifgroen',    prijs:11000, kleur:'#c2ff8a', gloed:'#5ad84a' },
  { id:'plasma', naam:'Plasma',      prijs:20000, kleur:'#eaa6ff', gloed:'#a855f7' },
  { id:'regen',  naam:'Regenboog',   prijs:45000, kleur:'regen',   gloed:'regen' },
];
if (!D.bezit) D.bezit = ['nacht','wit'];
if (!D.keuze) D.keuze = { omgeving:'nacht', sabel:'wit' };
function heeft(id){ return D.bezit.indexOf(id) >= 0; }
function omgeving(){ return OMGEVINGEN.filter(function(o){ return o.id === D.keuze.omgeving; })[0] || OMGEVINGEN[0]; }
function sabel(){ return SABELS.filter(function(o){ return o.id === D.keuze.sabel; })[0] || SABELS[0]; }
function regenKleur(t){ return 'hsl(' + Math.round((t/12) % 360) + ',100%,70%)'; }
function lv(k){ return D.lv[k] | 0; }
function puntPer(){ return 2 + lv('sabel'); }
function schilden(){ return lv('schild'); }
function banaanKans(){ return lv('banaan') * 0.05; }
function speeltijd(){ return 60; }
function muntF(){ return 1 + lv('bonus') * 0.05; }
function extraFruit(){ return lv('meer'); }
function goudKans(){ return lv('goud') * 0.05; }
function lemmet(){ return lv('blad') * 9; }
function bomKosten(){ return 8 - lv('demper') * 2; }
function comboWaarde(){ return 2 + lv('combo') * 2; }

// ── Canvas ──────────────────────────────────────────────────────────────────
var cv = document.getElementById('c'), ctx = cv.getContext('2d');
var W=0, H=0, DPR=1;
function meet(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', meet);

// ── Fruit ───────────────────────────────────────────────────────────────────
var SOORTEN = [
  { naam:'appel',       buiten:'#ff5c7a', binnen:'#ffdfe6', r:34, blad:true },
  { naam:'meloen',      buiten:'#6bd08a', binnen:'#e6ffe9', r:40, blad:false },
  { naam:'sinaasappel', buiten:'#ffa33f', binnen:'#ffe4bd', r:33, blad:false },
  { naam:'pruim',       buiten:'#a06bff', binnen:'#e7dcff', r:29, blad:true },
  { naam:'citroen',     buiten:'#ffd93d', binnen:'#fff6cc', r:31, blad:false },
  { naam:'watermeloen', buiten:'#3fbf6f', binnen:'#ff8095', r:44, blad:false },
];

// Elke omgeving heeft zijn eigen sfeerdeeltjes: sneeuw dwarrelt naar beneden,
// bubbels stijgen op, vonken vliegen omhoog, sterren twinkelen.
var deeltjes = [];
function maakDeeltjes(){
  deeltjes = [];
  var soort = omgeving().deeltje;
  if (!soort) return;
  var n = soort === 'ster' ? 70 : soort === 'sneeuw' ? 90 : 46;
  for (var i=0;i<n;i++) deeltjes.push(nieuwDeeltje(soort, true));
}
function nieuwDeeltje(soort, overal){
  var d = { soort:soort, x: Math.random()*W, y: overal ? Math.random()*H : -20,
            r: 2 + Math.random()*3, a: 0.3 + Math.random()*0.6, hoek: Math.random()*6.28,
            vx: 0, vy: 0, kleur:'#fff' };
  if (soort === 'sneeuw'){ d.vy = 26 + Math.random()*40; d.vx = (Math.random()-0.5)*22; d.kleur = '#eaf4ff'; }
  if (soort === 'blad'){ d.vy = 22 + Math.random()*30; d.vx = (Math.random()-0.5)*30; d.kleur = Math.random()<0.5 ? '#8fd47a' : '#d6b25a'; d.r = 3+Math.random()*4; }
  if (soort === 'confetti'){ d.vy = 40 + Math.random()*60; d.vx = (Math.random()-0.5)*50; d.kleur = ['#ff6b6b','#ffd166','#8ee06a','#4FC3F7','#a855f7'][Math.floor(Math.random()*5)]; }
  if (soort === 'bubbel'){ d.vy = -(20 + Math.random()*45); d.vx = (Math.random()-0.5)*14; d.kleur = '#bfeaff'; d.y = overal ? Math.random()*H : H+20; }
  if (soort === 'vonk'){ d.vy = -(40 + Math.random()*80); d.vx = (Math.random()-0.5)*26; d.kleur = Math.random()<0.6 ? '#ffb020' : '#ff6b3d'; d.r = 1.5+Math.random()*2.5; d.y = overal ? Math.random()*H : H+20; }
  if (soort === 'stof'){ d.vy = -(6 + Math.random()*14); d.vx = (Math.random()-0.5)*10; d.kleur = '#ffd9a8'; d.r = 1.5+Math.random()*2; }
  if (soort === 'ster'){ d.vy = 0; d.vx = 0; d.kleur = '#dbe9ff'; d.r = 0.8+Math.random()*1.6; }
  return d;
}
function stapDeeltjes(dt, t){
  for (var i=0;i<deeltjes.length;i++){
    var d = deeltjes[i];
    if (d.soort === 'ster'){ d.a = 0.35 + 0.4*Math.abs(Math.sin(t/700 + d.hoek)); continue; }
    d.x += (d.vx + (d.soort==='sneeuw'||d.soort==='blad' ? Math.sin(t/900 + d.hoek)*16 : 0)) * dt;
    d.y += d.vy * dt;
    d.hoek += dt * (d.soort === 'confetti' ? 4 : 1);
    if (d.y > H + 30 || d.y < -30 || d.x < -30 || d.x > W + 30) deeltjes[i] = nieuwDeeltje(d.soort, false);
  }
}
function tekenDeeltjes(){
  for (var i=0;i<deeltjes.length;i++){
    var d = deeltjes[i];
    ctx.globalAlpha = d.a; ctx.fillStyle = d.kleur;
    if (d.soort === 'confetti'){
      ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.hoek);
      ctx.fillRect(-d.r, -d.r*0.5, d.r*2, d.r);
      ctx.restore();
    } else if (d.soort === 'bubbel'){
      ctx.strokeStyle = d.kleur; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r*1.6,0,6.2832); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,6.2832); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

var G = 1150;                 // zwaartekracht
var dingen, spetters, halven, tijd, score, aantalFruit, combo, besteCombo,
    schild, traag, bezig=false, laatste=0, volgende=0, flits=0;
var spoor = [];

function werp(){
  // Een worp: soms één stuk, soms een handvol tegelijk.
  var r = Math.random();
  var n = (r < 0.3 ? 3 : r < 0.75 ? 2 : 1) + (Math.random() < extraFruit()*0.16 ? 1 : 0);
  for (var i=0;i<n;i++) dingen.push(maakDing());
  volgende = (0.42 + Math.random()*0.42) * (1 - extraFruit()*0.05);
}

function maakDing(){
  var x = W*0.15 + Math.random()*W*0.7;
  var naarMidden = (W/2 - x) / (W/2);
  var soortIsBom = Math.random() < 0.13;
  var isBanaan = !soortIsBom && Math.random() < banaanKans();
  var s = SOORTEN[Math.floor(Math.random()*SOORTEN.length)];
  return {
    x:x, y:H + 60,
    vx: naarMidden*120 + (Math.random()-0.5)*180,
    vy: -(Math.sqrt(2*G*(H*0.62 + Math.random()*H*0.22))),
    hoek: Math.random()*6.28, draai: (Math.random()-0.5)*3.4,
    r: soortIsBom ? 30 : isBanaan ? 30 : s.r,
    soort: s, bom: soortIsBom, banaan: isBanaan,
    goud: !soortIsBom && !isBanaan && Math.random() < goudKans(),
  };
}

function startSpel(){
  dingen = []; spetters = []; halven = []; spoor = [];
  tijd = speeltijd(); score = 0; aantalFruit = 0; combo = 0; besteCombo = 0;
  schild = schilden(); traag = 0; volgende = 0.4; flits = 0;
  toonScherm(null); bezig = true; laatste = performance.now();
  toonHud();
  requestAnimationFrame(stap);
}

function eindeSpel(){
  bezig = false;
  var munten = Math.round(score/2.5 * muntF());
  D.munten += munten;
  var record = score > D.record;
  if (record) D.record = score;
  bewaar();
  document.getElementById('eindscore').textContent = score;
  document.getElementById('eindfruit').textContent = aantalFruit;
  document.getElementById('eindcombo').textContent = besteCombo;
  document.getElementById('eindmunt').textContent = munten;
  document.getElementById('eindetitel').textContent = record ? 'Nieuw record!' : 'Tijd om!';
  document.getElementById('eindrecord').textContent = record ? '🏆 Beter dan ooit' : 'Jouw record: ' + D.record;
  toonScherm('einde');
  if (BELONING){
    document.getElementById('klaar').style.display = 'block';
    document.getElementById('nogeens').style.display = 'none';
  }
}

function toonHud(){
  document.getElementById('klok').textContent = Math.ceil(tijd);
  document.getElementById('klokvak').classList.toggle('krap', tijd <= 10);
  document.getElementById('score').textContent = score;
  var s = ''; for (var i=0;i<schild;i++) s += '🛡️';
  document.getElementById('schild').textContent = s || '—';
}

// ── Snijden ─────────────────────────────────────────────────────────────────
function afstandPuntLijn(px,py,x1,y1,x2,y2){
  var dx = x2-x1, dy = y2-y1, len2 = dx*dx+dy*dy;
  var t = len2 ? ((px-x1)*dx + (py-y1)*dy)/len2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}

function snij(x1,y1,x2,y2){
  if (!bezig) return;
  var geraakt = 0;
  for (var i=dingen.length-1;i>=0;i--){
    var d = dingen[i];
    if (afstandPuntLijn(d.x,d.y,x1,y1,x2,y2) > d.r + lemmet()) continue;
    dingen.splice(i,1);
    if (d.bom){
      if (schild > 0){ schild--; spat(d.x,d.y,'#8ee06a',26); }
      else { tijd = Math.max(0, tijd - bomKosten()); flits = 1; spat(d.x,d.y,'#ff6b6b',34); }
      combo = 0;
      continue;
    }
    if (d.banaan){ traag = 4; spat(d.x,d.y,'#9fe8ff',30); continue; }
    geraakt++;
    aantalFruit++;
    score += puntPer() * (d.goud ? 5 : 1);
    spat(d.x, d.y, d.goud ? '#ffd166' : d.soort.buiten, d.goud ? 30 : 16);
    var hoek = Math.atan2(y2-y1, x2-x1);
    for (var k=0;k<2;k++){
      halven.push({
        x:d.x, y:d.y, r:d.r, soort:d.soort, kant:k, snij:hoek,
        vx:d.vx + Math.cos(hoek + (k?1.57:-1.57))*190,
        vy:d.vy*0.5 + Math.sin(hoek + (k?1.57:-1.57))*190 - 60,
        hoek:d.hoek, draai:(k?1:-1)*2.4, leven:1,
      });
    }
  }
  if (geraakt > 0){
    combo += geraakt;
    if (combo > besteCombo) besteCombo = combo;
    if (geraakt >= 3){ score += geraakt * comboWaarde(); }   // meerdere in één veeg = bonus
    toonHud();
  }
}

function spat(x,y,kleur,n){
  for (var i=0;i<n;i++){
    var a = Math.random()*6.2832, v = 60 + Math.random()*260;
    spetters.push({ x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 60,
                    r:2 + Math.random()*4, kleur:kleur, leven:1 });
  }
}

// ── Loop ────────────────────────────────────────────────────────────────────
function stap(nu){
  if (!bezig) return;
  var dt = Math.min((nu - laatste)/1000, 0.05); laatste = nu;
  var sdt = dt * (traag > 0 ? 0.42 : 1);
  if (traag > 0) traag = Math.max(0, traag - dt);
  if (flits > 0) flits = Math.max(0, flits - dt*2);

  tijd -= dt;
  if (tijd <= 0){ tijd = 0; toonHud(); teken(); eindeSpel(); return; }

  volgende -= sdt;
  if (volgende <= 0) werp();

  var levend = false;
  for (var i=dingen.length-1;i>=0;i--){
    var d = dingen[i];
    d.vy += G*sdt; d.x += d.vx*sdt; d.y += d.vy*sdt; d.hoek += d.draai*sdt;
    if (d.y > H + 120){ dingen.splice(i,1); combo = 0; }
    else levend = true;
  }
  if (!levend && combo) combo = 0;

  for (var j=halven.length-1;j>=0;j--){
    var h = halven[j];
    h.vy += G*sdt; h.x += h.vx*sdt; h.y += h.vy*sdt; h.hoek += h.draai*sdt;
    if (h.y > H + 140) halven.splice(j,1);
  }
  for (var k=spetters.length-1;k>=0;k--){
    var s = spetters[k];
    s.vy += G*0.55*sdt; s.x += s.vx*sdt; s.y += s.vy*sdt; s.leven -= sdt*0.9;
    if (s.leven <= 0 || s.y > H+40) spetters.splice(k,1);
  }
  stapDeeltjes(dt, nu);

  // Het sabelspoor vervaagt
  for (var t=spoor.length-1;t>=0;t--){
    spoor[t].leven -= dt*3.4;
    if (spoor[t].leven <= 0) spoor.splice(t,1);
  }

  toonHud();
  teken();
  requestAnimationFrame(stap);
}

function tekenFruit(d){
  ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.hoek);
  if (d.bom){
    ctx.fillStyle = '#1b1b26'; ctx.shadowColor = '#ff6b6b'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(0,0,d.r,0,6.2832); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#3a3a4d'; ctx.beginPath(); ctx.arc(-d.r*0.3,-d.r*0.3,d.r*0.3,0,6.2832); ctx.fill();
    ctx.strokeStyle = '#c9c9d6'; ctx.lineWidth = 4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,-d.r); ctx.quadraticCurveTo(d.r*0.5,-d.r*1.5,d.r*0.15,-d.r*1.8); ctx.stroke();
    ctx.fillStyle = '#ffd166'; ctx.shadowColor='#ffb020'; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.arc(d.r*0.15,-d.r*1.85,4.5,0,6.2832); ctx.fill();
  } else if (d.banaan){
    ctx.fillStyle = '#9fe8ff'; ctx.shadowColor='#9fe8ff'; ctx.shadowBlur=22;
    ctx.beginPath(); ctx.ellipse(0,0,d.r*0.95,d.r*0.55,0.5,0,6.2832); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle='#e8fbff';
    ctx.beginPath(); ctx.ellipse(-4,-5,d.r*0.5,d.r*0.24,0.5,0,6.2832); ctx.fill();
  } else {
    ctx.fillStyle = d.goud ? '#ffd166' : d.soort.buiten;
    ctx.shadowColor = d.goud ? '#ffb020' : d.soort.buiten; ctx.shadowBlur = d.goud ? 26 : 16;
    ctx.beginPath(); ctx.arc(0,0,d.r,0,6.2832); ctx.fill(); ctx.shadowBlur = 0;
    if (d.goud){
      ctx.strokeStyle = '#fff3c4'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0,0,d.r*0.72,0,6.2832); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(-d.r*0.32,-d.r*0.34,d.r*0.3,d.r*0.2,-0.6,0,6.2832); ctx.fill();
    if (d.soort.blad){
      ctx.fillStyle = '#6bd08a';
      ctx.beginPath(); ctx.ellipse(d.r*0.4,-d.r*0.9,d.r*0.34,d.r*0.15,-0.5,0,6.2832); ctx.fill();
      ctx.fillStyle = '#8b5a3c'; ctx.fillRect(-2,-d.r-8,4,10);
    }
  }
  ctx.restore();
}

function tekenHelft(h){
  ctx.save(); ctx.translate(h.x,h.y); ctx.rotate(h.hoek);
  var a0 = h.snij + (h.kant ? 0 : Math.PI);
  ctx.fillStyle = h.soort.buiten;
  ctx.beginPath(); ctx.arc(0,0,h.r,a0,a0+Math.PI); ctx.closePath(); ctx.fill();
  ctx.fillStyle = h.soort.binnen;
  ctx.beginPath(); ctx.ellipse(0,0,h.r*0.94,h.r*0.3,a0+Math.PI/2,0,6.2832); ctx.fill();
  ctx.restore();
}

function teken(){
  ctx.clearRect(0,0,W,H);
  var kl = omgeving().kleuren;
  var g = ctx.createRadialGradient(W*0.5,H*0.3,0,W*0.5,H*0.3,Math.max(W,H)*0.8);
  g.addColorStop(0,kl[0]); g.addColorStop(0.55,kl[1]); g.addColorStop(1,kl[2]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  tekenDeeltjes();
  if (traag > 0){ ctx.fillStyle = 'rgba(120,200,255,0.10)'; ctx.fillRect(0,0,W,H); }
  if (flits > 0){ ctx.fillStyle = 'rgba(255,80,80,' + (flits*0.35) + ')'; ctx.fillRect(0,0,W,H); }

  for (var j=0;j<halven.length;j++) tekenHelft(halven[j]);
  for (var i=0;i<dingen.length;i++) tekenFruit(dingen[i]);

  for (var k=0;k<spetters.length;k++){
    var s = spetters[k];
    ctx.globalAlpha = Math.max(0, s.leven); ctx.fillStyle = s.kleur;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // sabelspoor
  if (spoor.length > 1){
    var sb = sabel(), tijdNu = performance.now();
    for (var t=1;t<spoor.length;t++){
      var a = spoor[t-1], b = spoor[t];
      var kleurSabel = sb.kleur === 'regen' ? regenKleur(tijdNu + t*90) : sb.kleur;
      ctx.globalAlpha = 0.35 + 0.65*b.leven;
      ctx.strokeStyle = kleurSabel;
      ctx.lineWidth = 2 + (9 + lemmet()*0.6)*b.leven; ctx.lineCap = 'round';
      ctx.shadowColor = sb.gloed === 'regen' ? kleurSabel : sb.gloed; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  if (combo >= 3 && bezig){
    ctx.font = '800 22px Outfit, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd166'; ctx.fillText('combo ' + combo + '!', W/2, 92);
  }
}

// ── Bediening: vegen ────────────────────────────────────────────────────────
var vorige = null;
function veeg(e){
  var r = cv.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  if (vorige) {
    spoor.push({ x:x, y:y, leven:1 });
    if (spoor.length > 14) spoor.shift();
    snij(vorige.x, vorige.y, x, y);
  } else spoor.push({ x:x, y:y, leven:1 });
  vorige = { x:x, y:y };
}
cv.addEventListener('pointermove', veeg);
cv.addEventListener('pointerdown', function(e){ vorige = null; veeg(e); });
cv.addEventListener('pointerleave', function(){ vorige = null; });

// ── Schermen en winkel ──────────────────────────────────────────────────────
function toonScherm(naam){
  ['menu','winkel','einde'].forEach(function(id){
    document.getElementById(id).classList.toggle('aan', id === naam);
  });
  document.getElementById('hud').style.display = naam ? 'none' : 'flex';
}

var tabblad = 'upgrades';
function tekenWinkel(){
  document.getElementById('beurs').textContent = getal(D.munten);
  var lijst = document.getElementById('lijst'); lijst.innerHTML = '';
  [].forEach.call(document.querySelectorAll('.tab'), function(t){
    t.classList.toggle('aan', t.dataset.tab === tabblad);
  });
  if (tabblad === 'upgrades') return upgradeLijst(lijst);
  spulLijst(lijst, tabblad === 'omgeving' ? OMGEVINGEN : SABELS, tabblad);
}

function upgradeLijst(lijst){
  UPGRADES.forEach(function(u){
    var n = lv(u.key), vol = n >= u.max, prijs = u.prijs(n);
    var kaart = document.createElement('div'); kaart.className = 'kaart';
    var bollen = ''; for (var i=0;i<u.max;i++) bollen += '<span class="bol' + (i<n?' vol':'') + '"></span>';
    kaart.innerHTML = '<span class="ico">' + u.ico + '</span>' +
      '<span class="tekst"><span class="naam">' + u.naam + '</span>' +
      '<div class="uitleg">' + u.uitleg + '</div><div class="balk">' + bollen + '</div></span>';
    var knop = document.createElement('button');
    knop.className = 'koop' + (vol ? ' max' : '');
    knop.textContent = vol ? 'max' : '🪙 ' + getal(prijs);
    knop.disabled = vol || D.munten < prijs;
    knop.onclick = function(){ if (D.munten < prijs) return; D.munten -= prijs; D.lv[u.key] = n+1; bewaar(); tekenWinkel(); };
    kaart.appendChild(knop); lijst.appendChild(kaart);
  });
}

// Omgevingen en sabels: eerst kopen, daarna kiezen.
function spulLijst(lijst, spullen, soort){
  spullen.forEach(function(sp){
    var mijn = heeft(sp.id), gekozen = D.keuze[soort] === sp.id;
    var kaart = document.createElement('div'); kaart.className = 'kaart';
    var staal = document.createElement('span'); staal.className = 'staal';
    staal.style.background = soort === 'omgeving'
      ? 'linear-gradient(160deg,' + sp.kleuren[0] + ',' + sp.kleuren[1] + ' 55%,' + sp.kleuren[2] + ')'
      : (sp.kleur === 'regen'
          ? 'linear-gradient(135deg,#ff6b6b,#ffd166,#8ee06a,#4FC3F7,#a855f7)'
          : 'linear-gradient(135deg,' + sp.kleur + ',' + sp.gloed + ')');
    var tekst = document.createElement('span'); tekst.className = 'tekst';
    tekst.innerHTML = '<span class="naam">' + sp.naam + '</span>' +
      '<div class="uitleg">' + (mijn ? (gekozen ? 'Nu in gebruik' : 'Van jou — klik om te kiezen')
                                     : 'Nog niet van jou') + '</div>';
    var knop = document.createElement('button');
    if (mijn){
      knop.className = 'kies' + (gekozen ? ' aan' : '');
      knop.textContent = gekozen ? '✓ gekozen' : 'Kies';
      knop.disabled = gekozen;
      knop.onclick = function(){ D.keuze[soort] = sp.id; bewaar(); maakDeeltjes(); tekenWinkel(); };
    } else {
      knop.className = 'koop';
      knop.textContent = '🪙 ' + getal(sp.prijs);
      knop.disabled = D.munten < sp.prijs;
      knop.onclick = function(){
        if (D.munten < sp.prijs) return;
        D.munten -= sp.prijs; D.bezit.push(sp.id); D.keuze[soort] = sp.id;
        bewaar(); maakDeeltjes(); tekenWinkel();
      };
    }
    kaart.appendChild(staal); kaart.appendChild(tekst); kaart.appendChild(knop);
    lijst.appendChild(kaart);
  });
}

[].forEach.call(document.querySelectorAll('.tab'), function(t){
  t.onclick = function(){ tabblad = t.dataset.tab; tekenWinkel(); };
});

function toonMenu(){
  document.getElementById('record').textContent = D.record ? 'Jouw record: ' + D.record + ' punten' : '';
  toonScherm('menu');
}

var vorigScherm = 'menu';
function naarWinkel(van){ vorigScherm = van; tekenWinkel(); toonScherm('winkel'); }
document.getElementById('speel').onclick = startSpel;
document.getElementById('nogeens').onclick = startSpel;
document.getElementById('naarwinkel').onclick = function(){ naarWinkel('menu'); };
document.getElementById('naarwinkel2').onclick = function(){ naarWinkel('einde'); };
document.getElementById('uitwinkel').onclick = function(){ if (vorigScherm === 'einde') toonScherm('einde'); else toonMenu(); };

// ── Inbedding ───────────────────────────────────────────────────────────────
var params = new URLSearchParams(location.search);
var BELONING = !params.has('terug');
if (!BELONING){
  var t = document.getElementById('terug');
  t.classList.add('aan');
  t.onclick = function(){ parent.postMessage({ type:'fruitsabel-terug' }, '*'); };
}
document.getElementById('klaar').onclick = function(){ parent.postMessage({ type:'fruitsabel-gameover' }, '*'); };

meet();
maakDeeltjes();
toonMenu();
})();
