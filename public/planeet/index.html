<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Planetenbouwer</title>
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --ink:#eef3ff; --dim:#8f9bc4; --cyaan:#3ef0ff; --magenta:#ff4fd8; --goud:#ffc83d; --violet:#9b6bff; --groen:#4dffa0;
    --glas:rgba(14,14,36,.78); --lijn:rgba(255,255,255,.13);
    --disp:'Russo One',system-ui,sans-serif; --body:'Outfit','Nunito',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#05051a;}
  body{font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;}
  button{font-family:var(--body);font-weight:800;cursor:pointer;border:0;}
  .verborgen{display:none !important;}

  /* bovenbalk */
  #hud{position:fixed;top:10px;left:0;z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;}
  #stof{font-family:var(--disp);font-size:clamp(30px,7vw,48px);line-height:1;display:flex;align-items:center;gap:10px;
        text-shadow:0 0 22px rgba(62,240,255,.5);font-variant-numeric:tabular-nums;}
  #stof i,.ster{display:inline-block;width:.62em;height:.62em;background:var(--cyaan);
        clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 6px var(--cyaan));}
  .ster{width:11px;height:11px;margin-left:3px;vertical-align:-1px;}
  #perSec{font-size:13px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums;}
  #tijdperk{margin-top:4px;padding:4px 12px;border-radius:999px;background:var(--glas);border:1px solid var(--lijn);
            font-family:var(--disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyaan);}

  .rondknop{position:fixed;z-index:20;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
            color:var(--ink);background:var(--glas);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);padding:0;}
  .rondknop svg{width:20px;height:20px;}
  #geluid{top:10px;}
  #terug{position:fixed;top:10px;left:10px;z-index:20;padding:9px 16px;font-size:14px;color:var(--ink);
         background:var(--glas);border:1px solid rgba(255,255,255,.2);border-radius:999px;display:none;}
  #terug.aan{display:block;}

  /* winkel: rechts op een breed scherm, onderin op een smal scherm */
  #winkel{position:fixed;z-index:6;display:flex;flex-direction:column;background:var(--glas);backdrop-filter:blur(10px);
          border:1px solid var(--lijn);overflow:hidden;}
  #winkel{left:0;right:0;bottom:0;height:min(44vh,420px);border-radius:22px 22px 0 0;border-bottom:0;}
  #geluid{right:10px;}
  @media (min-aspect-ratio:1/1) and (min-width:760px){
    #winkel{left:auto;top:10px;right:10px;bottom:10px;height:auto;width:min(360px,36vw);border-radius:22px;border-bottom:1px solid var(--lijn);}
    #geluid{right:calc(min(360px,36vw) + 22px);}
  }
  #winkelkop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 8px;}
  #winkelkop h2{margin:0;font-family:var(--disp);font-size:15px;letter-spacing:.12em;text-transform:uppercase;}
  #modus{display:flex;border-radius:999px;background:rgba(255,255,255,.07);padding:3px;}
  #modus button{padding:5px 12px;border-radius:999px;font-size:12px;color:var(--dim);background:transparent;}
  #modus button.aan{color:#071018;background:linear-gradient(135deg,var(--cyaan),#7dfff0);}
  #lijst{flex:1;overflow-y:auto;padding:0 10px 12px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;}
  #lijst::-webkit-scrollbar{width:6px;} #lijst::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:6px;}

  .groepkop{margin:8px 4px 0;font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);}
  .ding{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;
        background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);}
  .ding canvas{width:46px;height:46px;border-radius:12px;background:radial-gradient(circle at 50% 40%,rgba(155,107,255,.25),rgba(255,255,255,.03));}
  .ding .tekst{min-width:0;display:flex;flex-direction:column;gap:1px;}
  .ding .naam{font-family:var(--disp);font-size:13px;letter-spacing:.04em;display:flex;gap:6px;align-items:baseline;}
  .ding .naam small{font-family:var(--body);font-weight:800;font-size:11px;color:var(--cyaan);}
  .ding .zin{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ding .opbrengst{font-size:11px;color:var(--groen);font-weight:700;}
  .koop{min-width:84px;padding:9px 10px;border-radius:12px;font-size:13px;color:#20140a;
        background:linear-gradient(135deg,var(--goud),#ffe08a);box-shadow:0 4px 14px rgba(255,200,61,.25);white-space:nowrap;}
  .koop:disabled{background:rgba(255,255,255,.07);color:#6f7899;box-shadow:none;cursor:default;}
  .koop:not(:disabled):active{transform:scale(.96);}

  #sprong{margin:2px 0 4px;padding:12px;border-radius:16px;border:1.5px solid rgba(62,240,255,.35);
          background:linear-gradient(135deg,rgba(62,240,255,.12),rgba(255,79,216,.1));display:flex;flex-direction:column;gap:8px;}
  #sprong .kop{font-family:var(--disp);font-size:13px;letter-spacing:.06em;}
  #sprong .kop span{color:var(--cyaan);}
  #sprong .eis{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim);}
  #sprong .balk{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;}
  #sprong .balk i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyaan),var(--magenta));}
  #sprongknop{padding:10px;border-radius:12px;font-size:14px;color:#071018;background:linear-gradient(135deg,var(--cyaan),#7dfff0);
              box-shadow:0 6px 20px rgba(62,240,255,.3);}
  #sprongknop:disabled{background:rgba(255,255,255,.07);color:#6f7899;box-shadow:none;cursor:default;}
  #sprongknop.klaar{animation:puls .8s ease-in-out infinite alternate;}
  .eind{font-size:12px;color:var(--dim);text-align:center;padding:8px;}

  /* meldingen en schermen */
  #melding{position:fixed;left:50%;top:110px;transform:translateX(-50%);z-index:15;max-width:min(420px,90vw);padding:10px 16px;border-radius:14px;
           background:var(--glas);border:1px solid var(--lijn);backdrop-filter:blur(8px);font-size:14px;text-align:center;line-height:1.4;
           opacity:0;transition:opacity .3s;pointer-events:none;}
  #melding.aan{opacity:1;}
  #melding b{color:var(--cyaan);}
  .scherm{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;
          background:radial-gradient(ellipse 70% 50% at 50% 40%,rgba(62,240,255,.18),transparent 70%),rgba(5,5,26,.82);backdrop-filter:blur(6px);text-align:center;}
  .scherm.aan{display:flex;animation:in .35s ease-out;}
  .scherm .klein{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);}
  .scherm h1{margin:0;font-family:var(--disp);font-size:clamp(34px,9vw,58px);letter-spacing:.04em;text-transform:uppercase;
             background:linear-gradient(100deg,var(--cyaan),#fff 45%,var(--magenta));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
             filter:drop-shadow(0 0 22px rgba(62,240,255,.35));}
  .scherm p{margin:0;color:var(--dim);max-width:34ch;line-height:1.5;}
  .knop{padding:13px 30px;border-radius:999px;font-size:16px;color:#071018;background:linear-gradient(135deg,var(--cyaan),#7dfff0);box-shadow:0 10px 28px rgba(62,240,255,.3);}
  @keyframes puls{from{transform:scale(1)}to{transform:scale(1.03)}}
  @keyframes in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="terug">‹ Menu</button>
<button class="rondknop" id="geluid" aria-label="Geluid aan of uit">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="golfje" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
</button>

<div id="hud">
  <div id="stof"><i></i><span id="stofgetal">0</span></div>
  <div id="perSec">0 per seconde</div>
  <div id="tijdperk">Tijdperk 1 · Jonge planeet</div>
</div>

<div id="winkel">
  <div id="winkelkop">
    <h2>Bouwen</h2>
    <div id="modus" role="group" aria-label="Hoeveel tegelijk kopen">
      <button data-n="1" class="aan">1×</button><button data-n="10">10×</button><button data-n="max">Max</button>
    </div>
  </div>
  <div id="lijst"></div>
</div>

<div id="melding"></div>

<div class="scherm" id="sprongscherm">
  <div class="klein">Nieuw tijdperk</div>
  <h1 id="sprongtitel">Oceanen</h1>
  <p id="sprongtekst"></p>
  <button class="knop" id="sprongverder">Verder bouwen</button>
</div>

<script src="kern.js"></script>
<script src="spel.js"></script>
</body>
</html>
