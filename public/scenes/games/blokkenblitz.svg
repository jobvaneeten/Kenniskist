<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Blokkenblitz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0a24"/><stop offset="100%" stop-color="#05050f"/>
    </linearGradient>
    <radialGradient id="blob1" cx="20%" cy="20%" r="60%"><stop offset="0%" stop-color="#9b6bff" stop-opacity=".35"/><stop offset="100%" stop-color="#9b6bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob2" cx="85%" cy="85%" r="60%"><stop offset="0%" stop-color="#3ef0ff" stop-opacity=".25"/><stop offset="100%" stop-color="#3ef0ff" stop-opacity="0"/></radialGradient>
    <filter id="gloed" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glans" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".45"/><stop offset="45%" stop-color="#fff" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".3"/>
    </linearGradient>
    <symbol id="c" viewBox="0 0 20 20"><rect x="1" y="1" width="18" height="18" rx="3.5" fill="currentColor"/><rect x="1" y="1" width="18" height="18" rx="3.5" fill="url(#glans)"/></symbol>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <rect width="320" height="200" fill="url(#blob1)"/><rect width="320" height="200" fill="url(#blob2)"/>
  <!-- bord -->
  <rect x="24" y="16" width="168" height="168" rx="12" fill="#0e102a" stroke="#8296ff" stroke-opacity=".3" stroke-width="1.5"/>
  <g fill="#fff" fill-opacity=".045">
    <rect x="30" y="22" width="156" height="156" rx="4"/>
  </g>
  <g stroke="#fff" stroke-opacity=".05">
    <path d="M49.5 22v156M69 22v156M88.5 22v156M108 22v156M127.5 22v156M147 22v156M166.5 22v156M30 41.5h156M30 61h156M30 80.5h156M30 100h156M30 119.5h156M30 139h156M30 158.5h156"/>
  </g>
  <!-- liggende blokken -->
  <g filter="url(#gloed)">
    <use href="#c" x="30" y="158.5" width="19.5" height="19.5" color="#3ef0ff"/>
    <use href="#c" x="49.5" y="158.5" width="19.5" height="19.5" color="#3ef0ff"/>
    <use href="#c" x="69" y="158.5" width="19.5" height="19.5" color="#ff4fd8"/>
    <use href="#c" x="88.5" y="158.5" width="19.5" height="19.5" color="#ff4fd8"/>
    <use href="#c" x="108" y="158.5" width="19.5" height="19.5" color="#ffc83d"/>
    <use href="#c" x="127.5" y="158.5" width="19.5" height="19.5" color="#9b6bff"/>
    <use href="#c" x="166.5" y="158.5" width="19.5" height="19.5" color="#8cff5a"/>
    <use href="#c" x="30" y="139" width="19.5" height="19.5" color="#4f8cff"/>
    <use href="#c" x="49.5" y="139" width="19.5" height="19.5" color="#ff8a3d"/>
    <use href="#c" x="88.5" y="139" width="19.5" height="19.5" color="#ff4f6a"/>
    <use href="#c" x="166.5" y="139" width="19.5" height="19.5" color="#8cff5a"/>
    <use href="#c" x="166.5" y="119.5" width="19.5" height="19.5" color="#8cff5a"/>
    <use href="#c" x="30" y="119.5" width="19.5" height="19.5" color="#4f8cff"/>
  </g>
  <!-- de rij die bijna vol is licht op -->
  <rect x="146" y="158" width="20.5" height="20" rx="4" fill="#9b6bff" fill-opacity=".35" stroke="#9b6bff" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="26" y="156" width="164" height="24" rx="6" fill="#9b6bff" fill-opacity=".12"/>
  <!-- blok dat erin geschoven wordt -->
  <g filter="url(#gloed)" transform="translate(150 118) rotate(-8)">
    <use href="#c" x="0" y="0" width="19.5" height="19.5" color="#9b6bff"/>
    <use href="#c" x="0" y="19.5" width="19.5" height="19.5" color="#9b6bff"/>
    <use href="#c" x="19.5" y="19.5" width="19.5" height="19.5" color="#9b6bff"/>
  </g>
  <!-- tray -->
  <g filter="url(#gloed)">
    <use href="#c" x="222" y="40" width="16" height="16" color="#ffc83d"/><use href="#c" x="238" y="40" width="16" height="16" color="#ffc83d"/><use href="#c" x="254" y="40" width="16" height="16" color="#ffc83d"/>
    <use href="#c" x="232" y="92" width="16" height="16" color="#3ef0ff"/><use href="#c" x="248" y="92" width="16" height="16" color="#3ef0ff"/><use href="#c" x="232" y="108" width="16" height="16" color="#3ef0ff"/><use href="#c" x="248" y="108" width="16" height="16" color="#3ef0ff"/>
  </g>
  <!-- combo -->
  <text x="256" y="166" text-anchor="middle" font-family="Russo One, Arial Black, sans-serif" font-size="17" fill="#fff" stroke="#ff4fd8" stroke-width=".8" filter="url(#gloed)">COMBO ×3</text>
</svg>
