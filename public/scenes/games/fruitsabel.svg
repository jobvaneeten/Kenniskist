<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576">
  <defs>
    <radialGradient id="fs-lucht" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#3a2140"/>
      <stop offset="55%" stop-color="#1e1229"/>
      <stop offset="100%" stop-color="#120b19"/>
    </radialGradient>
    <linearGradient id="fs-veeg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#9fe8ff" stop-opacity=".15"/>
    </linearGradient>
    <filter id="fs-gloed" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1024" height="576" fill="url(#fs-lucht)"/>

  <!-- doorgesneden watermeloen links -->
  <g transform="translate(210 300)">
    <g transform="rotate(-24)">
      <path d="M-96 -14 A96 96 0 0 0 96 -14 Z" fill="#3fbf6f" transform="translate(0 -26)"/>
      <path d="M-84 -14 A84 84 0 0 0 84 -14 Z" fill="#ff8095" transform="translate(0 -26)"/>
      <g fill="#3a1720" transform="translate(0 -26)">
        <ellipse cx="-40" cy="-30" rx="5" ry="8"/><ellipse cx="0" cy="-44" rx="5" ry="8"/>
        <ellipse cx="40" cy="-30" rx="5" ry="8"/><ellipse cx="-20" cy="-56" rx="5" ry="8"/>
        <ellipse cx="22" cy="-56" rx="5" ry="8"/>
      </g>
    </g>
    <g transform="rotate(16) translate(30 60)">
      <path d="M-96 14 A96 96 0 0 1 96 14 Z" fill="#3fbf6f"/>
      <path d="M-84 14 A84 84 0 0 1 84 14 Z" fill="#ff8095"/>
      <g fill="#3a1720">
        <ellipse cx="-36" cy="-22" rx="5" ry="8"/><ellipse cx="4" cy="-36" rx="5" ry="8"/>
        <ellipse cx="44" cy="-20" rx="5" ry="8"/>
      </g>
    </g>
  </g>

  <!-- heel fruit rechts -->
  <g>
    <circle cx="770" cy="180" r="56" fill="#ffa33f" filter="url(#fs-gloed)" opacity=".7"/>
    <circle cx="770" cy="180" r="56" fill="#ffa33f"/>
    <ellipse cx="752" cy="160" rx="17" ry="11" fill="#ffffff" opacity=".35" transform="rotate(-35 752 160)"/>

    <circle cx="880" cy="360" r="44" fill="#ff5c7a" filter="url(#fs-gloed)" opacity=".7"/>
    <circle cx="880" cy="360" r="44" fill="#ff5c7a"/>
    <rect x="877" y="308" width="6" height="16" fill="#8b5a3c"/>
    <ellipse cx="898" cy="312" rx="19" ry="9" fill="#6bd08a" transform="rotate(-24 898 312)"/>
    <ellipse cx="866" cy="343" rx="14" ry="9" fill="#ffffff" opacity=".33" transform="rotate(-35 866 343)"/>

    <circle cx="640" cy="430" r="38" fill="#a06bff" filter="url(#fs-gloed)" opacity=".7"/>
    <circle cx="640" cy="430" r="38" fill="#a06bff"/>
    <ellipse cx="628" cy="416" rx="12" ry="8" fill="#ffffff" opacity=".33" transform="rotate(-35 628 416)"/>
  </g>

  <!-- bom -->
  <g transform="translate(430 470)">
    <circle r="40" fill="#1b1b26"/>
    <circle cx="-13" cy="-13" r="12" fill="#3a3a4d"/>
    <path d="M0 -40 Q22 -62 8 -76" stroke="#c9c9d6" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="8" cy="-78" r="7" fill="#ffd166" filter="url(#fs-gloed)"/>
    <circle cx="8" cy="-78" r="5" fill="#fff3c4"/>
  </g>

  <!-- sabelveeg -->
  <path d="M60 470 C 300 380, 560 300, 980 96" stroke="url(#fs-veeg)" stroke-width="14" fill="none" stroke-linecap="round" opacity=".95"/>
  <path d="M60 470 C 300 380, 560 300, 980 96" stroke="#9fe8ff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".5" filter="url(#fs-gloed)"/>

  <!-- sapspetters -->
  <g fill="#ff8095" opacity=".85">
    <circle cx="330" cy="250" r="7"/><circle cx="368" cy="222" r="5"/><circle cx="300" cy="286" r="4"/>
  </g>
  <g fill="#ffa33f" opacity=".85">
    <circle cx="700" cy="230" r="6"/><circle cx="726" cy="262" r="4"/>
  </g>
</svg>
