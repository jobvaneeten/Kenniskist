<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Diepgravers">
  <defs>
    <linearGradient id="lucht" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a1c"/><stop offset="100%" stop-color="#16203f"/>
    </linearGradient>
    <linearGradient id="aarde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4f2a"/>
      <stop offset="40%" stop-color="#3b2f5e"/>
      <stop offset="100%" stop-color="#4a1f1f"/>
    </linearGradient>
    <radialGradient id="lamp">
      <stop offset="0%" stop-color="#ffe9b0" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ertsgloed">
      <stop offset="0%" stop-color="#ffc23c" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffc23c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="paarsgloed">
      <stop offset="0%" stop-color="#c06bff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#c06bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="52" fill="url(#lucht)"/>
  <circle cx="34" cy="18" r="1.4" fill="#fff" opacity=".8"/>
  <circle cx="96" cy="30" r="1.1" fill="#fff" opacity=".5"/>
  <circle cx="188" cy="14" r="1.5" fill="#fff" opacity=".7"/>
  <circle cx="268" cy="28" r="1.2" fill="#fff" opacity=".6"/>

  <rect y="52" width="320" height="148" fill="url(#aarde)"/>

  <!-- de schacht -->
  <path d="M136 52 h48 v58 q0 14 -14 14 h-20 q-14 0 -14 -14 z" fill="#08060c"/>

  <!-- mijnbasis boven -->
  <path d="M28 52 v-26 h44 v26 z" fill="#111a2f" stroke="#ffc23c" stroke-width="1.6"/>
  <rect x="42" y="36" width="16" height="16" fill="#ffc23c" opacity=".9"/>
  <path d="M236 52 v-22 h40 v22 z" fill="#111a2f" stroke="#06d6a0" stroke-width="1.6"/>
  <rect x="248" y="38" width="18" height="14" fill="#06d6a0" opacity=".85"/>

  <!-- erts in de wanden -->
  <circle cx="58" cy="108" r="16" fill="url(#ertsgloed)"/>
  <circle cx="58" cy="108" r="5" fill="#ffc23c"/>
  <circle cx="262" cy="94" r="15" fill="url(#paarsgloed)"/>
  <circle cx="262" cy="94" r="4.5" fill="#c06bff"/>
  <circle cx="96" cy="164" r="16" fill="url(#paarsgloed)"/>
  <circle cx="96" cy="164" r="5" fill="#ff5ecb"/>
  <circle cx="232" cy="158" r="15" fill="url(#ertsgloed)"/>
  <circle cx="232" cy="158" r="4.5" fill="#7ef0e0"/>

  <!-- lava onderin -->
  <path d="M0 186 q30 -12 58 -2 q26 9 52 -2 l0 18 h-110 z" fill="#7a1a08"/>
  <path d="M0 190 q30 -10 58 -1 q26 8 52 -2 l0 13 h-110 z" fill="#ff7a1a" opacity=".75"/>

  <!-- koplamp + boorwagen -->
  <circle cx="160" cy="118" r="54" fill="url(#lamp)"/>
  <g transform="translate(160 112)">
    <rect x="-24" y="-16" width="48" height="26" rx="7" fill="#2b3350" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-16" y="-11" width="16" height="10" rx="3" fill="#0a1026" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="-12" cy="11" r="6" fill="#151b2c" stroke="#8fa0bd" stroke-width="1.6"/>
    <circle cx="12" cy="11" r="6" fill="#151b2c" stroke="#8fa0bd" stroke-width="1.6"/>
    <path d="M-7 9 l14 0 l-7 19 z" fill="#a855f7"/>
    <circle cx="21" cy="-5" r="3.2" fill="#ffc23c"/>
  </g>
  <circle cx="150" cy="146" r="2.4" fill="#c8b08a" opacity=".7"/>
  <circle cx="172" cy="152" r="2" fill="#c8b08a" opacity=".5"/>
</svg>
