<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Lichtlab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a0730"/><stop offset="100%" stop-color="#070a2a"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#ff4fd8" stop-opacity=".22"/><stop offset="100%" stop-color="#ff4fd8" stop-opacity="0"/></radialGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="sp" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#8a90cf"/></linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <rect width="320" height="200" fill="url(#halo)"/>
  <rect x="40" y="18" width="240" height="164" rx="10" fill="none" stroke="#ff4fd8" stroke-width="2.4" filter="url(#g)"/>
  <g fill="#ffffff" fill-opacity=".04"><rect x="60" y="38" width="200" height="124" rx="6"/></g>
  <!-- stralen -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#g)">
    <path d="M40 70 H130 V150 H220" stroke="#3ef0ff" stroke-width="4"/>
    <path d="M40 70 H130 V150 H220" stroke="#fff" stroke-width="1.3"/>
    <path d="M280 110 H180 V45" stroke="#ff4fd8" stroke-width="4"/>
    <path d="M280 110 H180 V45" stroke="#fff" stroke-width="1.3"/>
  </g>
  <!-- spiegels -->
  <g filter="url(#g)">
    <g transform="translate(130 70) rotate(45)"><rect x="-13" y="-3" width="26" height="6" rx="3" fill="url(#sp)"/></g>
    <g transform="translate(130 150) rotate(-45)"><rect x="-13" y="-3" width="26" height="6" rx="3" fill="url(#sp)"/></g>
    <g transform="translate(180 110) rotate(-45)"><rect x="-13" y="-3" width="26" height="6" rx="3" fill="url(#sp)"/></g>
    <g transform="translate(90 120) rotate(45)"><rect x="-13" y="-3" width="26" height="6" rx="3" fill="url(#sp)" opacity=".7"/></g>
  </g>
  <!-- lampen en kristallen -->
  <rect x="28" y="61" width="16" height="18" rx="4" fill="#1a1438" stroke="#fff" stroke-opacity=".4"/>
  <rect x="276" y="101" width="16" height="18" rx="4" fill="#1a1438" stroke="#fff" stroke-opacity=".4"/>
  <g filter="url(#g)">
    <path d="M226 138 l9 12 -9 12 -9 -12z" fill="#3ef0ff"/>
    <circle cx="180" cy="40" r="9" fill="#ff4fd8"/>
    <path d="M100 52 l10 16 h-20z" fill="none" stroke="#ffc83d" stroke-width="2.4"/>
  </g>
</svg>
