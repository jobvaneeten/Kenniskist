<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Meteoorvlucht">
  <defs>
    <linearGradient id="lucht" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0624"/><stop offset="60%" stop-color="#2a0b4a"/><stop offset="100%" stop-color="#5a1a6a"/>
    </linearGradient>
    <linearGradient id="grond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/><stop offset="100%" stop-color="#07030f"/>
    </linearGradient>
    <radialGradient id="maan">
      <stop offset="0%" stop-color="#ffd0f0"/><stop offset="45%" stop-color="#ff78c8" stop-opacity=".45"/><stop offset="100%" stop-color="#ff78c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vuur" cx=".6" cy=".5">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="55%" stop-color="#ff6a2d" stop-opacity=".45"/><stop offset="100%" stop-color="#ff3a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="steen" cx=".35" cy=".3">
      <stop offset="0%" stop-color="#5a4058"/><stop offset="70%" stop-color="#2a1a2a"/><stop offset="100%" stop-color="#140a14"/>
    </radialGradient>
    <linearGradient id="kaas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd34d"/><stop offset="100%" stop-color="#e0a020"/>
    </linearGradient>
    <filter id="gloed" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <rect width="320" height="200" fill="url(#lucht)"/>
  <g fill="#fff" opacity=".75">
    <circle cx="30" cy="20" r="1.2"/><circle cx="92" cy="12" r="1"/><circle cx="150" cy="30" r="1.3"/><circle cx="206" cy="16" r="1"/>
    <circle cx="300" cy="40" r="1.2"/><circle cx="120" cy="54" r=".9"/><circle cx="260" cy="10" r="1.1"/>
  </g>
  <circle cx="250" cy="44" r="40" fill="url(#maan)"/>
  <circle cx="250" cy="44" r="13" fill="#ffe0f4" opacity=".9"/>

  <!-- skyline -->
  <g fill="#150a30">
    <rect x="96" y="80" width="26" height="80"/><rect x="128" y="62" width="30" height="98"/><rect x="164" y="92" width="22" height="68"/>
    <rect x="192" y="70" width="34" height="90"/><rect x="232" y="96" width="24" height="64"/><rect x="262" y="76" width="30" height="84"/>
    <rect x="296" y="100" width="24" height="60"/>
  </g>
  <g fill="#3ee8ff" opacity=".45">
    <rect x="134" y="70" width="4" height="5"/><rect x="146" y="82" width="4" height="5"/><rect x="198" y="80" width="4" height="5"/>
    <rect x="212" y="94" width="4" height="5"/><rect x="268" y="86" width="4" height="5"/><rect x="280" y="100" width="4" height="5"/>
  </g>
  <g fill="#ff4fa3" opacity=".45">
    <rect x="102" y="92" width="4" height="5"/><rect x="170" y="102" width="4" height="5"/><rect x="238" y="106" width="4" height="5"/>
  </g>

  <!-- grond -->
  <rect y="160" width="320" height="40" fill="url(#grond)"/>
  <line x1="0" y1="160" x2="320" y2="160" stroke="#ff4fa3" stroke-width="5" filter="url(#gloed)"/>
  <line x1="0" y1="160" x2="320" y2="160" stroke="#ff4fa3" stroke-width="2"/>
  <g stroke="#ff4fa3" stroke-opacity=".2">
    <line x1="120" y1="160" x2="100" y2="200"/><line x1="170" y1="160" x2="165" y2="200"/><line x1="220" y1="160" x2="230" y2="200"/><line x1="270" y1="160" x2="295" y2="200"/>
  </g>

  <!-- kristal om over te springen -->
  <g transform="translate(250 160)">
    <path d="M-10 0 V-26 L-3 -36 L4 -26 V0 Z" fill="#9fefff" opacity=".9"/>
    <path d="M2 0 V-18 L8 -26 L14 -18 V0 Z" fill="#b99bff" opacity=".85"/>
  </g>

  <!-- meteoor met vuurstaart -->
  <ellipse cx="18" cy="118" rx="96" ry="54" fill="url(#vuur)"/>
  <circle cx="50" cy="118" r="44" fill="url(#steen)"/>
  <g fill="#000" opacity=".3"><circle cx="36" cy="104" r="8"/><circle cx="64" cy="126" r="6"/><circle cx="44" cy="138" r="5"/></g>
  <path d="M20 112 L34 116 L38 130 L52 136 M58 84 L62 102 L78 106" fill="none" stroke="#ffb040" stroke-width="3" stroke-linecap="round" filter="url(#gloed)"/>
  <path d="M20 112 L34 116 L38 130 L52 136 M58 84 L62 102 L78 106" fill="none" stroke="#ffd27a" stroke-width="1.6" stroke-linecap="round"/>

  <!-- munten in een boog -->
  <g fill="#ffd34d">
    <circle cx="208" cy="110" r="5"/><circle cx="228" cy="96" r="5"/><circle cx="250" cy="92" r="5"/><circle cx="272" cy="96" r="5"/>
  </g>

  <!-- rennend kaasblokje -->
  <g transform="translate(150 160)">
    <line x1="-5" y1="-12" x2="-12" y2="-2" stroke="#b8860b" stroke-width="5" stroke-linecap="round"/>
    <line x1="5" y1="-12" x2="12" y2="-4" stroke="#e0a020" stroke-width="5" stroke-linecap="round"/>
    <g transform="rotate(5 0 -32)">
      <rect x="-20" y="-54" width="40" height="40" rx="8" fill="url(#kaas)" stroke="#000" stroke-opacity=".3" stroke-width="2"/>
      <g fill="#c98a12"><circle cx="-10" cy="-44" r="4.5"/><circle cx="8" cy="-22" r="4"/><circle cx="-12" cy="-24" r="3"/></g>
      <ellipse cx="3" cy="-38" rx="5" ry="5.8" fill="#fff"/><ellipse cx="13" cy="-38" rx="5" ry="5.8" fill="#fff"/>
      <circle cx="5" cy="-37" r="2.6" fill="#141726"/><circle cx="15" cy="-37" r="2.6" fill="#141726"/>
      <path d="M5 -27 Q9 -23 13 -27" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
