<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Neonglij">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#071433"/><stop offset="100%" stop-color="#2a0c3a"/></linearGradient>
    <radialGradient id="halo" cx="45%" cy="50%" r="60%"><stop offset="0%" stop-color="#3ef0ff" stop-opacity=".28"/><stop offset="100%" stop-color="#3ef0ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ijs" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#aae6ff" stop-opacity=".24"/><stop offset="100%" stop-color="#5aaaff" stop-opacity=".1"/></linearGradient>
    <radialGradient id="bal" cx="38%" cy="35%" r="65%"><stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#3ef0ff"/><stop offset="100%" stop-color="#14a9c4"/></radialGradient>
    <radialGradient id="plas" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3ef0ff" stop-opacity=".45"/><stop offset="100%" stop-color="#3ef0ff" stop-opacity="0"/></radialGradient>
    <filter id="gloed" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="spoor" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3ef0ff" stop-opacity="0"/><stop offset="100%" stop-color="#3ef0ff" stop-opacity=".7"/></linearGradient>
    <pattern id="tegel" width="26" height="26" patternUnits="userSpaceOnUse" x="56" y="22"><rect x="1.5" y="1.5" width="23" height="23" rx="5" fill="url(#ijs)" stroke="#c8f0ff" stroke-opacity=".18"/><path d="M6 17 L11 8" stroke="#fff" stroke-opacity=".14" stroke-width="1.2" stroke-linecap="round"/></pattern>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <rect width="320" height="200" fill="url(#halo)"/>
  <g fill="#cfe8ff" opacity=".5"><circle cx="20" cy="20" r="1"/><circle cx="300" cy="30" r="1.2"/><circle cx="290" cy="180" r="1"/><circle cx="24" cy="170" r="1.1"/><circle cx="160" cy="10" r=".8"/></g>
  <!-- speelveld 8 x 6 -->
  <rect x="56" y="22" width="208" height="156" fill="url(#tegel)"/>
  <g fill="#0d1030"><rect x="134" y="48" width="26" height="26"/><rect x="186" y="126" width="26" height="26"/></g>
  <g fill="none" stroke="#3ef0ff" stroke-width="2.4" stroke-linecap="round" filter="url(#gloed)">
    <rect x="56" y="22" width="208" height="156" rx="3"/>
    <rect x="134" y="48" width="26" height="26" rx="2"/>
    <rect x="186" y="126" width="26" height="26" rx="2"/>
  </g>
  <!-- spoor en bolletje -->
  <rect x="70" y="97" width="70" height="20" rx="10" fill="url(#spoor)" opacity=".8"/>
  <circle cx="148" cy="113" r="30" fill="url(#plas)"/>
  <circle cx="148" cy="107" r="10.5" fill="url(#bal)" filter="url(#gloed)"/>
  <circle cx="144" cy="103" r="2.6" fill="#fff" opacity=".9"/>
  <!-- kristallen -->
  <g filter="url(#gloed)">
    <path d="M226 26 l7 9 -7 12 -7 -12z" transform="translate(0,4)" fill="#ffc83d"/>
    <path d="M95 132 l7 9 -7 12 -7 -12z" fill="#ffc83d"/>
  </g>
  <!-- blok, portaal, uitgang -->
  <g filter="url(#gloed)">
    <rect x="219" y="98" width="20" height="20" rx="4" fill="#4a2fa0" stroke="#c4a8ff" stroke-width="1.6"/>
    <path d="M224 103 l10 10 M234 103 l-10 10" stroke="#c4a8ff" stroke-opacity=".6" stroke-width="1.4"/>
    <circle cx="82" cy="35" r="8" fill="none" stroke="#ff4fd8" stroke-width="2.2" stroke-dasharray="7 5"/>
    <circle cx="200" cy="61" r="9" fill="none" stroke="#7dfff0" stroke-width="2.2" stroke-dasharray="11 4"/>
    <circle cx="200" cy="61" r="4.5" fill="none" stroke="#7dfff0" stroke-width="1.6" opacity=".7"/>
  </g>
</svg>
