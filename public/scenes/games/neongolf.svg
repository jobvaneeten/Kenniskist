<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Neongolf">
  <defs>
    <linearGradient id="lucht" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070821"/><stop offset="100%" stop-color="#03040c"/>
    </linearGradient>
    <radialGradient id="vloer" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#16205a"/><stop offset="100%" stop-color="#0a0d2a"/>
    </radialGradient>
    <radialGradient id="bal" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c9d3ea"/>
    </radialGradient>
    <filter id="gloed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="raster" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#3ef0ff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="320" height="200" fill="url(#lucht)"/>
  <g fill="#fff">
    <circle cx="20" cy="18" r="1"/><circle cx="300" cy="26" r="1.2"/><circle cx="160" cy="10" r=".9"/><circle cx="62" cy="186" r="1"/><circle cx="276" cy="186" r=".9"/>
  </g>
  <!-- L-vormige baan -->
  <path d="M30 34 H290 V170 H190 V110 H30 Z" fill="url(#vloer)"/>
  <path d="M30 34 H290 V170 H190 V110 H30 Z" fill="url(#raster)"/>
  <!-- zand -->
  <rect x="214" y="40" width="70" height="40" rx="4" fill="#d6a048" fill-opacity=".3" stroke="#ffc86e" stroke-opacity=".55" stroke-dasharray="4 4"/>
  <path d="M30 34 H290 V170 H190 V110 H30 Z" fill="none" stroke="#3ef0ff" stroke-width="3" filter="url(#gloed)" stroke-linejoin="round"/>
  <!-- bumper -->
  <circle cx="150" cy="72" r="13" fill="#ff4fa3" fill-opacity=".25" stroke="#ff4fa3" stroke-width="3" filter="url(#gloed)"/>
  <circle cx="150" cy="72" r="5" fill="#fff" fill-opacity=".7"/>
  <!-- molen -->
  <g transform="translate(240 128) rotate(20)" filter="url(#gloed)" stroke="#c06bff" stroke-width="7" stroke-linecap="round">
    <line x1="-26" y1="0" x2="26" y2="0"/><line x1="0" y1="-26" x2="0" y2="26"/>
  </g>
  <circle cx="240" cy="128" r="7" fill="#1a0f33" stroke="#c06bff" stroke-width="2.5"/>
  <!-- richtlijn + bal -->
  <g fill="#fff">
    <circle cx="72" cy="66" r="2"/><circle cx="86" cy="60" r="2" fill-opacity=".85"/><circle cx="100" cy="54" r="2" fill-opacity=".7"/><circle cx="114" cy="48" r="2" fill-opacity=".55"/>
  </g>
  <path d="M54 76 L40 82" stroke="#8cff5a" stroke-width="4" stroke-linecap="round"/>
  <path d="M58 62 A12 12 0 0 1 70 74" fill="none" stroke="#8cff5a" stroke-width="3" filter="url(#gloed)"/>
  <circle cx="58" cy="73" r="7" fill="url(#bal)" filter="url(#gloed)"/>
  <!-- gat + vlag -->
  <circle cx="264" cy="152" r="9" fill="#020604" stroke="#8cff5a" stroke-width="2.5" filter="url(#gloed)"/>
  <line x1="264" y1="152" x2="264" y2="118" stroke="#dfe6ff" stroke-width="2"/>
  <path d="M264 118 Q275 121 283 125 Q274 129 264 132 Z" fill="#8cff5a" filter="url(#gloed)"/>
</svg>
