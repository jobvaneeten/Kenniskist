<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Neonhockey">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a0820"/><stop offset="100%" stop-color="#03040c"/></linearGradient>
    <linearGradient id="tafel" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#071628"/><stop offset="50%" stop-color="#0b0d24"/><stop offset="100%" stop-color="#120a2a"/></linearGradient>
    <radialGradient id="cy" cx="0" cy="50%" r="60%"><stop offset="0%" stop-color="#3ef0ff" stop-opacity=".22"/><stop offset="100%" stop-color="#3ef0ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="mg" cx="100%" cy="50%" r="60%"><stop offset="0%" stop-color="#ff4fd8" stop-opacity=".22"/><stop offset="100%" stop-color="#ff4fd8" stop-opacity="0"/></radialGradient>
    <radialGradient id="stickA" cx="45%" cy="35%" r="65%"><stop offset="0%" stop-color="#d8fdff"/><stop offset="60%" stop-color="#3ef0ff"/><stop offset="100%" stop-color="#0b6c78"/></radialGradient>
    <radialGradient id="stickB" cx="45%" cy="35%" r="65%"><stop offset="0%" stop-color="#ffd8f6"/><stop offset="60%" stop-color="#ff4fd8"/><stop offset="100%" stop-color="#7a1066"/></radialGradient>
    <radialGradient id="puck" cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#9aa6d8"/></radialGradient>
    <filter id="gloed" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <!-- tafel (liggend) -->
  <rect x="18" y="22" width="284" height="156" rx="18" fill="url(#tafel)"/>
  <rect x="18" y="22" width="284" height="156" rx="18" fill="url(#cy)"/>
  <rect x="18" y="22" width="284" height="156" rx="18" fill="url(#mg)"/>
  <rect x="18" y="22" width="284" height="156" rx="18" fill="none" stroke="#a0afff" stroke-opacity=".8" stroke-width="3" filter="url(#gloed)"/>
  <line x1="160" y1="22" x2="160" y2="178" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="160" cy="100" r="28" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
  <line x1="18" y1="72" x2="18" y2="128" stroke="#3ef0ff" stroke-width="6" stroke-linecap="round" filter="url(#gloed)"/>
  <line x1="302" y1="72" x2="302" y2="128" stroke="#ff4fd8" stroke-width="6" stroke-linecap="round" filter="url(#gloed)"/>
  <!-- spoor + puck -->
  <g fill="#3ef0ff">
    <circle cx="118" cy="128" r="3" opacity=".15"/><circle cx="134" cy="122" r="4" opacity=".22"/><circle cx="150" cy="115" r="5" opacity=".3"/>
    <circle cx="166" cy="108" r="6" opacity=".38"/><circle cx="182" cy="101" r="7" opacity=".46"/>
  </g>
  <circle cx="200" cy="94" r="10" fill="url(#puck)" filter="url(#gloed)"/>
  <circle cx="200" cy="94" r="6" fill="none" stroke="#28325a" stroke-opacity=".6" stroke-width="1.5"/>
  <!-- sticks -->
  <circle cx="92" cy="134" r="20" fill="url(#stickA)" filter="url(#gloed)"/>
  <circle cx="92" cy="134" r="16" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5"/>
  <circle cx="92" cy="134" r="8" fill="#e8feff"/>
  <circle cx="256" cy="80" r="20" fill="url(#stickB)" filter="url(#gloed)"/>
  <circle cx="256" cy="80" r="16" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5"/>
  <circle cx="256" cy="80" r="8" fill="#ffe8fa"/>
  <!-- vonken -->
  <g fill="#fff"><circle cx="112" cy="122" r="1.6"/><circle cx="118" cy="140" r="1.2"/><circle cx="106" cy="114" r="1.1"/></g>
</svg>
