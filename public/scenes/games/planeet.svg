<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Planetenbouwer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#07072a"/><stop offset="100%" stop-color="#1c0b36"/></linearGradient>
    <radialGradient id="neb" cx="20%" cy="18%" r="60%"><stop offset="0%" stop-color="#9b6bff" stop-opacity=".3"/><stop offset="100%" stop-color="#9b6bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%"><stop offset="72%" stop-color="#3ef0ff" stop-opacity=".45"/><stop offset="100%" stop-color="#3ef0ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="bol" cx="38%" cy="34%" r="70%"><stop offset="0%" stop-color="#5fc98a"/><stop offset="60%" stop-color="#2c7f58"/><stop offset="100%" stop-color="#14304a"/></radialGradient>
    <radialGradient id="schaduw" cx="30%" cy="28%" r="85%"><stop offset="55%" stop-color="#000014" stop-opacity="0"/><stop offset="100%" stop-color="#000019" stop-opacity=".7"/></radialGradient>
    <radialGradient id="maan" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#eef0fa"/><stop offset="100%" stop-color="#4a4c66"/></radialGradient>
    <radialGradient id="poort" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff"/><stop offset="35%" stop-color="#9b6bff" stop-opacity=".6"/><stop offset="100%" stop-color="#9b6bff" stop-opacity="0"/></radialGradient>
    <clipPath id="rond"><circle cx="160" cy="104" r="58"/></clipPath>
    <filter id="gloed" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <rect width="320" height="200" fill="url(#neb)"/>
  <g fill="#fff" opacity=".6">
    <circle cx="24" cy="30" r="1"/><circle cx="62" cy="160" r=".9"/><circle cx="290" cy="22" r="1.2"/><circle cx="270" cy="150" r="1"/>
    <circle cx="300" cy="96" r=".8"/><circle cx="18" cy="110" r=".8"/><circle cx="120" cy="18" r="1"/><circle cx="210" cy="188" r=".9"/>
    <circle cx="96" cy="186" r=".7"/><circle cx="244" cy="58" r=".7"/>
  </g>
  <!-- ringen achterkant -->
  <g fill="none" stroke-width="4" opacity=".55">
    <path d="M78 104 A82 24 0 0 1 242 104" stroke="#ffd68c"/>
    <path d="M70 104 A90 27 0 0 1 250 104" stroke="#ff8cdc"/>
  </g>
  <!-- planeet -->
  <circle cx="160" cy="104" r="70" fill="url(#atmo)"/>
  <circle cx="160" cy="104" r="58" fill="url(#bol)"/>
  <g clip-path="url(#rond)">
    <ellipse cx="130" cy="92" rx="16" ry="22" fill="#2878e6"/>
    <ellipse cx="188" cy="124" rx="22" ry="16" fill="#2878e6"/>
    <ellipse cx="186" cy="76" rx="10" ry="8" fill="#2878e6"/>
