    <g fill="#1f9d55"><circle cx="152" cy="112" r="4"/><circle cx="160" cy="104" r="3.5"/><circle cx="146" cy="128" r="3.5"/><circle cx="170" cy="96" r="3"/><circle cx="142" cy="70" r="3"/></g>
    <g fill="#141a3a" filter="url(#gloed)">
      <rect x="166" y="138" width="4" height="12" fill="#3ef0ff"/><rect x="172" y="134" width="4" height="16" fill="#ff4fd8"/><rect x="178" y="140" width="4" height="10" fill="#3ef0ff"/>
    </g>
    <g fill="#ffcf6b"><rect x="198" y="96" width="3" height="3"/><rect x="204" y="100" width="3" height="3"/><rect x="200" y="106" width="3" height="3"/></g>
    <rect x="100" y="44" width="120" height="120" fill="url(#schaduw)"/>
  </g>
  <!-- ringen voorkant -->
  <g fill="none" stroke-width="4">
    <path d="M78 104 A82 24 0 0 0 242 104" stroke="#ffd68c"/>
    <path d="M70 104 A90 27 0 0 0 250 104" stroke="#ff8cdc"/>
  </g>
  <!-- maan, satelliet, raket, poort -->
  <circle cx="262" cy="56" r="13" fill="url(#maan)"/>
  <circle cx="258" cy="52" r="3" fill="#3a3c58" opacity=".4"/><circle cx="266" cy="62" r="2" fill="#3a3c58" opacity=".4"/>
  <g transform="translate(92 46)"><rect x="-3" y="-3" width="6" height="6" fill="#d6dcf0"/><rect x="-13" y="-2" width="9" height="4" fill="#3d7bff"/><rect x="4" y="-2" width="9" height="4" fill="#3d7bff"/></g>
  <g transform="translate(226 150) rotate(40)">
    <path d="M0 -12 Q5 -4 4 7 L-4 7 Q-5 -4 0 -12Z" fill="#f2f4ff"/><circle cx="0" cy="-3" r="2" fill="#3ef0ff"/>
    <path d="M-3 7 L0 16 L3 7Z" fill="#ffb347" filter="url(#gloed)"/>
  </g>
  <g filter="url(#gloed)">
    <ellipse cx="50" cy="70" rx="22" ry="12" fill="none" stroke="#3ef0ff" stroke-width="2.5"/>
    <ellipse cx="50" cy="70" rx="17" ry="9" fill="none" stroke="#ff4fd8" stroke-width="2"/>
  </g>
  <ellipse cx="50" cy="70" rx="16" ry="8" fill="url(#poort)"/>
</svg>
