<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Tower Defense">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0b0826"/><stop offset="100%" stop-color="#04040e"/></linearGradient>
    <radialGradient id="halo" cx="30%" cy="10%" r="70%"><stop offset="0%" stop-color="#3ef0ff" stop-opacity=".22"/><stop offset="100%" stop-color="#3ef0ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo2" cx="85%" cy="100%" r="60%"><stop offset="0%" stop-color="#9b6bff" stop-opacity=".25"/><stop offset="100%" stop-color="#9b6bff" stop-opacity="0"/></radialGradient>
    <filter id="gloed" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="rood" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#ffb3c0"/><stop offset="55%" stop-color="#ff3b5c"/><stop offset="100%" stop-color="#8c1027"/></radialGradient>
    <radialGradient id="blauw" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#b8d4ff"/><stop offset="55%" stop-color="#3d8bff"/><stop offset="100%" stop-color="#15367a"/></radialGradient>
    <radialGradient id="geel" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#fff6c2"/><stop offset="55%" stop-color="#ffe03d"/><stop offset="100%" stop-color="#8a7300"/></radialGradient>
    <radialGradient id="kern" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#fff"/><stop offset="45%" stop-color="#9df7ff"/><stop offset="100%" stop-color="#9b6bff"/></radialGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <rect width="320" height="200" fill="url(#halo)"/>
  <rect width="320" height="200" fill="url(#halo2)"/>
  <g fill="#fff" opacity=".45"><circle cx="20" cy="20" r="1"/><circle cx="300" cy="30" r="1.2"/><circle cx="160" cy="12" r=".9"/><circle cx="300" cy="185" r="1"/><circle cx="12" cy="180" r="1.1"/></g>
  <!-- pad -->
  <g fill="none" stroke-linejoin="round">
    <path d="M-10 52H230V120H70V168H262" stroke="#3ef0ff" stroke-width="30" stroke-opacity=".5" filter="url(#gloed)"/>
    <path d="M-10 52H230V120H70V168H262" stroke="#3ef0ff" stroke-width="28"/>
    <path d="M-10 52H230V120H70V168H262" stroke="#0a0c26" stroke-width="24"/>
    <path d="M-10 52H230V120H70V168H262" stroke="#3ef0ff" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="5 9"/>
  </g>
  <!-- kern -->
  <g transform="translate(270 168)" filter="url(#gloed)"><path d="M0-17L12 0 0 17-12 0z" fill="url(#kern)"/><circle r="21" fill="none" stroke="#3ef0ff" stroke-width="2"/></g>
  <!-- torens -->
  <g transform="translate(120 86)">
    <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#121540" stroke="#3ef0ff" stroke-width="2"/>
    <rect x="0" y="-2" width="16" height="4" rx="1" fill="#3ef0ff" transform="rotate(-35)"/><circle r="6" fill="#122040" stroke="#3ef0ff" stroke-width="1.5"/>
  </g>
  <g transform="translate(270 86)">
    <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#121540" stroke="#ff7a2f" stroke-width="2"/>
    <rect x="-2" y="-4" width="18" height="8" rx="2" fill="#3a2214" stroke="#ff7a2f" stroke-width="1.5" transform="rotate(150)"/><circle r="8" fill="#26160d" stroke="#ff7a2f" stroke-width="1.5"/>
  </g>
  <g transform="translate(160 146)">
    <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#121540" stroke="#ff4fd8" stroke-width="2"/>
    <path d="M11-6L0-9-7 0 0 9z" fill="#2a0f2c" stroke="#ff4fd8" stroke-width="1.5" transform="rotate(-70)"/>
  </g>
  <!-- straal -->
  <path d="M157 140L190 116" stroke="#ff4fd8" stroke-width="3" stroke-linecap="round" filter="url(#gloed)"/>
  <path d="M126 82L142 66" stroke="#3ef0ff" stroke-width="3" stroke-linecap="round" filter="url(#gloed)"/>
  <!-- ballonnen -->
  <g filter="url(#gloed)">
    <ellipse cx="60" cy="50" rx="10" ry="11" fill="url(#rood)"/>
    <ellipse cx="100" cy="50" rx="10" ry="11" fill="url(#blauw)"/>
    <ellipse cx="150" cy="50" rx="10" ry="11" fill="url(#geel)"/>
    <ellipse cx="198" cy="118" rx="10" ry="11" fill="url(#rood)"/>
  </g>
  <g fill="#fff" opacity=".6"><ellipse cx="56" cy="45" rx="2.5" ry="3.5"/><ellipse cx="96" cy="45" rx="2.5" ry="3.5"/><ellipse cx="146" cy="45" rx="2.5" ry="3.5"/><ellipse cx="194" cy="113" rx="2.5" ry="3.5"/></g>
  <!-- knal -->
  <g stroke="#ffe03d" stroke-width="2" stroke-linecap="round" filter="url(#gloed)" transform="translate(148 62)"><path d="M0-6v-5M6 0h5M-6 0h-5M4 4l4 4M-4 4l-4 4"/></g>
</svg>
