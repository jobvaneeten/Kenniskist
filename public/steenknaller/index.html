<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Steenknaller</title>
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --ink:#eef3ff; --dim:#8f9bc4; --cyaan:#3ef0ff; --magenta:#ff4fd8; --goud:#ffc83d; --violet:#9b6bff; --rood:#ff4f6a;
    --disp:'Russo One',system-ui,sans-serif; --body:'Outfit','Nunito',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#06061a;}
  body{font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}

  #hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:5px;}
  #lvl{font-family:var(--disp);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);}
  #harten{display:flex;gap:4px;}
  #harten svg{width:18px;height:18px;}
  #harten .leeg{opacity:.22;}
  #punten{position:fixed;top:14px;left:12px;z-index:5;pointer-events:none;font-family:var(--disp);font-size:20px;font-variant-numeric:tabular-nums;
          text-shadow:0 0 14px rgba(62,240,255,.6);}
  #powers{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;display:flex;gap:8px;}
  #powers span{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800;background:rgba(16,18,40,.75);border:1px solid rgba(255,255,255,.2);}
  .rondknop{position:fixed;z-index:20;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
            color:var(--ink);background:rgba(16,18,40,.75);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);cursor:pointer;padding:0;}
  .rondknop svg{width:20px;height:20px;}
  #geluid{top:10px;right:10px;}
  #pauze{top:10px;right:60px;}
  #terug{position:fixed;top:10px;left:10px;z-index:20;padding:9px 16px;font-size:14px;color:var(--ink);font-weight:800;
         background:rgba(16,18,40,.75);border:1px solid rgba(255,255,255,.2);border-radius:999px;display:none;cursor:pointer;font-family:var(--body);}
  #terug.aan{display:block;}

  .scherm{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;
          gap:14px;padding:24px 18px;overflow-y:auto;
          background:radial-gradient(ellipse 70% 50% at 50% 22%,rgba(155,107,255,.22),transparent 70%),
                     radial-gradient(ellipse 60% 45% at 50% 100%,rgba(255,122,47,.12),transparent 70%),rgba(6,6,26,.9);
          backdrop-filter:blur(6px);}
  .scherm.aan{display:flex;}
  #menu{justify-content:flex-start;padding-top:60px;}
  h1{font-family:var(--disp);font-size:clamp(34px,10vw,60px);margin:0;letter-spacing:.04em;text-transform:uppercase;text-align:center;
     background:linear-gradient(100deg,var(--goud),#fff 45%,var(--cyaan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
     filter:drop-shadow(0 0 22px rgba(255,200,61,.3));}
  h2{font-family:var(--disp);font-size:clamp(24px,7vw,36px);margin:0;letter-spacing:.06em;text-transform:uppercase;text-align:center;}
  .onder{color:var(--dim);margin:0;font-size:15px;text-align:center;max-width:38ch;line-height:1.5;}
  .rij{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .nieuw{font-family:var(--disp);color:var(--goud);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 14px rgba(255,200,61,.6);
         animation:puls 1s ease-in-out infinite alternate;text-align:center;}
  @keyframes puls{from{transform:scale(1)}to{transform:scale(1.08)}}
  .munt{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);color:var(--goud);}
  .munt::before{content:'';width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc83d 55%,#b8860b);
                box-shadow:0 0 10px rgba(255,200,61,.6);}
  .eindsterren{display:flex;gap:10px;}
  .eindsterren svg{width:52px;height:52px;filter:drop-shadow(0 0 12px rgba(255,200,61,.6));}
  .eindsterren .leeg{filter:none;opacity:.2;}
  .stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .stat{min-width:92px;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);text-align:center;}
  .stat b{display:block;font-family:var(--disp);font-size:20px;}
  .stat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}

  button{font-family:var(--body);font-weight:800;cursor:pointer;border-radius:999px;border:0;}
  .knop{padding:14px 32px;font-size:17px;color:#071018;letter-spacing:.04em;
        background:linear-gradient(135deg,var(--cyaan),#7dfff0);box-shadow:0 10px 28px rgba(62,240,255,.32);transition:transform .12s;}
  .knop:hover{transform:translateY(-2px);}
  .knop2{padding:12px 24px;font-size:15px;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);}
  .knop2:hover{background:rgba(255,255,255,.15);}
  .verborgen{display:none !important;}

  #kaart{width:100%;display:flex;flex-direction:column;align-items:center;}
  .wereld{width:100%;max-width:560px;}
  .wereld .kop{font-family:var(--disp);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:8px 0 8px 2px;}
  .levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .lv{position:relative;aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
      background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);color:var(--ink);font-family:var(--disp);font-size:18px;padding:0;}
  .lv:not(:disabled):hover{background:rgba(255,255,255,.11);}
  .lv:disabled{opacity:.35;cursor:default;}
  .lv.volgende{border-color:var(--cyaan);box-shadow:0 0 0 1px var(--cyaan) inset,0 0 18px rgba(62,240,255,.3);}
  .lv .st{display:flex;gap:1px;}
  .lv .st svg{width:11px;height:11px;}
  .lv .st .leeg{opacity:.2;}

  .lijst{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:100%;max-width:640px;}
  .kaart{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 10px;border-radius:16px;
         background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);}
  .kaart.gekozen{border-color:var(--cyaan);box-shadow:0 0 0 1px var(--cyaan) inset,0 0 22px rgba(62,240,255,.25);}
  .kaart canvas{position:static;width:110px;height:70px;}
  .kaart .naam{font-family:var(--disp);font-size:13px;letter-spacing:.06em;text-transform:uppercase;text-align:center;}
  .kaart button{padding:8px 14px;font-size:13px;min-width:96px;}
  .koop{color:#20140a;background:linear-gradient(135deg,var(--goud),#ffe08a);}
  .koop:disabled{background:rgba(255,255,255,.08);color:#6f7899;cursor:default;}
  .kies{color:var(--ink);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);}
  .kies.aan{color:#071018;background:linear-gradient(135deg,var(--cyaan),#7dfff0);border-color:transparent;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<svg width="0" height="0" style="position:absolute">
  <symbol id="hart" viewBox="0 0 24 24"><path fill="#ff4f6a" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></symbol>
  <symbol id="ster" viewBox="0 0 24 24"><path fill="#ffc83d" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6-4.9-4.5 6.6-.8z"/></symbol>
</svg>

<div id="hud"><div id="lvl">Level 1</div><div id="harten"></div></div>
<div id="punten">0</div>
<div id="powers"></div>
<button id="terug">‹ Menu</button>
<button class="rondknop" id="pauze" aria-label="Pauze"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
<button class="rondknop" id="geluid" aria-label="Geluid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="golf" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>

<div class="scherm aan" id="menu">
  <h1>Steenknaller</h1>
  <p class="onder">Schuif je batje heen en weer en kaats de bal tegen de stenen. Knal ze allemaal weg! Vang de power-ups die naar beneden vallen.</p>
  <div class="rij">
    <button class="knop" id="speel">Speel level 1</button>
    <button class="knop2" id="naarwinkel">Winkel · <span class="munt" id="menumunten">0</span></button>
  </div>
  <div id="kaart"></div>
</div>

<div class="scherm" id="pauzescherm">
  <h2>Pauze</h2>
  <div class="rij"><button class="knop" id="hervat">Verder</button><button class="knop2" id="stop">Stoppen</button></div>
</div>

<div class="scherm" id="einde">
  <h2 id="eindtitel">Level gehaald!</h2>
  <div class="eindsterren" id="eindsterren"></div>
  <div class="stats">
    <div class="stat"><b id="st-stenen">0</b><span>stenen</span></div>
    <div class="stat"><b id="st-punten">0</b><span>punten</span></div>
    <div class="stat"><b id="st-tijd">0</b><span>tijd</span></div>
  </div>
  <p class="onder">Verdiend: <span class="munt" id="verdiend">0</span></p>
  <div class="rij">
    <button class="knop" id="volgende">Volgend level</button>
    <button class="knop2" id="opnieuw">Opnieuw</button>
    <button class="knop verborgen" id="klaar">Klaar ✓</button>
    <button class="knop2" id="naarmenu">Menu</button>
  </div>
</div>

<div class="scherm" id="winkel">
  <h2>Winkel</h2>
  <p class="onder">Je hebt <span class="munt" id="winkelmunten">0</span> — munten verdien je met stenen en levels.</p>
  <div class="lijst" id="lijst"></div>
  <button class="knop2" id="uitwinkel">Terug</button>
</div>

<script src="kern.js"></script>
<script src="spel.js"></script>
</body>
</html>
