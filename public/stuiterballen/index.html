<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stuiterballen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eaf2ff; --dim:#8fa1c0; --cyan:#4FC3F7; --paars:#a855f7; --goud:#ffb020; --rood:#ff6b6b;
    --disp:'Russo One',system-ui,sans-serif; --body:'Outfit','Nunito',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#070a16;}
  body{font-family:var(--body);color:var(--ink);user-select:none;touch-action:none;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}

  #hud{position:fixed;top:0;left:0;right:0;padding:10px 12px;display:flex;gap:10px;
       align-items:center;justify-content:center;pointer-events:none;z-index:5;}
  .vak{background:rgba(10,16,32,0.66);border:1px solid rgba(255,255,255,0.14);
       border-radius:12px;padding:6px 12px;backdrop-filter:blur(8px);text-align:center;min-width:82px;}
  .vak b{display:block;font-family:var(--disp);font-size:18px;font-variant-numeric:tabular-nums;}
  .vak span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
  #ronde b{color:var(--cyan);} #ballen b{color:#fff;} #munt b{color:var(--goud);}

  .scherm{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;
          justify-content:center;gap:14px;padding:20px;overflow-y:auto;
          background:radial-gradient(ellipse 70% 55% at 50% 28%,rgba(79,195,247,.2),transparent 70%),
                     radial-gradient(ellipse 60% 50% at 50% 100%,rgba(168,85,247,.18),transparent 70%),
                     rgba(7,10,22,.93);}
  .scherm.aan{display:flex;}
  h1{font-family:var(--disp);font-size:clamp(28px,8vw,48px);margin:0;letter-spacing:.02em;
     background:linear-gradient(100deg,#7fdcff,#fff 45%,#c9a6ff);-webkit-background-clip:text;
     background-clip:text;-webkit-text-fill-color:transparent;text-align:center;}
  .onder{color:var(--dim);margin:0;font-size:15px;text-align:center;max-width:33ch;line-height:1.5;}
  .groot{font-family:var(--disp);font-size:40px;color:var(--goud);margin:0;}
  .rij{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  button{font-family:var(--body);font-weight:800;cursor:pointer;border-radius:999px;border:0;}
  .knop{padding:14px 30px;font-size:17px;color:#08131f;
        background:linear-gradient(135deg,var(--cyan),#7f8cff);
        box-shadow:0 10px 26px rgba(79,195,247,.3);transition:transform .12s;}
  .knop:hover{transform:translateY(-2px);}
  .knop2{padding:12px 24px;font-size:15px;color:var(--ink);background:rgba(255,255,255,.09);
         border:1px solid rgba(255,255,255,.2);}
  .knop2:hover{background:rgba(255,255,255,.17);}

  #terug{position:fixed;top:10px;left:10px;z-index:20;padding:8px 16px;font-size:14px;
         color:var(--ink);background:rgba(10,16,32,.75);border:1px solid rgba(255,255,255,.2);
         border-radius:999px;display:none;}
  #terug.aan{display:block;}

  .beurs{font-family:var(--disp);font-size:20px;color:var(--goud);}
  .lijst{display:flex;flex-direction:column;gap:9px;width:100%;max-width:440px;}
  .kaart{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:14px;
         background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);}
  .kaart .ico{font-size:24px;width:34px;text-align:center;}
  .kaart .tekst{flex:1;min-width:0;}
  .kaart .naam{font-weight:800;font-size:15px;}
  .kaart .uitleg{font-size:12px;color:var(--dim);line-height:1.35;}
  .balk{display:flex;gap:3px;margin-top:5px;}
  .bol{width:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.16);}
  .bol.vol{background:linear-gradient(90deg,var(--cyan),var(--paars));}
  .koop{padding:9px 14px;font-size:13px;color:#08131f;background:linear-gradient(135deg,var(--goud),#ffd166);
        min-width:74px;box-shadow:0 6px 16px rgba(255,176,32,.25);}
  .koop:disabled{background:rgba(255,255,255,.09);color:#6d7d96;box-shadow:none;cursor:default;}
  .koop.max{background:rgba(79,195,247,.2);color:var(--cyan);}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .tab{padding:9px 18px;font-size:14px;border-radius:999px;color:var(--dim);
       background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);}
  .tab.aan{color:#08131f;background:linear-gradient(135deg,var(--cyan),#7f8cff);border-color:transparent;}
  .staal{width:38px;height:38px;border-radius:11px;flex-shrink:0;border:2px solid rgba(255,255,255,.25);}
  .kies{padding:9px 14px;font-size:13px;min-width:74px;color:var(--ink);
        background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);}
  .kies.aan{color:#08131f;background:linear-gradient(135deg,#8ee06a,#bdf58e);border-color:transparent;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="vak" id="ronde"><b id="rondeN">1</b><span>ronde</span></div>
  <div class="vak" id="ballen"><b id="ballenN">3</b><span>ballen</span></div>
  <div class="vak" id="munt"><b id="muntN">0</b><span>munten</span></div>
</div>

<button id="terug">← Menu</button>

<div class="scherm aan" id="menu">
  <h1>Stuiterballen</h1>
  <p class="onder">Mik en schiet je ballen tegen de blokken. Elk getal is het aantal keer dat het blok nog geraakt moet worden.</p>
  <p class="onder" id="record"></p>
  <div class="rij">
    <button class="knop" id="speel">Spelen ▶</button>
    <button class="knop2" id="naarwinkel">🛒 Winkel</button>
  </div>
  <p class="onder" style="font-size:13px">Pak de <b style="color:#fff">+1</b> bolletjes: die geven je een bal erbij.</p>
</div>

<div class="scherm" id="winkel">
  <h1 style="font-size:clamp(24px,7vw,38px)">Winkel</h1>
  <p class="beurs">🪙 <span id="beurs">0</span></p>
  <div class="tabs">
    <button class="tab aan" data-tab="upgrades">Upgrades</button>
    <button class="tab" data-tab="omgeving">Omgeving</button>
    <button class="tab" data-tab="bal">Ballen</button>
  </div>
  <div class="lijst" id="lijst"></div>
  <button class="knop" id="uitwinkel">Terug</button>
</div>

<div class="scherm" id="einde">
  <h1 style="font-size:clamp(24px,7vw,38px)" id="eindetitel">Vol!</h1>
  <p class="groot">Ronde <span id="eindronde">1</span></p>
  <p class="onder"><span id="eindblok">0</span> blokken kapot</p>
  <p class="onder">Je verdiende <b style="color:var(--goud)">🪙 <span id="eindmunt">0</span></b> voor de winkel.</p>
  <p class="onder" id="eindrecord"></p>
  <div class="rij">
    <button class="knop" id="nogeens">Nog een keer ▶</button>
    <button class="knop2" id="naarwinkel2">🛒 Winkel</button>
  </div>
  <button class="knop2" id="klaar" style="display:none">Verder →</button>
</div>

<script>
(function(){
'use strict';

// ── Eigen muntenpotje ───────────────────────────────────────────────────────
var SLEUTEL = 'kk_stuiterballen';
function laad(){
  try {
    var s = JSON.parse(localStorage.getItem(SLEUTEL) || '{}');
    return { munten: s.munten|0, record: s.record|0, lv: s.lv || {}, bezit: s.bezit, keuze: s.keuze };
  } catch(e){ return { munten:0, record:0, lv:{} }; }
}
function bewaar(){ try { localStorage.setItem(SLEUTEL, JSON.stringify(D)); } catch(e){} }
var D = laad();

// Prijzen lopen hard op: elk volgend niveau kost drie keer zoveel. Alles
// kopen kost daardoor tientallen uren spelen — de laatste niveaus zijn echt
// iets om naartoe te sparen.
function prijsReeks(basis){ return function(n){ return Math.round(basis * Math.pow(3, n)); }; }
var getal = function(n){ return n.toLocaleString('nl-NL'); };

var UPGRADES = [
  { key:'start', ico:'⚪', naam:'Startballen', uitleg:'Je begint elke ronde met een bal meer.',            max:5, prijs:prijsReeks(150) },
  { key:'straal',ico:'📏', naam:'Mikstraal',   uitleg:'Een langere mikstraal, en later zie je de stuiter.', max:3, prijs:prijsReeks(180) },
  { key:'ruimte',ico:'⬇️', naam:'Meer ruimte', uitleg:'Het speelveld wordt een rij hoger.',                 max:3, prijs:prijsReeks(220) },
  { key:'snel',  ico:'💨', naam:'Snelle ballen',uitleg:'De ballen vliegen sneller, dus je bent eerder klaar.',max:3, prijs:prijsReeks(160) },
  { key:'bonus', ico:'🪙', naam:'Muntbonus',   uitleg:'+5% munten aan het eind van elk potje.',             max:5, prijs:prijsReeks(150) },
  { key:'dubbel',ico:'💥', naam:'Dubbelklap',  uitleg:'Soms haalt een bal er twee tellen tegelijk af.',      max:3, prijs:prijsReeks(200) },
  { key:'bolletjes',ico:'⚪', naam:'Meer bolletjes', uitleg:'Vaker een +1 bolletje in een nieuwe rij.',      max:3, prijs:prijsReeks(180) },
  { key:'zwak',  ico:'🧊', naam:'Zwakke blokken', uitleg:'Nieuwe blokken beginnen met een lager getal.',     max:3, prijs:prijsReeks(210) },
];

// ── Dingen om je spel mee op te maken ──────────────────────────────────────
// Omgevingen en ballen koop je één keer en kies je daarna vrij.
var OMGEVINGEN = [
  { id:'nacht',   naam:'Nachtblauw',    prijs:0,     kleuren:['#141c3c','#0a0f24','#070a16'], blok:['#4FC3F7','#ff7ab8'] },
  { id:'arcade',  naam:'Neon-arcade',   prijs:900,   kleuren:['#2b0f4a','#160726','#0a0413'], blok:['#43e8d8','#ff4fa3'] },
  { id:'zonson',  naam:'Zonsondergang', prijs:2500,  kleuren:['#7a3550','#3a1a33','#180b18'], blok:['#ffd166','#ff5c7a'] },
  { id:'bos',     naam:'Boswandeling',  prijs:6000,  kleuren:['#20452e','#12281a','#08150d'], blok:['#a6ff6b','#ffb020'] },
  { id:'ruimte',  naam:'Diepe ruimte',  prijs:12000, kleuren:['#101a44','#080d24','#03050f'], blok:['#8ea6ff','#c98bff'] },
  { id:'snoep',   naam:'Snoepwinkel',   prijs:22000, kleuren:['#5c2a52','#341730','#180a17'], blok:['#ff9ecf','#7ff5d8'] },
  { id:'lava',    naam:'Lavagrot',      prijs:35000, kleuren:['#5c1a12','#2c0d09','#140504'], blok:['#ffb020','#ff5c2a'] },
  { id:'ijs',     naam:'IJsgrot',       prijs:60000, kleuren:['#1c4a63','#0e2a3a','#06151d'], blok:['#9fe8ff','#dff6ff'] },
];
var BALLEN = [
  { id:'wit',    naam:'Witte bal', prijs:0,     kleur:'#ffffff', gloed:'#9fe8ff' },
  { id:'neon',   naam:'Neonblauw', prijs:700,   kleur:'#8ceaff', gloed:'#4FC3F7' },
  { id:'goud',   naam:'Goud',      prijs:2200,  kleur:'#ffd166', gloed:'#ffb020' },
  { id:'vuur',   naam:'Vuur',      prijs:5500,  kleur:'#ffb066', gloed:'#ff5c2a' },
  { id:'gif',    naam:'Gifgroen',  prijs:11000, kleur:'#c2ff8a', gloed:'#5ad84a' },
  { id:'plasma', naam:'Plasma',    prijs:20000, kleur:'#eaa6ff', gloed:'#a855f7' },
  { id:'regen',  naam:'Regenboog', prijs:45000, kleur:'regen',   gloed:'regen' },
];
if (!D.bezit) D.bezit = ['nacht','wit'];
if (!D.keuze) D.keuze = { omgeving:'nacht', bal:'wit' };
function heeft(id){ return D.bezit.indexOf(id) >= 0; }
function omgeving(){ return OMGEVINGEN.filter(function(o){ return o.id === D.keuze.omgeving; })[0] || OMGEVINGEN[0]; }
function balSkin(){ return BALLEN.filter(function(o){ return o.id === D.keuze.bal; })[0] || BALLEN[0]; }
function regenKleur(t){ return 'hsl(' + Math.round((t/12) % 360) + ',100%,70%)'; }
function lv(k){ return D.lv[k] | 0; }
function startBallen(){ return 3 + lv('start'); }
function straalLang(){ return 150 + lv('straal') * 120; }
function extraRijen(){ return lv('ruimte'); }
function balSnelheid(){ return 1150 + lv('snel') * 190; }
function muntF(){ return 1 + lv('bonus') * 0.05; }
function dubbelKans(){ return lv('dubbel') * 0.1; }
function bolKans(){ return 0.65 + lv('bolletjes') * 0.12; }
function blokZwakte(){ return 1 - lv('zwak') * 0.12; }

// ── Canvas en speelveld ─────────────────────────────────────────────────────
var cv = document.getElementById('c'), ctx = cv.getContext('2d');
var W=0,H=0,DPR=1;
var KOL = 7;
var px0, px1, pt, pb, bw, RIJEN;

function meet(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);

  var breed = Math.min(W - 24, (H - 190) * 0.78);
  px0 = (W - breed)/2; px1 = px0 + breed; bw = breed / KOL;
  pt = 72;
  RIJEN = Math.max(6, Math.min(9, Math.floor((H - pt - 110) / bw))) + extraRijen();
  pb = pt + RIJEN * bw;
  if (pb > H - 76){ RIJEN = Math.floor((H - 76 - pt)/bw); pb = pt + RIJEN*bw; }
}
window.addEventListener('resize', function(){ meet(); if (bezig) teken(); });

// ── Spelstand ───────────────────────────────────────────────────────────────
var bord, ronde, ballen, kapot, potje, lx, mikHoek, ballenLijst, staat,
    bezig=false, laatste=0, beurtTijd=0, terugX=null, effect=[];

function nieuwRij(){
  var rij = new Array(KOL).fill(null);
  var aantal = 3 + Math.floor(Math.random()*3);
  var plekken = [];
  for (var i=0;i<KOL;i++) plekken.push(i);
  plekken.sort(function(){ return Math.random()-0.5; });
  for (var j=0;j<aantal;j++){
    var hp = Math.max(1, Math.round(ronde * (0.6 + Math.random()*0.9) * blokZwakte()));
    rij[plekken[j]] = { hp:hp, max:hp, schud:0 };
  }
  // Meestal één bolletje dat een extra bal geeft
  if (plekken.length > aantal && Math.random() < bolKans()) rij[plekken[aantal]] = { bal:true };
  return rij;
}

function startSpel(){
  meet();
  bord = [];
  for (var i=0;i<RIJEN;i++) bord.push(new Array(KOL).fill(null));
  ronde = 1; ballen = startBallen(); kapot = 0; potje = 0;
  lx = (px0+px1)/2; mikHoek = -Math.PI/2; ballenLijst = []; effect = [];
  bord[0] = nieuwRij();
  staat = 'mikken';
  toonScherm(null); bezig = true; laatste = performance.now();
  toonHud();
  requestAnimationFrame(stap);
}

function eindeSpel(){
  bezig = false;
  var munten = Math.round(potje * muntF());
  D.munten += munten;
  var record = ronde > D.record;
  if (record) D.record = ronde;
  bewaar();
  document.getElementById('eindronde').textContent = ronde;
  document.getElementById('eindblok').textContent = kapot;
  document.getElementById('eindmunt').textContent = munten;
  document.getElementById('eindetitel').textContent = record ? 'Nieuw record!' : 'Vol!';
  document.getElementById('eindrecord').textContent = record ? '🏆 Verder dan ooit' : 'Jouw record: ronde ' + D.record;
  toonScherm('einde');
  if (BELONING){
    document.getElementById('klaar').style.display = 'block';
    document.getElementById('nogeens').style.display = 'none';
  }
}

function toonHud(){
  document.getElementById('rondeN').textContent = ronde;
  document.getElementById('ballenN').textContent = ballen;
  document.getElementById('muntN').textContent = potje;
}

// ── Schieten ────────────────────────────────────────────────────────────────
function schiet(){
  if (staat !== 'mikken' || !bezig) return;
  staat = 'schieten';
  ballenLijst = [];
  for (var i=0;i<ballen;i++){
    ballenLijst.push({ x:lx, y:pb-9, vx:0, vy:0, wacht:i*0.09, klaar:false, weg:false });
  }
  terugX = null;
  beurtTijd = 0;
}

function zakken(){
  // Alles een rij omlaag en een nieuwe rij erbij.
  var laatsteRij = bord[bord.length-1];
  for (var k=0;k<KOL;k++){
    if (laatsteRij[k] && !laatsteRij[k].bal){ eindeSpel(); return; }
  }
  bord.pop();
  bord.unshift(nieuwRij());
  ronde++;
  potje += 2;
  staat = 'mikken';
  toonHud();
}

function raakBlok(r,k,bal){
  var cel = bord[r][k];
  if (!cel) return;
  if (cel.bal){ bord[r][k] = null; ballen++; potje += 1; toonHud(); return; }
  cel.hp -= (Math.random() < dubbelKans() ? 2 : 1); cel.schud = 1;
  if (cel.hp <= 0){
    bord[r][k] = null; kapot++; potje += 1; toonHud();
    var m = vak(r,k);
    for (var i=0;i<10;i++){
      var a = Math.random()*6.2832, v = 60+Math.random()*200;
      effect.push({ x:m.x+bw/2, y:m.y+bw/2, vx:Math.cos(a)*v, vy:Math.sin(a)*v, leven:1 });
    }
  }
}

function vak(r,k){ return { x: px0 + k*bw, y: pt + r*bw }; }

// ── Loop ────────────────────────────────────────────────────────────────────
function stap(nu){
  if (!bezig) return;
  var dt = Math.min((nu-laatste)/1000, 0.033); laatste = nu;

  if (staat === 'schieten'){
    beurtTijd += dt;
    var allesKlaar = true;
    for (var i=0;i<ballenLijst.length;i++){
      var b = ballenLijst[i];
      if (b.klaar) continue;
      allesKlaar = false;
      if (b.wacht > 0){
        b.wacht -= dt;
        if (b.wacht <= 0){ b.vx = Math.cos(mikHoek)*balSnelheid(); b.vy = Math.sin(mikHoek)*balSnelheid(); }
        continue;
      }
      // Duurt een beurt te lang, dan sturen we de ballen versneld naar beneden.
      var haast = beurtTijd > 5 ? (beurtTijd > 9 ? 3.2 : 1.8) : 1;
      if (beurtTijd > 9) b.vy = Math.abs(b.vy) + 260;
      var stappen = 3, sdt = dt/stappen * haast;
      for (var s=0;s<stappen && !b.klaar;s++) beweegBal(b, sdt);
    }
    for (var e=effect.length-1;e>=0;e--){
      var f = effect[e]; f.x += f.vx*dt; f.y += f.vy*dt; f.vy += 400*dt; f.leven -= dt*1.6;
      if (f.leven <= 0) effect.splice(e,1);
    }
    if (allesKlaar){
      if (terugX != null) lx = terugX;
      zakken();
    }
  }

  for (var r=0;r<bord.length;r++) for (var k=0;k<KOL;k++){
    var c = bord[r][k];
    if (c && c.schud > 0) c.schud = Math.max(0, c.schud - dt*4);
  }

  teken();
  requestAnimationFrame(stap);
}

function beweegBal(b, dt){
  b.x += b.vx*dt; b.y += b.vy*dt;
  var R = 9;
  if (b.x < px0 + R){ b.x = px0 + R; b.vx = Math.abs(b.vx); }
  if (b.x > px1 - R){ b.x = px1 - R; b.vx = -Math.abs(b.vx); }
  if (b.y < pt + R){ b.y = pt + R; b.vy = Math.abs(b.vy); }
  if (b.y > pb - R){
    b.klaar = true;
    if (terugX == null) terugX = Math.max(px0+20, Math.min(px1-20, b.x));
    return;
  }
  // blokken
  var k0 = Math.max(0, Math.floor((b.x - px0 - R)/bw)), k1 = Math.min(KOL-1, Math.floor((b.x - px0 + R)/bw));
  var r0 = Math.max(0, Math.floor((b.y - pt - R)/bw)), r1 = Math.min(bord.length-1, Math.floor((b.y - pt + R)/bw));
  for (var r=r0;r<=r1;r++) for (var k=k0;k<=k1;k++){
    var cel = bord[r][k];
    if (!cel) continue;
    var m = vak(r,k);
    var dichtX = Math.max(m.x, Math.min(b.x, m.x+bw));
    var dichtY = Math.max(m.y, Math.min(b.y, m.y+bw));
    var dx = b.x - dichtX, dy = b.y - dichtY;
    if (dx*dx + dy*dy > R*R) continue;
    if (cel.bal){ raakBlok(r,k,b); continue; }
    // Welke kant zat hij het dichtst bij? Daar stuitert hij vanaf.
    var overX = (bw/2 + R) - Math.abs(b.x - (m.x + bw/2));
    var overY = (bw/2 + R) - Math.abs(b.y - (m.y + bw/2));
    if (overX < overY){
      b.vx = -b.vx; b.x += b.vx > 0 ? overX : -overX;
    } else {
      b.vy = -b.vy; b.y += b.vy > 0 ? overY : -overY;
    }
    raakBlok(r,k,b);
  }
}

// ── Tekenen ─────────────────────────────────────────────────────────────────
function hex(k){ return [parseInt(k.substr(1,2),16), parseInt(k.substr(3,2),16), parseInt(k.substr(5,2),16)]; }
function blokKleur(hp){
  // Van de eerste naar de tweede kleur van de omgeving: hoe hoger het getal,
  // hoe verder naar de tweede kleur.
  var pal = omgeving().blok, a = hex(pal[0]), b = hex(pal[1]);
  var t = Math.min(1, hp/14);
  return 'rgb(' + Math.round(a[0]+(b[0]-a[0])*t) + ',' + Math.round(a[1]+(b[1]-a[1])*t) + ',' + Math.round(a[2]+(b[2]-a[2])*t) + ')';
}

function teken(){
  ctx.clearRect(0,0,W,H);
  var omgKl = omgeving().kleuren;
  var g = ctx.createRadialGradient(W*0.5,H*0.3,0,W*0.5,H*0.3,Math.max(W,H)*0.8);
  g.addColorStop(0,omgKl[0]); g.addColorStop(0.6,omgKl[1]); g.addColorStop(1,omgKl[2]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // speelveld
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  ctx.fillRect(px0, pt, px1-px0, pb-pt);
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 2;
  ctx.strokeRect(px0, pt, px1-px0, pb-pt);

  // blokken
  for (var r=0;r<bord.length;r++) for (var k=0;k<KOL;k++){
    var cel = bord[r][k]; if (!cel) continue;
    var m = vak(r,k);
    if (cel.bal){
      ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(m.x+bw/2, m.y+bw/2, bw*0.17, 0, 6.2832); ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(m.x+bw/2, m.y+bw/2, bw*0.3, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = '#0a0f24'; ctx.font = '800 ' + Math.round(bw*0.2) + 'px Outfit, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('+1', m.x+bw/2, m.y+bw/2+1);
      continue;
    }
    var kl = blokKleur(cel.hp);
    var kr = cel.schud > 0 ? cel.schud*3 : 0;
    ctx.save(); ctx.translate((Math.random()-0.5)*kr, (Math.random()-0.5)*kr);
    ctx.fillStyle = kl; ctx.globalAlpha = 0.9;
    ctx.shadowColor = kl; ctx.shadowBlur = 12;
    var pad = bw*0.06, rad = bw*0.16;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(m.x+pad, m.y+pad, bw-2*pad, bw-2*pad, rad)
                  : ctx.rect(m.x+pad, m.y+pad, bw-2*pad, bw-2*pad);
    ctx.fill(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(m.x+pad*2, m.y+pad*2, bw-4*pad, bw*0.16);
    ctx.fillStyle = '#08131f'; ctx.font = '800 ' + Math.round(bw*0.4) + 'px Outfit, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(cel.hp, m.x+bw/2, m.y+bw/2+1);
    ctx.restore();
  }

  // onderlijn
  ctx.strokeStyle = 'rgba(255,107,107,0.55)'; ctx.lineWidth = 3; ctx.setLineDash([9,9]);
  ctx.beginPath(); ctx.moveTo(px0, pb); ctx.lineTo(px1, pb); ctx.stroke(); ctx.setLineDash([]);

  // deeltjes
  for (var e=0;e<effect.length;e++){
    var f = effect[e];
    ctx.globalAlpha = Math.max(0,f.leven); ctx.fillStyle = '#9fe8ff';
    ctx.beginPath(); ctx.arc(f.x,f.y,3,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // mikstraal
  if (staat === 'mikken'){
    var len = straalLang();
    var mikKl = balSkin().kleur === 'regen' ? regenKleur(performance.now()) : balSkin().kleur;
    ctx.strokeStyle = mikKl; ctx.globalAlpha = 0.75; ctx.lineWidth = 3; ctx.setLineDash([7,10]);
    ctx.beginPath(); ctx.moveTo(lx, pb-9);
    ctx.lineTo(lx + Math.cos(mikHoek)*len, pb-9 + Math.sin(mikHoek)*len);
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = mikKl;
    ctx.beginPath(); ctx.arc(lx + Math.cos(mikHoek)*len, pb-9 + Math.sin(mikHoek)*len, 4, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ballen
  var bs = balSkin();
  var balKl = bs.kleur === 'regen' ? regenKleur(performance.now()) : bs.kleur;
  ctx.fillStyle = balKl;
  ctx.shadowColor = bs.gloed === 'regen' ? balKl : bs.gloed; ctx.shadowBlur = 12;
  if (staat === 'schieten'){
    for (var i=0;i<ballenLijst.length;i++){
      var b = ballenLijst[i];
      if (b.klaar) continue;
      ctx.beginPath(); ctx.arc(b.x, b.y, 9, 0, 6.2832); ctx.fill();
    }
  } else {
    ctx.beginPath(); ctx.arc(lx, pb-9, 9, 0, 6.2832); ctx.fill();
  }
  ctx.shadowBlur = 0;
}

// ── Bediening ───────────────────────────────────────────────────────────────
function mik(e){
  if (staat !== 'mikken') return;
  var r = cv.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  var a = Math.atan2(y - (pb-9), x - lx);
  // niet vlak of naar beneden mikken
  var min = -0.22, max = -Math.PI + 0.22;
  if (a > min && a < Math.PI/2) a = min;
  else if (a >= Math.PI/2 || (a < 0 && a > max)) { if (a > 0) a = max; }
  if (a > -0.22 && a <= 0) a = -0.22;
  if (a < -Math.PI + 0.22) a = -Math.PI + 0.22;
  if (a > 0) a = a > Math.PI/2 ? -Math.PI + 0.22 : -0.22;
  mikHoek = a;
}
cv.addEventListener('pointermove', mik);
cv.addEventListener('pointerdown', function(e){ mik(e); });
cv.addEventListener('pointerup', function(e){ mik(e); schiet(); });
window.addEventListener('keydown', function(e){ if (e.code === 'Space'){ e.preventDefault(); schiet(); } });

// ── Schermen en winkel ──────────────────────────────────────────────────────
function toonScherm(naam){
  ['menu','winkel','einde'].forEach(function(id){
    document.getElementById(id).classList.toggle('aan', id === naam);
  });
  document.getElementById('hud').style.display = naam ? 'none' : 'flex';
}

var tabblad = 'upgrades';
function tekenWinkel(){
  document.getElementById('beurs').textContent = getal(D.munten);
  var lijst = document.getElementById('lijst'); lijst.innerHTML = '';
  [].forEach.call(document.querySelectorAll('.tab'), function(t){
    t.classList.toggle('aan', t.dataset.tab === tabblad);
  });
  if (tabblad !== 'upgrades') return spulLijst(lijst, tabblad === 'omgeving' ? OMGEVINGEN : BALLEN, tabblad);
  UPGRADES.forEach(function(u){
    var n = lv(u.key), vol = n >= u.max, prijs = u.prijs(n);
    var kaart = document.createElement('div'); kaart.className = 'kaart';
    var bollen = ''; for (var i=0;i<u.max;i++) bollen += '<span class="bol' + (i<n?' vol':'') + '"></span>';
    kaart.innerHTML = '<span class="ico">' + u.ico + '</span>' +
      '<span class="tekst"><span class="naam">' + u.naam + '</span>' +
      '<div class="uitleg">' + u.uitleg + '</div><div class="balk">' + bollen + '</div></span>';
    var knop = document.createElement('button');
    knop.className = 'koop' + (vol ? ' max' : '');
    knop.textContent = vol ? 'max' : '🪙 ' + getal(prijs);
    knop.disabled = vol || D.munten < prijs;
    knop.onclick = function(){ if (D.munten < prijs) return; D.munten -= prijs; D.lv[u.key] = n+1; bewaar(); tekenWinkel(); };
    kaart.appendChild(knop); lijst.appendChild(kaart);
  });
}

// Omgevingen en ballen: eerst kopen, daarna kiezen.
function spulLijst(lijst, spullen, soort){
  spullen.forEach(function(sp){
    var mijn = heeft(sp.id), gekozen = D.keuze[soort] === sp.id;
    var kaart = document.createElement('div'); kaart.className = 'kaart';
    var staal = document.createElement('span'); staal.className = 'staal';
    staal.style.background = soort === 'omgeving'
      ? 'linear-gradient(160deg,' + sp.kleuren[0] + ',' + sp.blok[0] + ' 55%,' + sp.blok[1] + ')'
      : (sp.kleur === 'regen'
          ? 'linear-gradient(135deg,#ff6b6b,#ffd166,#8ee06a,#4FC3F7,#a855f7)'
          : 'linear-gradient(135deg,' + sp.kleur + ',' + sp.gloed + ')');
    var tekst = document.createElement('span'); tekst.className = 'tekst';
    tekst.innerHTML = '<span class="naam">' + sp.naam + '</span>' +
      '<div class="uitleg">' + (mijn ? (gekozen ? 'Nu in gebruik' : 'Van jou — klik om te kiezen')
                                     : 'Nog niet van jou') + '</div>';
    var knop = document.createElement('button');
    if (mijn){
      knop.className = 'kies' + (gekozen ? ' aan' : '');
      knop.textContent = gekozen ? '✓ gekozen' : 'Kies';
      knop.disabled = gekozen;
      knop.onclick = function(){ D.keuze[soort] = sp.id; bewaar(); tekenWinkel(); };
    } else {
      knop.className = 'koop';
      knop.textContent = '🪙 ' + getal(sp.prijs);
      knop.disabled = D.munten < sp.prijs;
      knop.onclick = function(){
        if (D.munten < sp.prijs) return;
        D.munten -= sp.prijs; D.bezit.push(sp.id); D.keuze[soort] = sp.id;
        bewaar(); tekenWinkel();
      };
    }
    kaart.appendChild(staal); kaart.appendChild(tekst); kaart.appendChild(knop);
    lijst.appendChild(kaart);
  });
}

[].forEach.call(document.querySelectorAll('.tab'), function(t){
  t.onclick = function(){ tabblad = t.dataset.tab; tekenWinkel(); };
});

function toonMenu(){
  document.getElementById('record').textContent = D.record ? 'Jouw record: ronde ' + D.record : '';
  toonScherm('menu');
}

var vorigScherm = 'menu';
function naarWinkel(van){ vorigScherm = van; tekenWinkel(); toonScherm('winkel'); }
document.getElementById('speel').onclick = startSpel;
document.getElementById('nogeens').onclick = startSpel;
document.getElementById('naarwinkel').onclick = function(){ naarWinkel('menu'); };
document.getElementById('naarwinkel2').onclick = function(){ naarWinkel('einde'); };
document.getElementById('uitwinkel').onclick = function(){ if (vorigScherm === 'einde') toonScherm('einde'); else toonMenu(); };

// ── Inbedding ───────────────────────────────────────────────────────────────
var params = new URLSearchParams(location.search);
var BELONING = !params.has('terug');
if (!BELONING){
  var t = document.getElementById('terug');
  t.classList.add('aan');
  t.onclick = function(){ parent.postMessage({ type:'stuiterballen-terug' }, '*'); };
}
document.getElementById('klaar').onclick = function(){ parent.postMessage({ type:'stuiterballen-gameover' }, '*'); };

meet();
toonMenu();
})();
