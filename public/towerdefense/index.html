<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tower Defense</title>
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --ink:#eef3ff; --dim:#8f9bc4; --cyaan:#3ef0ff; --magenta:#ff4fd8; --goud:#ffc83d; --violet:#9b6bff; --rood:#ff4f6a; --groen:#8cff5a;
    --glas:rgba(14,16,40,.78); --lijn:rgba(255,255,255,.14);
    --disp:'Russo One',system-ui,sans-serif; --body:'Outfit','Nunito',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#06061a;}
  body{font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;}
  button{font-family:var(--body);font-weight:800;cursor:pointer;border:0;color:inherit;}
  .verborgen{display:none !important;}

  /* ── bovenbalk ── */
  #bar{position:fixed;top:0;left:0;right:0;height:52px;z-index:12;display:flex;align-items:center;gap:8px;padding:8px 10px;pointer-events:none;}
  #bar > *{pointer-events:auto;}
  .pil{height:36px;display:flex;align-items:center;gap:7px;padding:0 13px;border-radius:999px;background:var(--glas);border:1px solid var(--lijn);
       backdrop-filter:blur(8px);font-family:var(--disp);font-size:15px;letter-spacing:.04em;white-space:nowrap;}
  .pil svg{width:17px;height:17px;flex:none;}
  #terug{font-family:var(--body);font-weight:800;font-size:14px;}
  #levelnaam{color:var(--dim);font-size:12px;letter-spacing:.14em;text-transform:uppercase;}
  #golfpil b{color:var(--cyaan);}
  .ruimte{flex:1;}
  #levenspil.au{animation:au .45s;}
  @keyframes au{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  #goudpil{color:var(--goud);}
  #goudpil.op{animation:pop .3s;}
  @keyframes pop{50%{transform:scale(1.12)}}
  .rondknop{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;
            background:var(--glas);border:1px solid var(--lijn);backdrop-filter:blur(8px);}
  .rondknop svg{width:18px;height:18px;}
  #snel{width:auto;padding:0 12px;font-family:var(--disp);font-size:14px;border-radius:999px;}
  #snel.aan{color:#071018;background:linear-gradient(135deg,var(--cyaan),#7dfff0);border-color:transparent;}

  /* ── zijpaneel ── */
  #paneel{position:fixed;z-index:4;display:flex;flex-direction:column;gap:8px;padding:10px;overflow-y:auto;background:var(--glas);
          border:1px solid var(--lijn);border-radius:18px;backdrop-filter:blur(10px);}
  #paneel .kop{font-family:var(--disp);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);text-align:center;}
  #winkel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .toren{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px 5px;border-radius:12px;
         background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);transition:transform .1s, background .15s;}
  .toren:hover{background:rgba(255,255,255,.1);}
  .toren canvas{width:38px;height:38px;}
  .toren .nm{font-family:var(--disp);font-size:9.5px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;}
  .toren .pr{font-family:var(--disp);font-size:11px;color:var(--goud);}
  .toren.duur{opacity:.45;}
  .toren.duur .pr{color:var(--rood);}
  .toren.gekozen{border-color:var(--k);box-shadow:0 0 0 1px var(--k) inset,0 0 18px color-mix(in srgb,var(--k) 45%,transparent);background:rgba(255,255,255,.1);}
  .toren.schud{animation:au .35s;}
  #uitleg{min-height:46px;font-size:12px;line-height:1.35;color:var(--dim);text-align:center;padding:0 2px;}
  #uitleg b{color:var(--ink);font-family:var(--disp);font-weight:400;letter-spacing:.04em;}
  #uitleg .zwak{color:#ff9aa9;}
  #startgolf{margin-top:auto;padding:13px 10px;border-radius:14px;font-family:var(--disp);font-weight:400;font-size:15px;letter-spacing:.06em;
             color:#071018;background:linear-gradient(135deg,var(--groen),#d6ff7a);box-shadow:0 8px 24px rgba(140,255,90,.3);text-transform:uppercase;}
  #startgolf:disabled{background:rgba(255,255,255,.07);color:var(--dim);box-shadow:none;cursor:default;}
  #startgolf.puls{animation:knipper 1.1s ease-in-out infinite alternate;}
  @keyframes knipper{to{box-shadow:0 8px 34px rgba(140,255,90,.65);transform:translateY(-1px)}}
  #autolabel{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:var(--dim);cursor:pointer;}
  #autolabel input{accent-color:#8cff5a;width:16px;height:16px;margin:0;}

  /* gekozen toren */
  #info{display:flex;flex-direction:column;gap:8px;}
  #info .rij1{display:flex;align-items:center;gap:8px;}
  #info canvas{width:46px;height:46px;flex:none;}
  #info .titel{font-family:var(--disp);font-size:15px;letter-spacing:.05em;text-transform:uppercase;}
  #info .pips{display:flex;gap:4px;margin-top:3px;}
  #info .pips i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.15);}
  #info .pips i.aan{background:var(--k);box-shadow:0 0 8px var(--k);}
  #info .sluit{margin-left:auto;align-self:flex-start;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);font-size:15px;}
  #info .feit{font-size:12px;color:var(--dim);display:flex;justify-content:space-between;}
  #info .feit b{color:var(--ink);font-weight:700;}
  #upknop,#verkoopknop{padding:11px 10px;border-radius:12px;font-size:13px;line-height:1.25;}
  #upknop{color:#071018;background:linear-gradient(135deg,var(--cyaan),#7dfff0);}
  #upknop small{display:block;font-weight:600;font-size:11px;opacity:.8;}
  #upknop:disabled{background:rgba(255,255,255,.07);color:var(--dim);cursor:default;}
  #verkoopknop{background:rgba(255,79,106,.12);border:1px solid rgba(255,79,106,.4);color:#ffb3bf;}

  /* ── melding ── */
  #melding{position:fixed;z-index:6;left:var(--mx,50%);bottom:18px;transform:translate(-50%,10px);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
           display:flex;align-items:center;gap:10px;max-width:min(560px,92vw);padding:10px 16px;border-radius:16px;background:rgba(14,16,40,.92);
           border:1px solid var(--lijn);box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:14px;line-height:1.35;}
  #melding.aan{opacity:1;transform:translate(-50%,0);}
  #melding canvas{width:34px;height:34px;flex:none;}
  #melding b{font-family:var(--disp);font-weight:400;letter-spacing:.05em;}

  /* ── schermen ── */
  .scherm{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;
          gap:14px;padding:24px 18px;overflow-y:auto;
          background:radial-gradient(ellipse 70% 50% at 50% 18%,rgba(62,240,255,.16),transparent 70%),
                     radial-gradient(ellipse 60% 45% at 50% 100%,rgba(155,107,255,.18),transparent 70%),rgba(6,6,26,.9);
          backdrop-filter:blur(6px);}
  .scherm.aan{display:flex;}
  #menu{justify-content:flex-start;padding-top:56px;}
  h1{font-family:var(--disp);font-size:clamp(32px,7vw,56px);margin:0;letter-spacing:.04em;text-transform:uppercase;text-align:center;
     background:linear-gradient(100deg,var(--groen),#fff 45%,var(--cyaan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
     filter:drop-shadow(0 0 22px rgba(62,240,255,.3));}
  h2{font-family:var(--disp);font-size:clamp(24px,6vw,36px);margin:0;letter-spacing:.06em;text-transform:uppercase;text-align:center;}
  .onder{color:var(--dim);margin:0;font-size:15px;text-align:center;max-width:52ch;line-height:1.5;}
  .rij{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .knop{padding:14px 32px;font-size:17px;color:#071018;letter-spacing:.04em;border-radius:999px;
        background:linear-gradient(135deg,var(--cyaan),#7dfff0);box-shadow:0 10px 28px rgba(62,240,255,.32);transition:transform .12s;}
  .knop:hover{transform:translateY(-2px);}
  .knop2{padding:12px 24px;font-size:15px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);}
  .knop2:hover{background:rgba(255,255,255,.15);}

  #levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px;width:100%;max-width:1000px;}
  .lvkaart{position:relative;display:flex;flex-direction:column;gap:6px;padding:10px 10px 12px;border-radius:18px;text-align:left;
           background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);transition:transform .12s,background .15s;}
  .lvkaart:not(:disabled):hover{transform:translateY(-3px);background:rgba(255,255,255,.09);border-color:var(--k);box-shadow:0 0 24px color-mix(in srgb,var(--k) 35%,transparent);}
  .lvkaart canvas{width:100%;aspect-ratio:20/12;border-radius:10px;display:block;}
  .lvkaart .nr{font-family:var(--disp);font-size:11px;letter-spacing:.16em;color:var(--k);text-transform:uppercase;}
  .lvkaart .nm{font-family:var(--disp);font-size:17px;letter-spacing:.04em;text-transform:uppercase;}
  .lvkaart .zin{font-size:12px;color:var(--dim);line-height:1.35;min-height:32px;font-weight:600;}
  .lvkaart .st{display:flex;gap:3px;}
  .lvkaart .st svg{width:17px;height:17px;}
  .leeg{opacity:.2;}
  .lvkaart:disabled{cursor:default;}
  .lvkaart:disabled > :not(.slot){opacity:.32;}
  .lvkaart .slot{position:absolute;left:10px;right:10px;top:10px;aspect-ratio:20/12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
                 font-size:12px;color:var(--dim);font-weight:700;}
  .lvkaart .slot svg{width:28px;height:28px;}
  #hoe{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;width:100%;max-width:1000px;}
  .hoe{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
       font-size:13px;line-height:1.35;color:var(--dim);}
  .hoe canvas{width:38px;height:38px;flex:none;}
  .hoe b{color:var(--ink);}

  .eindsterren{display:flex;gap:10px;}
  .eindsterren svg{width:54px;height:54px;filter:drop-shadow(0 0 12px rgba(255,200,61,.6));}
  .eindsterren .leeg{filter:none;opacity:.2;}
  .stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .stat{min-width:96px;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);text-align:center;}
  .stat b{display:block;font-family:var(--disp);font-size:20px;font-weight:400;}
  .stat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}
  .nieuw{font-family:var(--disp);color:var(--goud);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 14px rgba(255,200,61,.6);text-align:center;}

  #draai{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
         background:#06061a;text-align:center;padding:30px;font-size:16px;color:var(--dim);}
  #draai svg{width:64px;height:64px;color:var(--cyaan);animation:kantel 1.8s ease-in-out infinite;}
  @keyframes kantel{50%{transform:rotate(90deg)}}
  @media (orientation:portrait) and (max-width:700px){ #draai{display:flex;} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<svg width="0" height="0" style="position:absolute">
  <symbol id="hart" viewBox="0 0 24 24"><path fill="#ff4f6a" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></symbol>
  <symbol id="ster" viewBox="0 0 24 24"><path fill="#ffc83d" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6-4.9-4.5 6.6-.8z"/></symbol>
  <symbol id="munt" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#ffc83d"/><circle cx="12" cy="12" r="6" fill="none" stroke="#b8860b" stroke-width="1.6"/><circle cx="9.5" cy="9" r="2" fill="#fff3b0"/></symbol>
  <symbol id="slot" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
</svg>

<div id="bar">
  <button class="pil verborgen" id="terug">‹ Menu</button>
  <div class="pil" id="golfpil"><span id="levelnaam">Neonstad</span><span>Golf <b id="golfnr">0</b>/<span id="golftot">15</span></span></div>
  <div class="ruimte"></div>
  <div class="pil" id="levenspil"><svg><use href="#hart"/></svg><span id="levens">20</span></div>
  <div class="pil" id="goudpil"><svg><use href="#munt"/></svg><span id="goud">0</span></div>
  <button class="rondknop" id="snel" aria-label="Snelheid">1×</button>
  <button class="rondknop" id="pauze" aria-label="Pauze"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  <button class="rondknop" id="geluid" aria-label="Geluid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="golfje" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
</div>

<div id="paneel">
  <div id="shop">
    <div class="kop">Torens</div>
    <div id="winkel" style="margin-top:7px"></div>
  </div>
  <div id="info" class="verborgen"></div>
  <div id="uitleg"></div>
  <button id="startgolf">Start golf 1</button>
  <label id="autolabel"><input type="checkbox" id="auto"> Volgende golf vanzelf</label>
</div>

<div id="melding"></div>

<div class="scherm aan" id="menu">
  <h1>Tower Defense</h1>
  <p class="onder" id="menutekst">Bouw torens langs het pad en knal alle ballonnen kapot voordat ze je kern bereiken. Elk level heeft 15 golven.</p>
  <div id="levels"></div>
  <div id="hoe"></div>
</div>

<div class="scherm" id="pauzescherm">
  <h2>Pauze</h2>
  <div class="rij"><button class="knop" id="hervat">Verder</button><button class="knop2" id="opnieuw2">Opnieuw</button><button class="knop2" id="stop">Naar de levels</button></div>
</div>

<div class="scherm" id="einde">
  <h2 id="eindtitel">Gewonnen!</h2>
  <div class="eindsterren" id="eindsterren"></div>
  <div class="nieuw verborgen" id="ontgrendeld"></div>
  <div class="stats">
    <div class="stat"><b id="st-golf">0</b><span>golven</span></div>
    <div class="stat"><b id="st-knal">0</b><span>geknald</span></div>
    <div class="stat"><b id="st-levens">0</b><span>levens over</span></div>
  </div>
  <div class="rij">
    <button class="knop" id="volgende">Volgend level</button>
    <button class="knop2" id="opnieuw">Opnieuw</button>
    <button class="knop verborgen" id="klaar">Klaar ✓</button>
    <button class="knop2" id="naarmenu">Levels</button>
  </div>
</div>

<div id="draai">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
  Draai je scherm een kwartslag — Tower Defense speel je liggend.
</div>

<script src="kern.js"></script>
<script src="spel.js"></script>
</body>
</html>
